// ═══════════════════════════════════════════════════════════════
//  FMS — 製作管理エンジン
//  BOM取込 / 改訂差分 / 手配照合 / 製作進捗
//  ※ ロジックは実データ（Tekla BOM出力）で検証済み
// ═══════════════════════════════════════════════════════════════

// Tekla BOM の列名（ヘッダー行自動検出に使用）
const BOM_COLS = ['DWG.NO','REV.NO','REV.DATE','ITEM','ASSM-MK','SECTION','SHAPE',
  'PART-MK','PROFILE','LENGTH','TOTALQTY','WEIGHT(Kg)','PAINT','MATL',
  'FINISH','GRID','ELEV','REMARK'];

// 手配リストの列名（仕入先ごとに書式が異なるため広めに取る）
const PUR_COLS = ['PART-MK','PART_MK','PARTMK','MARK','部品番号','部材番号','部品記号','マーク','記号','品名',
  'LENGTH','長さ','長さ(mm)','長さ（mm）','切断長','材長','長','LEN',
  'QTY','TOTALQTY','QUANTITY','数量','数量（本）','員数','本数','個数',
  'PROFILE','SIZE','サイズ','SECTION','断面','寸法','材質','MATL','MATERIAL','GRADE','鋼種'];

// ヘッダー行を先頭25行から自動検出
function detectAndParse(wb, cols){
  const known = cols || BOM_COLS;
  const ws  = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let bestRow=0, bestScore=0;
  for(let i=0;i<Math.min(raw.length,25);i++){
    const row=(raw[i]||[]).map(c=>String(c).trim().toUpperCase());
    let score=0;
    for(const c of known) if(row.includes(c.toUpperCase())) score++;
    if(score>bestScore){ bestScore=score; bestRow=i; }
  }
  const headers=(raw[bestRow]||[]).map(c=>String(c).trim());
  const data=[];
  for(let i=bestRow+1;i<raw.length;i++){
    const row=raw[i]||[];
    if(row.every(c=>String(c).trim()==='')) continue;
    const o={};
    headers.forEach((h,j)=>{ if(h) o[h]=String(row[j]??'').trim(); });
    data.push(o);
  }
  return { headerRow:bestRow+1, colsFound:bestScore, headers, data };
}

// ── 数値の頑健な解釈 ──
// "3,938" / " 3938 " / 全角数字 / "*" / "TOTAL:" などに対応
function numOr(v, d){
  if(v === null || v === undefined) return d;
  let s = String(v).trim();
  if(!s || s === '*' || s === '-' || s === '—') return d;
  s = s.replace(/[０-９．，]/g, ch => '０１２３４５６７８９．，'.indexOf(ch) < 10
        ? String('０１２３４５６７８９'.indexOf(ch)) : (ch==='．'?'.':','));
  s = s.replace(/,/g, '').replace(/\s/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? d : n;
}

const isBlankMark = v => {
  const s = String(v ?? '').trim();
  return s === '' || s === '*' || s === '-' || s === '—' || s === '〃' || s === '”' || s === '"';
};

// ── Tekla BOM 行の解析 ──
// 重要: ASSM-MK は組立の先頭行にのみ入り、続く部材行は空欄または '*' になる。
//       行単位で処理すると二次部材が欠落するため、前の値を引き継ぐ（forward fill）。
function parseBomRows(rows){
  const out = [];
  const stat = { total:0, skipped:0, subtotal:0, carried:0, assemblies:new Set() };
  let lastAssm = '', lastItem = '', lastDwg = '';

  for(const r of rows){
    stat.total++;

    // 小計・合計行を除外
    const joined = Object.values(r).map(v=>String(v??'')).join(' ');
    if(/TOTAL\s*[:：]|合\s*計|小\s*計/i.test(joined) && isBlankMark(r['PART-MK'])){
      stat.subtotal++; continue;
    }

    const rawAssm = r['ASSM-MK'] ?? r['ASSEMBLY'] ?? '';
    const partMk  = String(r['PART-MK'] ?? r['PART_MK'] ?? '').trim();

    // 組立マークの引き継ぎ
    let assmMk;
    if(isBlankMark(rawAssm)){
      assmMk = lastAssm;
      if(lastAssm) stat.carried++;
    } else {
      assmMk = String(rawAssm).trim();
      lastAssm = assmMk;
    }

    // ITEM / DWG.NO も同様に引き継ぐ
    const rawItem = r['ITEM'] ?? '';
    let itemGroup;
    if(isBlankMark(rawItem)) itemGroup = lastItem;
    else { itemGroup = String(rawItem).trim(); lastItem = itemGroup; }

    const rawDwg = r['DWG.NO'] ?? '';
    let dwgNo;
    if(isBlankMark(rawDwg)) dwgNo = lastDwg;
    else { dwgNo = String(rawDwg).trim(); lastDwg = dwgNo; }

    // 組立マークが未確定、または部品マークが空の行は対象外
    if(!assmMk || partMk === ''){ stat.skipped++; continue; }

    const clean = v => { const s=String(v ?? '').trim(); return (s==='*'||s==='—')?'':s; };

    out.push({
      item_group:  itemGroup,
      assm_mk:     assmMk,
      part_mk:     partMk,
      section:     clean(r['SECTION']),
      shape:       clean(r['SHAPE']),
      profile:     clean(r['PROFILE']),
      length_mm:   numOr(r['LENGTH'], null),
      qty:         Math.round(numOr(r['TOTALQTY'] ?? r['QTY'], 0)),
      weight_kg:   numOr(r['WEIGHT(Kg)'] ?? r['WEIGHT'], null),
      paint:       clean(r['PAINT']),
      material:    clean(r['MATL'] ?? r['MATERIAL']),
      finish:      clean(r['FINISH']),
      grid:        clean(r['GRID']),
      elev:        clean(r['ELEV']),
      remark:      clean(r['REMARK']),
      dwg_no:      dwgNo,
      is_consumable: partMk === '*',
    });
    stat.assemblies.add(assmMk);
  }
  stat.assemblyCount = stat.assemblies.size;
  return { parts: out, stat };
}

// ── 列名の照合 ──
// 「長さ(mm)」「数量 (本)」のように単位や注釈が付く場合があるため、
// 完全一致 → 正規化一致 → 前方一致 の順に緩めて探す。
// 前方一致は誤検出を避けるため候補が長い順に試す。
function normHdr(s){
  return String(s ?? '')
    .replace(/[（）]/g,'')          // 全角括弧を除去
    .replace(/\(.*?\)/g,'')         // 半角括弧の中身ごと除去  長さ(mm) → 長さ
    .replace(/[\s._\-　]/g,'')      // 空白・記号を除去
    .toUpperCase();
}

function pick(row, cands){
  const keys = Object.keys(row);
  const val  = k => { const v = row[k]; return v===null||v===undefined ? '' : String(v).trim(); };

  // ① 完全一致
  for(const c of cands){
    if(row[c] !== undefined && val(c) !== '') return val(c);
  }
  // ② 正規化一致  長さ(mm) === 長さ
  for(const c of cands){
    const n = normHdr(c);
    const k = keys.find(k => normHdr(k) === n);
    if(k && val(k) !== '') return val(k);
  }
  // ③ 前方一致（長い候補から）
  const sorted = cands.slice().sort((a,b)=>normHdr(b).length-normHdr(a).length);
  for(const c of sorted){
    const n = normHdr(c);
    if(n.length < 2) continue;      // 'L' のような1文字は前方一致に使わない
    const k = keys.find(k => normHdr(k).startsWith(n));
    if(k && val(k) !== '') return val(k);
  }
  return '';
}

// 手配リスト行 → 手配品
// ── 手配リストの列対応 ──
// 自動判定したうえで、画面から手動で変更できるようにする。
// 仕入先ごとに書式が異なるため、自動判定だけに頼らない。
const PUR_FIELDS = [
  { key:'part_mk',   ja:'部品マーク', required:true,
    cands:['PART-MK','PART_MK','PARTMK','PART MARK','MARK',
           '部材番号','部品番号','部品記号','部材記号','部材マーク','部品マーク','マーク','記号','品番'] },
  { key:'length_mm', ja:'長さ',       required:true,
    cands:['LENGTH','長さ','長さ(mm)','長','切断長','材長','定尺','LEN'] },
  { key:'qty',       ja:'数量',       required:true,
    cands:['TOTALQTY','QTY','QUANTITY','数量','員数','本数','員数(本)','COUNT','個数'] },
  { key:'profile',   ja:'断面',       required:false,
    cands:['PROFILE','SECTION','サイズ','断面','寸法','SIZE','材寸'] },
  { key:'material',  ja:'材質',       required:false,
    cands:['MATL','MATERIAL','材質','鋼種','GRADE'] },
];

// ヘッダー一覧から各項目に対応する列を推定する。
// 完全一致 → 正規化一致 → 前方一致 の順。既に割当済みの列は再利用しない。
function detectPurMap(headers){
  const map  = {};
  const used = new Set();
  const hs   = (headers||[]).filter(h=>h!==null && h!==undefined && String(h).trim()!=='');

  const tryFind = (cands, test) => {
    for(const c of cands){
      const h = hs.find(h => !used.has(h) && test(h, c));
      if(h) return h;
    }
    return null;
  };

  for(const f of PUR_FIELDS){
    let h = tryFind(f.cands, (h,c)=> String(h).trim() === c);
    if(!h) h = tryFind(f.cands, (h,c)=> normHdr(h) === normHdr(c));
    if(!h) h = tryFind(f.cands, (h,c)=> {
      const n = normHdr(c);
      return n.length >= 2 && normHdr(h).startsWith(n);
    });
    map[f.key] = h || null;
    if(h) used.add(h);
  }
  return map;
}

// 手配リスト行 → 手配品
// map が渡された場合はその列対応に従う。無い場合は従来の自動判定。
function mapPurRow(r, map){
  const get = (key, cands) => {
    if(map && map[key]){
      const v = r[map[key]];
      return v===null || v===undefined ? '' : String(v).trim();
    }
    return pick(r, cands);
  };
  const F = k => PUR_FIELDS.find(f=>f.key===k).cands;
  return {
    part_mk:   get('part_mk',   F('part_mk')),
    length_mm: numOr(get('length_mm', F('length_mm')), null),
    qty:       Math.round(numOr(get('qty', F('qty')), 0)),
    profile:   get('profile',   F('profile')),
    material:  get('material',  F('material')),
  };
}

const pkey = p => (p.is_consumable || p.part_mk === '*')
  ? p.assm_mk + '||*||' + (p.profile||'') + '||' + (p.length_mm ?? '')
  : p.assm_mk + '||' + p.part_mk;

// 改訂内の部材をキーで索引化する。
// 同一キーが複数行ある場合は員数を合算する（欠落させない）。
function indexParts(parts){
  const m = {};
  for(const p of (parts||[])){
    const k = pkey(p);
    if(m[k]){
      m[k] = { ...m[k], qty: (m[k].qty||0) + (p.qty||0), _mergedRows: (m[k]._mergedRows||1)+1 };
    } else {
      m[k] = { ...p };
    }
  }
  return m;
}

// 比較対象の項目。重量は断面・長さから導出されるため対象外
// （長さが変われば重量も変わり、同じ変更が二重に出るのを避ける）
const CMP_FIELDS = [
  { f:'profile',  ja:'断面' },
  { f:'material', ja:'材質' },
  { f:'shape',    ja:'形状' },
  { f:'section',  ja:'区分' },
];

const sameVal = (a,b) => String(a ?? '').trim() === String(b ?? '').trim();

// ── マスターBOM ──
// 各改訂は不変。Rev N は Rev N−1 と比較し、差分を累積する。
function buildMaster(revisions){
  const mm = {};
  if(!revisions || !revisions.length) return mm;

  const sorted = revisions.slice().sort((a,b)=>a.rev_index-b.rev_index);

  const base = indexParts(sorted[0].parts);
  for(const [k,p] of Object.entries(base)){
    mm[k] = { ...p, revHistory:[], masterStatus:'baseline' };
  }

  for(let i=1;i<sorted.length;i++){
    const rl = 'Rev '+sorted[i].rev_index;
    const pm = indexParts(sorted[i-1].parts);
    const cm = indexParts(sorted[i].parts);

    // 追加
    for(const [k,c] of Object.entries(cm)){
      if(pm[k]) continue;
      if(!mm[k]) mm[k] = { ...c, revHistory:[] };
      else Object.assign(mm[k], c);
      mm[k].revHistory.push({ rev:rl, status:'added', changes:[] });
      mm[k].masterStatus = 'added';
    }

    // 削除
    for(const [k,p] of Object.entries(pm)){
      if(cm[k]) continue;
      if(!mm[k]) mm[k] = { ...p, revHistory:[] };
      mm[k].revHistory.push({ rev:rl, status:'removed', changes:[] });
      mm[k].masterStatus = 'removed';
    }

    // 変更 — 方向まで報告する
    for(const [k,c] of Object.entries(cm)){
      const p = pm[k];
      if(!p) continue;
      const ch = [];

      const pq = p.qty ?? 0, cq = c.qty ?? 0;
      if(pq !== cq) ch.push({ field:'員数', type: cq>pq?'increased':'decreased', from:pq, to:cq });

      const pl = p.length_mm, cl = c.length_mm;
      const plN = pl==null?null:Number(pl), clN = cl==null?null:Number(cl);
      if(plN !== clN && !(plN==null && clN==null)){
        ch.push({ field:'長さ',
          type: (plN==null||clN==null) ? 'changed' : (clN>plN?'increased':'decreased'),
          from: plN ?? '—', to: clN ?? '—' });
      }

      for(const cf of CMP_FIELDS){
        if(!sameVal(p[cf.f], c[cf.f]))
          ch.push({ field:cf.ja, type:'changed', from:(p[cf.f]||'—'), to:(c[cf.f]||'—') });
      }

      if(ch.length){
        if(!mm[k]) mm[k] = { ...p, revHistory:[] };
        mm[k].revHistory.push({ rev:rl, status:'changed', changes:ch });
        if(mm[k].masterStatus !== 'removed') mm[k].masterStatus = 'changed';
        Object.assign(mm[k], c);
      } else if(mm[k]){
        Object.assign(mm[k], c);            // 値を最新に保つ（履歴は変えない）
        if(!mm[k].masterStatus) mm[k].masterStatus = 'baseline';
      }
    }
  }
  return mm;
}

// ── 2改訂間の差分を明細で返す（改訂比較ビュー用）──
function diffRevisions(revisions, revIndex){
  const sorted = revisions.slice().sort((a,b)=>a.rev_index-b.rev_index);
  const idx = sorted.findIndex(r=>r.rev_index===revIndex);
  if(idx <= 0) return null;
  const prev = sorted[idx-1], curr = sorted[idx];
  const pm = indexParts(prev.parts), cm = indexParts(curr.parts);
  const added=[], removed=[], changed=[];

  for(const [k,c] of Object.entries(cm)) if(!pm[k]) added.push({ key:k, now:c });
  for(const [k,p] of Object.entries(pm)) if(!cm[k]) removed.push({ key:k, was:p });

  for(const [k,c] of Object.entries(cm)){
    const p = pm[k]; if(!p) continue;
    const ch = [];
    const pq=p.qty??0, cq=c.qty??0;
    if(pq!==cq) ch.push({ field:'員数', from:pq, to:cq, dir: cq>pq?'up':'down' });
    const plN = p.length_mm==null?null:Number(p.length_mm);
    const clN = c.length_mm==null?null:Number(c.length_mm);
    if(plN!==clN && !(plN==null&&clN==null))
      ch.push({ field:'長さ', from:plN??'—', to:clN??'—',
        dir:(plN!=null&&clN!=null)?(clN>plN?'up':'down'):'' });
    for(const cf of CMP_FIELDS)
      if(!sameVal(p[cf.f], c[cf.f]))
        ch.push({ field:cf.ja, from:p[cf.f]||'—', to:c[cf.f]||'—', dir:'' });
    if(ch.length) changed.push({ key:k, was:p, now:c, changes:ch });
  }

  const cmp = (a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true});
  added.sort((a,b)=>cmp(a.now.assm_mk,b.now.assm_mk));
  removed.sort((a,b)=>cmp(a.was.assm_mk,b.was.assm_mk));
  changed.sort((a,b)=>cmp(a.now.assm_mk,b.now.assm_mk));

  return { prevRev:prev.rev_index, currRev:curr.rev_index,
           prevCount:Object.keys(pm).length, currCount:Object.keys(cm).length,
           added, removed, changed };
}

// ── 手配照合・充当 ──
// 同一 PART-MK は複数の組立にまたがる。
// 手配数が不足する場合、ASSM-MK の昇順に充当する。
// 均等配分すると全組立が未完になるため、若い組立から満たす。
// batches: [{id, imported_at, source_filename, ...}] — 手配日の表示に使用
function buildPurchaseStatus(master, purItems, batches){
  // batch_id → 手配日
  const batchDate = {};
  (batches||[]).forEach(b=>{
    batchDate[b.id] = b.purchased_on || (b.imported_at ? String(b.imported_at).slice(0,10) : null);
  });
  const defaultDate = (batches && batches.length)
    ? (batches[0].purchased_on || (batches[0].imported_at ? String(batches[0].imported_at).slice(0,10) : null))
    : null;
  const statusMap = {};

  // 手配プール  partMk → 長さ → 数量
  const pool = {};
  const purProfiles = {};          // partMk → 手配側の断面（照合の補助）
  const purDate     = {};          // partMk → 手配日
  for(const it of purItems){
    const mk = String(it.part_mk||'').trim();
    if(!mk || mk==='*') continue;
    const L = String(it.length_mm ?? 0);
    (pool[mk] = pool[mk] || {});
    pool[mk][L] = (pool[mk][L]||0) + (it.qty||0);
    if(it.profile){
      (purProfiles[mk] = purProfiles[mk] || []);
      if(!purProfiles[mk].includes(it.profile)) purProfiles[mk].push(it.profile);
    }
    const d = batchDate[it.batch_id] || defaultDate;
    if(d && !purDate[mk]) purDate[mk] = d;
  }

  // 需要を PART-MK 単位にまとめる
  const demand = {};
  for(const [key,p] of Object.entries(master)){
    const mk = String(p.part_mk||'').trim();
    if(!mk || mk==='*') continue;          // 消耗品は対象外
    if(p.is_consumable) continue;
    if(p.masterStatus==='removed') continue; // 削除部材は手配不要
    (demand[mk] = demand[mk] || []).push({
      key, assm_mk:p.assm_mk, length_mm:p.length_mm||0, qty:p.qty||0, profile:p.profile||''
    });
  }

  const summary=[]; let ok=0, short=0, warn=0, none=0;

  for(const [mk, items] of Object.entries(demand)){
    // ASSM-MK 昇順（数値混在に対応）
    items.sort((a,b)=>String(a.assm_mk).localeCompare(String(b.assm_mk),'ja',{numeric:true,sensitivity:'base'}));

    const required = items.reduce((a,i)=>a+i.qty,0);
    const lengths  = pool[mk];

    if(!lengths){
      items.forEach(it=>{
        statusMap[it.key]={ status:'none', allocated:0, required:it.qty,
          shortfall:it.qty, remark:'未手配' };
      });
      none += items.length;
      summary.push({ part_mk:mk, profile:items[0].profile, bomLength:items[0].length_mm,
        purLength:'—', required, purchased:0, shortfall:required, leftover:0,
        status:'none', assemblies:items.length });
      continue;
    }

    const remain = { ...lengths };
    const purchased = Object.values(lengths).reduce((a,v)=>a+v,0);
    let lenWarn=false;

    for(const it of items){
      const L = String(it.length_mm||0);
      if(remain[L] > 0){
        const give = Math.min(remain[L], it.qty);
        remain[L] -= give;
        if(give >= it.qty){
          statusMap[it.key]={ status:'ok', allocated:give, required:it.qty,
            shortfall:0, remark:'照合OK', purchasedOn: purDate[mk] || null };
          ok++;
        } else {
          const sh = it.qty - give;
          statusMap[it.key]={ status:'short', allocated:give, required:it.qty,
            shortfall:sh, remark:`不足 ${sh}本（手配 ${give}/${it.qty}）`,
            purchasedOn: give>0 ? (purDate[mk] || null) : null };
          short++;
        }
      } else {
        const avail = Object.keys(remain).filter(k=>remain[k]>0);
        if(avail.length){
          lenWarn = true;
          // 断面が一致しているかを実際に照合する。
          // 一致していれば「長さのどちらかが誤り」の可能性が高い。
          const pp = (purProfiles[mk]||[]).filter(Boolean);
          const sameProf = !!(pp.length && it.profile &&
                              pp.some(x=>String(x).trim()===String(it.profile).trim()));
          statusMap[it.key]={ status:'len_warn', allocated:0, required:it.qty,
            shortfall:it.qty, sameProfile:sameProf,
            remark:`⚠ 長さ相違 BOM:${it.length_mm} / 手配:${avail.join(', ')}`
                 + (sameProf ? '（断面は一致 — 長さ要確認）'
                    : pp.length ? `（断面も相違 手配:${pp.join(',')}）` : '') };
          warn++;
        } else {
          statusMap[it.key]={ status:'short', allocated:0, required:it.qty,
            shortfall:it.qty, remark:`不足 ${it.qty}本（手配 0/${it.qty}）` };
          short++;
        }
      }
    }

    const leftover = Object.values(remain).reduce((a,v)=>a+v,0);
    const shortfall = Math.max(0, required - purchased);
    let st = 'ok';
    if(lenWarn)        st='warn';
    else if(shortfall) st='short';
    else if(leftover)  st='over';

    summary.push({ part_mk:mk, profile:items[0].profile, bomLength:items[0].length_mm,
      purProfile:(purProfiles[mk]||[]).join(', '),
      purchasedOn: purDate[mk] || null,
      purLength:Object.keys(lengths).join(', '), required, purchased, shortfall,
      leftover, status:st, assemblies:items.length });
  }

  // BOM に存在しない手配品
  const extras=[];
  for(const mk of Object.keys(pool)){
    if(!demand[mk]){
      const t = Object.values(pool[mk]).reduce((a,v)=>a+v,0);
      extras.push({ part_mk:mk, qty:t, lengths:Object.keys(pool[mk]).join(', ') });
    }
  }

  summary.sort((a,b)=>String(a.part_mk).localeCompare(String(b.part_mk),'ja',{numeric:true}));
  return { statusMap, summary, extras, counts:{ ok, short, warn, none } };
}

// ── 製作進捗 ──
function progOf(zoneId, assmMk, partMk){
  const m = PROGRESS[zoneId] || {};
  return m[assmMk+'||'+partMk] || {};
}
function progPct(zoneId, assmMk, partMk){
  const st = progOf(zoneId, assmMk, partMk);
  const done = PROC_STEPS.filter(s=>st[s.step_code]).length;
  return PROC_STEPS.length ? Math.round(done/PROC_STEPS.length*100) : 0;
}

// ═══════════════════════════════════════════════════════════════
//  FMS — 製作管理  画面
// ═══════════════════════════════════════════════════════════════
// ── 材種分類 ──
// Tekla の SHAPE を第一根拠にし、無い場合は PROFILE から推定する。
// 仕入先が分かれるため、分類は発注単位と一致させる。
const MAT_CATS = [
  { key:'shape', ja:'形鋼',     colour:'#2563eb' },
  { key:'plate', ja:'切り板',   colour:'#16a34a' },
  { key:'bolt',  ja:'Bolt',     colour:'#d97706' },
  { key:'brace', ja:'Brace',    colour:'#7c3aed' },
  { key:'other', ja:'その他',   colour:'#64748b' },
];

function matCat(p){
  const sh = (p.shape||'').toUpperCase().trim();
  const pf = (p.profile||'').toUpperCase().trim();
  const mk = (p.part_mk||'').trim();

  // ボルト — 部品マーク '*' か SHAPE=BOLT、または M16- 形式の断面
  if(mk === '*' || p.is_consumable) return 'bolt';
  if(sh === 'BOLT' || sh === 'BL')  return 'bolt';
  if(/^M\d+\s*-/.test(pf))          return 'bolt';

  // ブレース — SHAPE=TB（ターンバックル）、または断面が TB/BR/丸鋼
  if(sh === 'TB' || sh === 'BR')    return 'brace';
  if(/^(TB|BR|ブレース|φ|Φ)/.test(pf)) return 'brace';

  // 切り板 — SHAPE=PL、または断面が PL 始まり
  if(sh === 'PL' || sh === 'PLT')   return 'plate';
  if(/^PL/.test(pf))                return 'plate';

  // 形鋼 — H, C, L, I, T, CT, FB, 角パイプ等
  if(/^(H|C|L|I|T|CT|FB|BH|RH|P|STKR|□|\[)/.test(pf)) return 'shape';
  if(sh && ['H','C','L','I','T','CT','FB'].includes(sh)) return 'shape';

  return pf ? 'other' : 'other';
}

// 断面サイズの正規化キー — H200*200*8*13 → H200
// 「H200 を含むもの全て」で拾えるようにする
function profileBase(profile){
  const pf = String(profile||'').trim().toUpperCase();
  if(!pf) return '';
  const m = pf.match(/^([A-Zａ-ｚ□\[]+)\s*(\d+)/);
  return m ? (m[1]+m[2]) : pf.split('*')[0].split('-')[0];
}

// 断面ごとの集計 — 総本数・総長さ・総重量
function profileSummary(parts){
  const g = {};
  parts.forEach(p=>{
    const key = p.profile || '(断面なし)';
    const r = g[key] = g[key] || {
      profile:key, base:profileBase(key), cat:matCat(p),
      rows:0, qty:0, lengthMm:0, weightKg:0, assemblies:new Set()
    };
    const q = p.qty || 0;
    r.rows++; r.qty += q;
    r.lengthMm += (p.length_mm||0) * q;
    r.weightKg += (p.weight_kg||0) * q;
    r.assemblies.add(p.assm_mk);
  });
  return Object.values(g).sort((a,b)=>b.weightKg-a.weightKg);
}

let FMS = { zone:null, tab:'master', filter:'all', cat:'', prof:'', diffRev:null, diffFilter:'all' };

function allZones(){
  const out=[];
  PROJECTS.forEach(p=>p.subs.forEach(s=>s.zones.forEach(z=>
    out.push({ z, s, p, label:`${p.project_code} ${p.name} › ${s.name} › ${z.name}` }))));
  return out;
}

function viewFab(){
  const zones = allZones();
  if(!zones.length) return `<div class="card"><div class="empty"><div class="big">🏭</div>
    <p>プロジェクト・工区がありません</p>
    <button class="btn btn-p btn-s" style="margin-top:10px" onclick="go('proj')">プロジェクト管理へ</button></div></div>`;

  if(!FMS.zone || !zones.some(x=>x.z.id===FMS.zone)) FMS.zone = zones[0].z.id;
  const cur = zones.find(x=>x.z.id===FMS.zone);
  const revs = (BOM_REVS[FMS.zone]||[]).slice().sort((a,b)=>a.rev_index-b.rev_index);
  const master = buildMaster(revs);
  const mArr = Object.values(master);
  const purItems = PUR_ITEMS[FMS.zone] || [];
  const hasPur = purItems.length>0;
  const purBatches = PUR_BATCHES[FMS.zone] || [];
  const pur = buildPurchaseStatus(master, purItems, purBatches);

  const stats = {
    total: mArr.length,
    added: mArr.filter(p=>p.masterStatus==='added').length,
    removed: mArr.filter(p=>p.masterStatus==='removed').length,
    changed: mArr.filter(p=>p.masterStatus==='changed').length,
  };

  return `
  <div class="card">
    <div class="card-h" style="flex-wrap:wrap">
      <h3>工区</h3>
      <select id="fmsZone" onchange="FMS.zone=this.value;FMS.filter='all';go('fab')"
        style="border:1px solid var(--border2);border-radius:5px;padding:6px 10px;min-width:320px">
        ${zones.map(x=>`<option value="${x.z.id}" ${x.z.id===FMS.zone?'selected':''}>${esc(x.label)}</option>`).join('')}
      </select>
      <div style="flex:1"></div>
      <button class="btn btn-p btn-s" onclick="importBom()">＋ BOM取込</button>
      <button class="btn btn-s" onclick="importPur()" ${!revs.length?'disabled':''}>＋ 手配リスト取込</button>
    </div>
    ${hasPur ? `<div class="card-b" style="padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2)">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="muted" style="font-size:11px;font-weight:700">手配リスト:</span>
        ${(PUR_BATCHES[FMS.zone]||[]).map(b=>`<span class="pill pill-info" title="${esc(b.source_filename||'')}">
          ${esc(b.source_filename||'手配リスト')} · ${b.row_count||0}行
          ${b.purchased_on?' · 手配日 '+esc(b.purchased_on):(b.imported_at?' · 取込 '+esc(String(b.imported_at).slice(0,10)):'')}
        </span>`).join('')}
        <div style="flex:1"></div>
        <button class="btn btn-s" onclick="importPur()">↻ 再取込（置換）</button>
        <button class="btn btn-s btn-d" onclick="delPurchases()">手配リストを削除</button>
      </div>
    </div>` : ''}
    ${revs.length ? `<div class="card-b" style="padding:10px 16px;border-top:1px solid var(--border)">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="muted" style="font-size:11px;font-weight:700">改訂:</span>
        ${revs.map(r=>`<span class="pill ${r.rev_index===revs.length-1?'pill-info':'pill-grey'}"
          title="${esc(r.source_filename||'')}">Rev ${r.rev_index} · ${r.part_count}部材</span>`).join('')}
        <div style="flex:1"></div>
        <button class="btn btn-s btn-d" onclick="delLastRev()">最新改訂を取消</button>
      </div>
    </div>`:''}
  </div>

  ${!revs.length ? `<div class="card"><div class="empty">
      <div class="big">📄</div><h3 style="color:var(--muted);margin-bottom:6px">BOMが未取込です</h3>
      <p style="margin-bottom:16px">Tekla から出力した BOM を取り込んでください</p>
      <button class="btn btn-p" onclick="importBom()">＋ BOM取込</button>
    </div></div>` : `

  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><div class="lbl">総部材</div><div class="val">${stats.total}</div><div class="sub">マスターBOM</div></div>
    <div class="stat"><div class="lbl">追加</div><div class="val" style="color:var(--ok)">${stats.added}</div><div class="sub">改訂による</div></div>
    <div class="stat"><div class="lbl">削除</div><div class="val" style="color:var(--danger)">${stats.removed}</div><div class="sub">改訂による</div></div>
    <div class="stat"><div class="lbl">変更</div><div class="val" style="color:var(--warn)">${stats.changed}</div><div class="sub">員数・長さ等</div></div>
  </div>

  <div class="card">
    <div class="card-h" style="gap:2px">
      <button class="btn btn-s ${FMS.tab==='master'?'btn-p':''}" onclick="FMS.tab='master';FMS.filter='all';go('fab')">マスターBOM</button>
      <button class="btn btn-s ${FMS.tab==='diff'?'btn-p':''}"   onclick="FMS.tab='diff';go('fab')">改訂比較</button>
      <button class="btn btn-s ${FMS.tab==='pur'?'btn-p':''}"    onclick="FMS.tab='pur';go('fab')">手配サマリー</button>
      <button class="btn btn-s ${FMS.tab==='prof'?'btn-p':''}"   onclick="FMS.tab='prof';go('fab')">断面集計</button>
      <button class="btn btn-s ${FMS.tab==='prog'?'btn-p':''}"   onclick="FMS.tab='prog';FMS.filter='all';go('fab')">製作進捗</button>
      <div style="flex:1"></div>
      ${hasPur?`<span class="muted" style="font-size:11.5px">手配 ${purItems.length}行 取込済</span>`:''}
    </div>
    ${FMS.tab==='master' ? fabMaster(master, pur, hasPur)
    : FMS.tab==='diff'   ? fabDiff(revs)
    : FMS.tab==='pur'    ? fabPurSummary(pur, hasPur)
    : FMS.tab==='prof'   ? fabProfiles(master)
                         : fabProgress(master, pur, hasPur)}
  </div>`}`;
}

function secBadge(sec){
  const u=(sec||'').toUpperCase();
  if(u==='MAIN') return `<span class="pill pill-info" style="font-size:10px">MAIN</span>`;
  if(sec)        return `<span class="pill pill-grey" style="font-size:10px">${esc(sec)}</span>`;
  return '—';
}
function purMark(ps){
  if(!ps) return '<span class="muted">–</span>';
  if(ps.status==='ok')       return '<span style="color:var(--ok);font-weight:700">✓</span>';
  if(ps.status==='short')    return '<span style="color:var(--warn);font-weight:700">△</span>';
  if(ps.status==='len_warn') return '<span style="color:var(--danger);font-weight:700">!</span>';
  return '<span class="muted">–</span>';
}
function revBadges(p){
  if(!p.revHistory || !p.revHistory.length) return '<span class="muted" style="font-size:11px">変更なし</span>';
  return p.revHistory.map(h=>{
    if(h.status==='added')   return `<span class="pill pill-ok" style="font-size:10px">${h.rev} 追加</span>`;
    if(h.status==='removed') return `<span class="pill pill-risk" style="font-size:10px">${h.rev} 削除</span>`;
    return h.changes.map(c=>{
      const ar = c.type==='increased'?'↑':c.type==='decreased'?'↓':'→';
      return `<span class="pill pill-warn" style="font-size:10px">${h.rev} ${c.field} ${ar} ${c.from}→${c.to}</span>`;
    }).join(' ');
  }).join(' ');
}
function rowCls(p){
  return p.masterStatus==='added'?'style="background:var(--ok-l)"'
       : p.masterStatus==='removed'?'style="background:var(--danger-l);opacity:.75"'
       : p.masterStatus==='changed'?'style="background:var(--warn-l)"' : '';
}

// ── マスターBOM ──
function fabMaster(master, pur, hasPur){
  const all = Object.values(master);
  let arr = all;
  const f = FMS.filter;
  if(f==='added')    arr=arr.filter(p=>p.masterStatus==='added');
  if(f==='removed')  arr=arr.filter(p=>p.masterStatus==='removed');
  if(f==='changed')  arr=arr.filter(p=>p.masterStatus==='changed');
  if(f==='main')     arr=arr.filter(p=>(p.section||'').toUpperCase()==='MAIN');
  if(f==='pur_ok')   arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='ok');
  if(f==='pur_short')arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='short');
  if(f==='pur_warn') arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='len_warn');
  if(f==='pur_none') arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='none');

  // 材種フィルタ（仕入先別）
  if(FMS.cat)  arr = arr.filter(p=>matCat(p)===FMS.cat);
  // 断面サイズフィルタ — 部分一致（H200 で H200*200*8*13 等をすべて拾う）
  if(FMS.prof){
    const q = FMS.prof.toUpperCase();
    arr = arr.filter(p=>String(p.profile||'').toUpperCase().includes(q));
  }

  arr.sort((a,b)=>String(a.assm_mk).localeCompare(String(b.assm_mk),'ja',{numeric:true})
                || String(a.part_mk).localeCompare(String(b.part_mk),'ja',{numeric:true}));

  const chip=(k,l,c)=>`<button class="btn btn-s ${FMS.filter===k?'btn-p':''}"
    onclick="FMS.filter='${k}';go('fab')">${l}${c!==undefined?` (${c})`:''}</button>`;

  // 材種別の件数
  const catCount = {};
  all.forEach(p=>{ const c=matCat(p); catCount[c]=(catCount[c]||0)+1; });

  // 断面候補（現在の材種フィルタ内）
  const profPool = (FMS.cat ? all.filter(p=>matCat(p)===FMS.cat) : all);
  const profList = [...new Set(profPool.map(p=>p.profile).filter(Boolean))]
    .sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}));

  // 絞り込み結果の集計
  const tot = arr.reduce((a,p)=>{
    const q=p.qty||0;
    a.rows++; a.qty+=q;
    a.len += (p.length_mm||0)*q;
    a.wt  += (p.weight_kg||0)*q;
    a.asm.add(p.assm_mk);
    return a;
  }, {rows:0,qty:0,len:0,wt:0,asm:new Set()});

  const filtered = FMS.cat || FMS.prof;

  return `
  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap">
    ${chip('all','すべて')}
    ${chip('main','MAINのみ')}
    ${chip('added','＋追加',all.filter(p=>p.masterStatus==='added').length)}
    ${chip('removed','−削除',all.filter(p=>p.masterStatus==='removed').length)}
    ${chip('changed','△変更',all.filter(p=>p.masterStatus==='changed').length)}
    ${hasPur?`${chip('pur_ok','✓手配済',pur.counts.ok)}${chip('pur_short','△不足',pur.counts.short)}${chip('pur_warn','!長さ相違',pur.counts.warn)}${chip('pur_none','未手配',pur.counts.none)}`:''}
  </div>

  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:11px;font-weight:700">材種:</span>
    <button class="btn btn-s ${!FMS.cat?'btn-p':''}" onclick="FMS.cat='';FMS.prof='';go('fab')">すべて</button>
    ${MAT_CATS.filter(c=>catCount[c.key]).map(c=>`
      <button class="btn btn-s ${FMS.cat===c.key?'btn-p':''}" onclick="FMS.cat='${c.key}';FMS.prof='';go('fab')">
        <span style="display:inline-block;width:9px;height:9px;background:${c.colour};border-radius:2px"></span>
        ${c.ja} (${catCount[c.key]})</button>`).join('')}

    <span class="muted" style="font-size:11px;font-weight:700;margin-left:10px">断面:</span>
    <select onchange="FMS.prof=this.value;go('fab')"
      style="border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px;min-width:190px">
      <option value="">すべての断面</option>
      ${profList.map(pf=>`<option value="${esc(pf)}" ${FMS.prof===pf?'selected':''}>${esc(pf)}</option>`).join('')}
    </select>
    <input id="profQ" value="${esc(FMS.prof)}" placeholder="例: H200 で部分一致"
      onkeydown="if(event.key==='Enter'){FMS.prof=this.value.trim();go('fab')}"
      style="border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px;width:150px">
    ${FMS.prof?`<button class="btn btn-s btn-d" onclick="FMS.prof='';go('fab')">解除</button>`:''}
    <div style="flex:1"></div>
    <button class="btn btn-s ${FMS.tab==='prof'?'btn-p':''}" onclick="FMS.tab='prof';go('fab')">断面集計を見る</button>
  </div>

  ${filtered?`
  <div class="card-b" style="padding:11px 16px;border-bottom:1px solid var(--border);background:var(--accent-l)">
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:baseline">
      <b style="font-size:12.5px">${FMS.cat?(MAT_CATS.find(c=>c.key===FMS.cat)||{}).ja:''}${FMS.prof?(FMS.cat?' / ':'')+esc(FMS.prof):''} の集計</b>
      <span><span class="muted" style="font-size:11px">部材行</span> <b class="mono">${tot.rows}</b></span>
      <span><span class="muted" style="font-size:11px">総本数</span> <b class="mono">${tot.qty}</b></span>
      <span><span class="muted" style="font-size:11px">総長さ</span> <b class="mono">${(tot.len/1000).toFixed(1)}</b> m</span>
      <span><span class="muted" style="font-size:11px">総重量</span> <b class="mono">${tot.wt.toFixed(1)}</b> kg
        <span class="muted">(${(tot.wt/1000).toFixed(2)} t)</span></span>
      <span><span class="muted" style="font-size:11px">使用組立</span> <b class="mono">${tot.asm.size}</b></span>
    </div>
  </div>`:''}

  <div style="overflow-x:auto;max-height:58vh;overflow-y:auto">
  <table>
    <thead><tr>
      <th>組立マーク</th><th>区分</th><th>材種</th><th>部品マーク</th><th>断面</th>
      <th>長さ</th><th>員数</th><th>重量</th>
      ${hasPur?'<th>手配</th><th>手配日</th><th>備考</th>':''}
      <th>改訂状況</th>
    </tr></thead>
    <tbody>${arr.length?arr.map(p=>{
      const ps = pur.statusMap[pkey(p)];
      const c  = MAT_CATS.find(x=>x.key===matCat(p)) || MAT_CATS[4];
      return `<tr ${rowCls(p)}>
        <td class="mono">${esc(p.assm_mk)}</td>
        <td>${secBadge(p.section)}</td>
        <td><span class="pill" style="font-size:10px;background:${c.colour}1a;color:${c.colour}">${c.ja}</span></td>
        <td class="mono"><b>${esc(p.part_mk)}</b></td>
        <td style="font-size:12px">${esc(p.profile||'—')}</td>
        <td class="mono">${p.length_mm??'—'}</td>
        <td class="mono">${p.qty??'—'}</td>
        <td class="mono">${p.weight_kg??'—'}</td>
        ${hasPur?`<td style="text-align:center">${purMark(ps)}</td>
          <td class="mono" style="font-size:11.5px;${ps&&ps.purchasedOn?'color:var(--ok)':'color:var(--faint)'}">${ps&&ps.purchasedOn?esc(ps.purchasedOn):''}</td>
          <td style="font-size:11px;color:${ps&&ps.status==='ok'?'var(--ok)':ps&&ps.status==='short'?'var(--warn)':ps&&ps.status==='len_warn'?'var(--danger)':'var(--muted)'}">${esc(ps?ps.remark:'—')}</td>`:''}
        <td>${revBadges(p)}</td>
      </tr>`;
    }).join(''):`<tr><td colspan="${hasPur?12:9}" class="empty">該当する部材がありません</td></tr>`}</tbody>
  </table></div>`;
}

// ── 断面集計タブ ── 発注単位のまとめ
function fabProfiles(master){
  let parts = Object.values(master).filter(p=>p.masterStatus!=='removed');
  if(FMS.cat) parts = parts.filter(p=>matCat(p)===FMS.cat);
  const sum = profileSummary(parts);

  const catCount = {};
  Object.values(master).forEach(p=>{ const c=matCat(p); catCount[c]=(catCount[c]||0)+1; });

  const gt = sum.reduce((a,r)=>({qty:a.qty+r.qty, len:a.len+r.lengthMm, wt:a.wt+r.weightKg}),
                        {qty:0,len:0,wt:0});

  return `
  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:11px;font-weight:700">材種:</span>
    <button class="btn btn-s ${!FMS.cat?'btn-p':''}" onclick="FMS.cat='';go('fab')">すべて</button>
    ${MAT_CATS.filter(c=>catCount[c.key]).map(c=>`
      <button class="btn btn-s ${FMS.cat===c.key?'btn-p':''}" onclick="FMS.cat='${c.key}';go('fab')">
        <span style="display:inline-block;width:9px;height:9px;background:${c.colour};border-radius:2px"></span>
        ${c.ja}</button>`).join('')}
    <div style="flex:1"></div>
    <span class="muted" style="font-size:11.5px">${sum.length} 断面 · 総重量 ${(gt.wt/1000).toFixed(2)} t</span>
  </div>
  <div style="overflow-x:auto;max-height:62vh;overflow-y:auto">
  <table>
    <thead><tr><th>断面</th><th>材種</th><th>部材行</th><th>総本数</th>
      <th>総長さ (m)</th><th>総重量 (kg)</th><th>使用組立数</th><th></th></tr></thead>
    <tbody>${sum.length?sum.map(r=>{
      const c = MAT_CATS.find(x=>x.key===r.cat) || MAT_CATS[4];
      return `<tr>
        <td class="mono"><b>${esc(r.profile)}</b></td>
        <td><span class="pill" style="font-size:10px;background:${c.colour}1a;color:${c.colour}">${c.ja}</span></td>
        <td class="mono">${r.rows}</td>
        <td class="mono"><b>${r.qty}</b></td>
        <td class="mono">${(r.lengthMm/1000).toFixed(1)}</td>
        <td class="mono">${r.weightKg.toFixed(1)}</td>
        <td class="mono">${r.assemblies.size}</td>
        <td style="text-align:right"><button class="btn btn-s"
          onclick="FMS.prof='${esc(r.profile)}';FMS.tab='master';go('fab')">部材を見る</button></td>
      </tr>`;
    }).join(''):`<tr><td colspan="8" class="empty">該当する断面がありません</td></tr>`}
    ${sum.length?`<tr style="background:var(--bg2);font-weight:700">
      <td colspan="3">合計</td>
      <td class="mono">${gt.qty}</td>
      <td class="mono">${(gt.len/1000).toFixed(1)}</td>
      <td class="mono">${gt.wt.toFixed(1)}</td>
      <td colspan="2"></td></tr>`:''}
    </tbody>
  </table></div>
  <div class="card-b" style="padding-top:10px"><p class="hint">
    材種ごとに仕入先が分かれるため、この表がそのまま発注単位の材料集計になります。
    「部材を見る」でその断面を使用している組立・部材を確認できます。
  </p></div>`;
}

// ── 改訂比較ビュー ── Rev N−1 と Rev N を部材単位で並べて見せる
function fabDiff(revs){
  const sorted = revs.slice().sort((a,b)=>a.rev_index-b.rev_index);
  if(sorted.length < 2) return `<div class="empty" style="padding:40px">
    <div class="big">🔍</div><p>比較には2つ以上の改訂が必要です</p>
    <p class="hint" style="margin-top:6px">Rev 0 のみ取込済みです。更新後のBOMを取込むと差分を表示します。</p>
    <button class="btn btn-p btn-s" style="margin-top:12px" onclick="importBom()">＋ BOM取込</button></div>`;

  const latest = sorted[sorted.length-1].rev_index;
  if(FMS.diffRev == null || !sorted.some(r=>r.rev_index===FMS.diffRev) || FMS.diffRev===sorted[0].rev_index)
    FMS.diffRev = latest;

  const d = diffRevisions(sorted, FMS.diffRev);
  if(!d) return `<div class="empty" style="padding:40px"><p>比較できません</p></div>`;

  const cell = (v) => v===null||v===undefined||v===''?'—':esc(String(v));
  const arrow = dir => dir==='up'?'<span style="color:var(--danger)">↑</span>'
                     : dir==='down'?'<span style="color:var(--accent)">↓</span>' : '→';

  const rowsFor = (list, kind) => list.map(x=>{
    const p = kind==='removed' ? x.was : x.now;
    const was = x.was, now = x.now;
    const badge = kind==='added'   ? '<span class="pill pill-ok">追加</span>'
                : kind==='removed' ? '<span class="pill pill-risk">削除</span>'
                                   : '<span class="pill pill-warn">変更</span>';
    const bg = kind==='added'?'var(--ok-l)':kind==='removed'?'var(--danger-l)':'var(--warn-l)';
    const detail = kind==='changed'
      ? x.changes.map(c=>`<div class="mono" style="font-size:11px">${esc(c.field)}
          <span class="muted">${cell(c.from)}</span> ${arrow(c.dir)} <b>${cell(c.to)}</b></div>`).join('')
      : kind==='added' ? '<span class="muted" style="font-size:11px">この改訂で新規</span>'
                       : '<span class="muted" style="font-size:11px">この改訂で削除</span>';
    return `<tr style="background:${bg}">
      <td>${badge}</td>
      <td class="mono">${esc(p.assm_mk)}</td>
      <td class="mono"><b>${esc(p.part_mk)}</b></td>
      <td style="font-size:12px">${cell(p.profile)}</td>
      <td class="mono">${kind==='changed' && was.length_mm!==now.length_mm
          ? `<span class="muted">${cell(was.length_mm)}</span> → <b>${cell(now.length_mm)}</b>`
          : cell(p.length_mm)}</td>
      <td class="mono">${kind==='changed' && was.qty!==now.qty
          ? `<span class="muted">${cell(was.qty)}</span> → <b>${cell(now.qty)}</b>`
          : cell(p.qty)}</td>
      <td>${detail}</td>
    </tr>`;
  }).join('');

  const f = FMS.diffFilter || 'all';

    onclick="FMS.diffFilter='${k}';go('fab')">${l} (${c})</button>`;

  return `
  <div class="card-b" style="padding:11px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:11px;font-weight:700">比較する改訂:</span>
    <select onchange="FMS.diffRev=parseInt(this.value);go('fab')"
      style="border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px">
      ${sorted.slice(1).map(r=>`<option value="${r.rev_index}" ${FMS.diffRev===r.rev_index?'selected':''}>
        Rev ${r.rev_index-1} → Rev ${r.rev_index}</option>`).join('')}
    </select>
    <div style="flex:1"></div>
    <span class="mono" style="font-size:12px">Rev ${d.prevRev}: ${d.prevCount}部材 → Rev ${d.currRev}: ${d.currCount}部材</span>
  </div>

  <div class="card-b" style="padding:11px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    ${chip('all','すべて',d.changed.length+d.added.length+d.removed.length)}
    ${chip('changed','△ 変更',d.changed.length)}
    ${chip('added','＋ 追加',d.added.length)}
    ${chip('removed','− 削除',d.removed.length)}
    <div style="flex:1"></div>
    ${(d.changed.length+d.added.length+d.removed.length)===0
      ? '<span class="pill pill-ok">差分なし — 部材構成に変更はありません</span>' : ''}
  </div>

  <div style="overflow-x:auto;max-height:62vh;overflow-y:auto">
  <table>
    <thead><tr><th>区分</th><th>組立マーク</th><th>部品マーク</th><th>断面</th>
      <th>長さ</th><th>員数</th><th>変更内容</th></tr></thead>
    <tbody>${body || `<tr><td colspan="7" class="empty">該当する差分がありません</td></tr>`}</tbody>
  </table></div>
  <div class="card-b" style="padding-top:10px"><p class="hint">
    比較は「組立マーク＋部品マーク」の組合せ単位で行います。
    同じ部品マークでも所属する組立が異なれば別部材として扱います。
  </p></div>`;
}

function readXlsx(file, cb){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb = file.name.toLowerCase().endsWith('.csv')
        ? XLSX.read(e.target.result,{type:'string'})
        : XLSX.read(e.target.result,{type:'array'});
      cb(null, wb);
    }catch(err){ cb(err); }
  };
  if(file.name.toLowerCase().endsWith('.csv')) r.readAsText(file); else r.readAsArrayBuffer(file);
}

// ── BOM 取込 ──
function importBom(){
  const zones = allZones();
  const cur = zones.find(x=>x.z.id===FMS.zone);
  const revs = (BOM_REVS[FMS.zone]||[]);
  const next = revs.length;
  window._BOM = null;
  openModal(`<div class="modal" style="width:620px">
    <div class="modal-h"><h3>BOM取込 — Rev ${next}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="inline-note" style="margin-bottom:14px">
        <b>${esc(cur?cur.label:'')}</b><br>
        ${next===0 ? 'Rev 0（基準）として取り込みます。'
                   : `Rev ${next} として取り込み、Rev ${next-1} との差分を自動判定します。`}
      </div>
      <div class="dz" id="bomDz">
        <div style="font-size:24px;margin-bottom:6px">📄</div>
        <div>クリックまたはドラッグで Tekla BOM を選択</div>
        <div style="font-size:10.5px;color:var(--faint);margin-top:3px">xlsx / xls / csv — ヘッダー行は自動検出</div>
      </div>
      <input type="file" id="bomFi" accept=".xlsx,.xls,.csv" style="display:none">
      <div id="bomInfo" style="display:none"></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-p" onclick="saveBom()">取込</button></div>
  </div>`);
  const dz=$('bomDz'), fi=$('bomFi');
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='var(--accent)';};
  dz.ondragleave=()=>dz.style.borderColor='';
  dz.ondrop=e=>{e.preventDefault();dz.style.borderColor='';if(e.dataTransfer.files[0])bomLoad(e.dataTransfer.files[0]);};
  fi.onchange=e=>{if(e.target.files[0])bomLoad(e.target.files[0]);};
}

function bomLoad(file){
  readXlsx(file,(err,wb)=>{
    if(err){ toast('読込エラー: '+err.message,'err'); return; }
    const r = detectAndParse(wb, BOM_COLS);

    // ★ 行単位ではなく全体を通して解析する（組立マークの引き継ぎのため）
    const { parts, stat } = parseBomRows(r.data);
    window._BOM = { file:file.name, res:r, parts, stat };

    // 実部材で複合キーが重複していないか（員数は合算されるが確認は出す）
    const seen = {}, dupes = [];
    parts.forEach(p=>{
      if(p.is_consumable) return;
      const k = p.assm_mk+'||'+p.part_mk;
      if(seen[k]) { if(dupes.length<5) dupes.push(k); } else seen[k]=1;
    });
    window._BOM.dupes = dupes;

    const ok = r.colsFound>=3 && parts.length>0 && stat.assemblyCount>0;
    const dz=$('bomDz');
    dz.style.background = ok?'var(--ok-l)':'var(--warn-l)';
    dz.style.borderColor= ok?'var(--ok)':'var(--warn)';
    dz.innerHTML = `<div style="font-size:24px;margin-bottom:6px">${ok?'✅':'⚠️'}</div>
      <div><b>${esc(file.name)}</b></div>
      <div style="font-size:11px;margin-top:3px">
        ${stat.assemblyCount} 組立 · ${parts.length} 部材 · ヘッダー行 ${r.headerRow} · 認識列 ${r.colsFound}</div>`;

    let html = `<div class="hint" style="margin-top:10px;word-break:break-all">${r.headers.filter(h=>h).join(' · ')}</div>`;

    // ── 解析結果の内訳（取込前に必ず確認できるようにする）──
    const cons = parts.filter(p=>p.is_consumable).length;
    const main = parts.filter(p=>(p.section||'').toUpperCase()==='MAIN').length;
    html += `<div style="margin-top:12px;padding:11px 13px;background:var(--bg2);border-radius:6px">
      <b style="font-size:12px">解析内訳</b>
      <div style="margin-top:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px 14px;font-size:12px">
        <span class="muted">元データ行</span><span class="mono">${stat.total}</span>
        <span class="muted">組立数</span><span class="mono"><b>${stat.assemblyCount}</b></span>
        <span class="muted">部材行</span><span class="mono"><b>${parts.length}</b></span>
        <span class="muted">主部材 (MAIN)</span><span class="mono">${main}</span>
        <span class="muted">消耗品 (ボルト等)</span><span class="mono">${cons}</span>
        <span class="muted">組立マーク引き継ぎ</span><span class="mono">${stat.carried}</span>
        <span class="muted">小計行を除外</span><span class="mono">${stat.subtotal}</span>
        <span class="muted">対象外行</span><span class="mono">${stat.skipped}</span>
      </div>
    </div>`;

    // 先頭10行を実際の解析結果で表示 — 組立への割り当てが正しいか目視できる
    const sample = parts.slice(0,10);
    html += `<div style="margin-top:10px">
      <b style="font-size:12px">解析結果 先頭${sample.length}行</b>
      <div style="max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:5px;margin-top:5px">
      <table style="font-size:11px"><thead><tr>
        <th>組立マーク</th><th>区分</th><th>部品マーク</th><th>断面</th><th>長さ</th><th>員数</th></tr></thead>
      <tbody>${sample.map(p=>`<tr>
        <td class="mono">${esc(p.assm_mk)}</td>
        <td>${esc(p.section||'—')}</td>
        <td class="mono">${esc(p.part_mk)}</td>
        <td>${esc(p.profile||'—')}</td>
        <td class="mono">${p.length_mm??'—'}</td>
        <td class="mono">${p.qty??'—'}</td></tr>`).join('')}</tbody></table></div>
      <div class="hint" style="margin-top:4px">組立マークが正しく各部材に割り当てられているか確認してください。</div>
    </div>`;

    if(!stat.assemblyCount){
      html += `<div style="margin-top:10px;padding:10px 12px;background:var(--danger-l);border-radius:6px;font-size:12px">
        <b style="color:var(--danger)">⚠ 組立マークが認識できません</b><br>
        ASSM-MK 列が見つからないか、すべて空です。ヘッダー行の検出結果を確認してください。</div>`;
    }
    if(window._BOM.dupes.length) html += `<div style="margin-top:10px;padding:10px 12px;background:var(--warn-l);border-radius:6px;font-size:12px">
      <b style="color:var(--warn)">組立マーク＋部品マークが重複している行があります</b><br>
      <span class="mono" style="font-size:11px">${window._BOM.dupes.map(esc).join('<br>')}</span><br>
      マスターBOMでは員数を合算します。</div>`;

    // ── 差分プレビュー ──
    const revs=(BOM_REVS[FMS.zone]||[]).slice().sort((a,b)=>a.rev_index-b.rev_index);
    if(revs.length){
      const nextIdx = revs[revs.length-1].rev_index + 1;
      const d = diffRevisions(revs.concat([{ rev_index:nextIdx, parts }]), nextIdx);
      html += `<div style="margin-top:12px;padding:11px 13px;background:var(--accent-l);border-radius:6px">
        <b style="font-size:12px">差分プレビュー — Rev ${d.prevRev}（${d.prevCount}部材） → Rev ${d.currRev}（${d.currCount}部材）</b>
        <div style="margin-top:6px;display:flex;gap:16px;font-size:13px">
          <span><b style="color:var(--ok);font-family:var(--mono)">${d.added.length}</b> 追加</span>
          <span><b style="color:var(--danger);font-family:var(--mono)">${d.removed.length}</b> 削除</span>
          <span><b style="color:var(--warn);font-family:var(--mono)">${d.changed.length}</b> 変更</span>
        </div>`;
      if(d.changed.length) html += `<div style="margin-top:8px;font-size:11.5px;max-height:120px;overflow:auto">
        ${d.changed.slice(0,8).map(c=>`<div class="mono">△ ${esc(c.now.assm_mk)} ${esc(c.now.part_mk)} — ${
          c.changes.map(x=>`${x.field} ${x.from}→${x.to}`).join(', ')}</div>`).join('')}
        ${d.changed.length>8?`<div class="muted">…他 ${d.changed.length-8} 件</div>`:''}</div>`;
      html += `</div>`;
    }

    const info=$('bomInfo'); info.style.display='block'; info.innerHTML=html;
  });
}

async function saveBom(){
  const B = window._BOM;
  if(!B || !B.parts.length){ toast('BOMファイルを選択してください','err'); return; }
  const cur = allZones().find(x=>x.z.id===FMS.zone);
  let revId = null, revIndex = 0;
  try{
    sync('取込中…');

    // 改訂番号はDBから採番する（画面の状態に依存しない）
    const { data:existing, error:eq } = await sb.from('bom_revisions')
      .select('rev_index').eq('work_zone_id', FMS.zone)
      .order('rev_index',{ascending:false}).limit(1);
    if(eq) throw eq;
    revIndex = existing && existing.length ? existing[0].rev_index + 1 : 0;

    const { data:rev, error } = await sb.from('bom_revisions').insert({
      work_zone_id:FMS.zone, project_id:cur.p.id, rev_index:revIndex,
      rev_date:fmt(new Date()), source_filename:B.file,
      header_row:B.res.headerRow, cols_found:B.res.colsFound,
      part_count:B.parts.length, imported_by:ME.id
    }).select().single();
    if(error) throw error;
    revId = rev.id;

    // 部材は分割して投入（数千行になるため）
    const rows = B.parts.map(p=>({ ...p, revision_id:rev.id,
      work_zone_id:FMS.zone, project_id:cur.p.id }));
    for(let i=0;i<rows.length;i+=500){
      const { error:e2 } = await sb.from('bom_parts').insert(rows.slice(i,i+500));
      if(e2) throw e2;
      sync(`取込中… ${Math.min(i+500,rows.length)}/${rows.length}`);
    }
    await logAudit('bom.import','bom_revisions',rev.id,cur.p.id,null,
      { rev:revIndex, parts:B.parts.length, file:B.file });
    closeModal(); await loadFms(); go('fab');
    toast(`Rev ${revIndex} を取込みました（${B.parts.length} 部材）`,'ok');
    sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){

    if(revId){
      try{ await sb.from('bom_revisions').delete().eq('id', revId); }catch(_){}

    sync('エラー');
  }
}

// 手配リストを削除（部材の手配状態はすべて未手配に戻る）
async function delPurchases(){
  const batches = PUR_BATCHES[FMS.zone] || [];
  if(!batches.length){ toast('手配リストが取込まれていません','err'); return; }
  const rows = batches.reduce((a,b)=>a+(b.row_count||0),0);
  if(!confirm(`手配リストを削除しますか？\n\n対象: ${batches.length}件 / ${rows}行\n削除するとすべての部材が「未手配」に戻ります。\nBOMと製作進捗は削除されません。`)) return;
  try{
    sync('削除中…');
    const cur = allZones().find(x=>x.z.id===FMS.zone);
    for(const b of batches){
      const { error } = await sb.from('purchase_batches').delete().eq('id', b.id);
      if(error) throw error;
    }
    await logAudit('purchase.delete','purchase_batches',batches[0].id,cur?cur.p.id:null,
      { batches:batches.length, rows }, null);
    await loadFms(); go('fab');
    toast('手配リストを削除しました','ok');
    sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('削除エラー: '+e.message,'err'); sync('エラー'); }
}

async function delLastRev(){
  const revs=(BOM_REVS[FMS.zone]||[]).slice().sort((a,b)=>a.rev_index-b.rev_index);
  if(!revs.length) return;
  const last=revs[revs.length-1];
  if(!confirm(`Rev ${last.rev_index} を取消しますか？\n部材データも削除されます。`)) return;
  try{
    await sb.from('bom_revisions').delete().eq('id',last.id);
    await loadFms(); go('fab'); toast(`Rev ${last.rev_index} を取消しました`,'ok');
  }catch(e){ toast('削除エラー: '+e.message,'err'); }
}

function purLoad(file){
  readXlsx(file,(err,wb)=>{
    try{
      if(err) throw err;
      const r = detectAndParse(wb, PUR_COLS);
      const headers = r.headers.filter(h=>h!==undefined && h!==null && String(h).trim()!=='');
      // 列対応の自動判定。判定器が使えない場合は pick() の自動判定に委ねる。
      const map = (typeof detectPurMap === 'function') ? detectPurMap(headers) : null;
      window._PUR = { file:file.name, res:r, headers, map, items:[] };
      purRebuild();
    }catch(e){
      console.error('purLoad', e);
      toast('読込エラー: '+(e && e.message ? e.message : e),'err');
    }
  });
}

// 列対応を変更したときに再計算する
function purRebuild(){
  const P = window._PUR; if(!P) return;
  try{
    P.items = P.res.data.map(row=>mapPurRow(row, P.map))
                        .filter(x=>x.part_mk && x.part_mk!=='*');
    purRender();
  }catch(e){
    console.error('purRebuild', e);
    toast('解析エラー: '+(e && e.message ? e.message : e),'err');
  }
}

function onPurMap(key, header){
  const P = window._PUR; if(!P) return;
  P.map[key] = header || null;
  purRebuild();
}

function purRender(){
  const P = window._PUR; if(!P) return;
  const { headers, map, items, res } = P;

  const missing = PUR_FIELDS.filter(f=>f.required && !map[f.key]);
  const noLen   = items.length && items.every(x=>x.length_mm==null);
  const ok = items.length>0 && !missing.length && !noLen;

  const dz=$('purDz');
  dz.style.background = ok?'var(--ok-l)':'var(--warn-l)';
  dz.style.borderColor= ok?'var(--ok)':'var(--warn)';
  dz.innerHTML=`<div style="font-size:24px;margin-bottom:6px">${ok?'✅':'⚠️'}</div>
    <div><b>${esc(P.file)}</b></div>
    <div style="font-size:11px;margin-top:3px">${items.length} 行 · ヘッダー行 ${res.headerRow}</div>`;

  // ── 列の対応（自動判定＋手動変更）──
  let html = `<div style="margin-top:12px;padding:11px 13px;background:var(--bg2);border-radius:6px">
    <b style="font-size:12px">列の対応</b>
    <div class="hint" style="margin:4px 0 8px">自動判定した結果です。誤っている場合は選び直してください。</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center">
      ${PUR_FIELDS.map(f=>`
        <span style="font-size:12px">${f.required?'<b>':''}${esc(f.ja)}${f.required?'</b>':''}
          ${f.required && !map[f.key] ? '<span style="color:var(--danger)"> ⚠</span>':''}</span>
        <select onchange="onPurMap('${f.key}', this.value)"
          style="border:1px solid ${f.required&&!map[f.key]?'var(--danger)':'var(--border2)'};border-radius:5px;padding:4px 8px;font-size:12px">
          <option value="">（列なし）</option>
          ${headers.map(h=>`<option value="${esc(h)}" ${map[f.key]===h?'selected':''}>${esc(h)}</option>`).join('')}
        </select>`).join('')}
    </div>
  </div>`;

  if(missing.length){
    html += `<div style="margin-top:10px;padding:10px 12px;background:var(--danger-l);border-radius:6px;font-size:12px">
      <b style="color:var(--danger)">⚠ 必須列が未対応です — ${missing.map(f=>esc(f.ja)).join('・')}</b><br>
      上の「列の対応」で該当する列を選んでください。</div>`;
  } else if(noLen){
    html += `<div style="margin-top:10px;padding:10px 12px;background:var(--danger-l);border-radius:6px;font-size:12px">
      <b style="color:var(--danger)">⚠ 長さがすべて空です</b><br>
      「長さ」に対応させた列が正しいか確認してください。このまま取込むと全件が長さ相違になります。</div>`;
  }

  if(!items.length){
    html += `<div style="margin-top:10px;padding:10px 12px;background:var(--warn-l);border-radius:6px;font-size:12px">
      部品マークが読み取れる行がありません。ヘッダー行の検出結果と列の対応を確認してください。</div>`;
    const info=$('purInfo'); info.style.display='block'; info.innerHTML=html; return;
  }

  // 読み取り結果のサンプル
  const sample = items.slice(0,8);
  html += `<div style="margin-top:10px">
    <b style="font-size:12px">読取結果 先頭${sample.length}行</b>
    <div style="max-height:170px;overflow:auto;border:1px solid var(--border);border-radius:5px;margin-top:5px">
    <table style="font-size:11px"><thead><tr>
      <th>部品マーク</th><th>断面</th><th>長さ</th><th>数量</th><th>材質</th></tr></thead>
    <tbody>${sample.map(x=>`<tr>
      <td class="mono">${esc(x.part_mk)}</td>
      <td>${esc(x.profile||'—')}</td>
      <td class="mono" style="${x.length_mm==null?'color:var(--danger);font-weight:700':''}">${x.length_mm ?? '未取得'}</td>
      <td class="mono">${x.qty}</td>
      <td>${esc(x.material||'—')}</td></tr>`).join('')}</tbody></table></div></div>`;

  // ── 照合プレビュー ──
  const revs=(BOM_REVS[FMS.zone]||[]);
  const master=buildMaster(revs);
  const dry=buildPurchaseStatus(master, items,
    [{ id:'preview', purchased_on: ($('purDate') ? $('purDate').value : null) }]);
  const c=dry.counts;
  html+=`<div style="margin-top:12px;padding:11px 13px;background:var(--accent-l);border-radius:6px">
    <b style="font-size:12px">照合プレビュー</b>
    <div style="margin-top:6px;display:flex;gap:16px;font-size:13px;flex-wrap:wrap">
      <span><b style="color:var(--ok);font-family:var(--mono)">${c.ok}</b> 照合OK</span>
      <span><b style="color:var(--warn);font-family:var(--mono)">${c.short}</b> 数量不足</span>
      <span><b style="color:var(--danger);font-family:var(--mono)">${c.warn}</b> 長さ相違</span>
      <span><b style="color:var(--muted);font-family:var(--mono)">${c.none}</b> 未手配</span>
    </div></div>`;

  const warns=dry.summary.filter(s=>s.status==='warn');
  const shorts=dry.summary.filter(s=>s.status==='short');
  if(warns.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--danger-l);border-radius:6px;font-size:12px">
    <b style="color:var(--danger)">⚠ 長さ相違</b><br>${warns.slice(0,6).map(w=>
      `${esc(w.part_mk)} — BOM:${w.bomLength} / 手配:${esc(String(w.purLength))}`).join('<br>')}
    ${warns.length>6?`<br>…他 ${warns.length-6} 件`:''}</div>`;
  if(shorts.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--warn-l);border-radius:6px;font-size:12px">
    <b style="color:var(--warn)">△ 数量不足（組立マーク昇順に充当）</b><br>${shorts.slice(0,6).map(w=>
      `${esc(w.part_mk)} — 必要 ${w.required} / 手配 ${w.purchased} → 不足 ${w.shortfall}`).join('<br>')}
    ${shorts.length>6?`<br>…他 ${shorts.length-6} 件`:''}</div>`;
  if(dry.extras.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--purple-l);border-radius:6px;font-size:12px">
    <b style="color:var(--purple)">BOM外の手配品 ${dry.extras.length} 件</b><br>
    ${dry.extras.slice(0,8).map(e=>esc(e.part_mk)+`(${e.qty})`).join(' · ')}
    ${dry.extras.length>8?` …他 ${dry.extras.length-8} 件`:''}</div>`;
  if(!warns.length && !shorts.length && !dry.extras.length)
    html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--ok-l);border-radius:6px;font-size:12.5px">
      <b style="color:var(--ok)">✅ すべて正しく照合されました</b></div>`;

  const info=$('purInfo'); info.style.display='block'; info.innerHTML=html;
}

async function savePur(){
  const P=window._PUR;
  if(!P || !P.items.length){ toast('手配リストを選択してください','err'); return; }
  // 長さがすべて未取得なら列対応の誤りです。保存すると全件が「長さ相違」になります。
  if(P.items.every(x=>x.length_mm==null)){
    toast('長さが1件も読み取れていません。列対応を確認してください。','err');
    return;
  }
  const cur = allZones().find(x=>x.z.id===FMS.zone);
  try{
    sync('保存中…');
    // 取込は置換 — 既存バッチを削除
    const old = PUR_BATCHES[FMS.zone]||[];
    for(const b of old) await sb.from('purchase_batches').delete().eq('id',b.id);

    const pDate = $('purDate') ? ($('purDate').value || null) : null;
    const { data:batch, error } = await sb.from('purchase_batches').insert({
      work_zone_id:FMS.zone, project_id:cur.p.id, batch_no:1,
      source_filename:P.file, import_mode:'replace', purchased_on:pDate,
      row_count:P.items.length, imported_by:ME.id
    }).select().single();
    if(error) throw error;

    const rows=P.items.map(i=>({ ...i, batch_id:batch.id }));
    for(let i=0;i<rows.length;i+=500){
      const { error:e2 } = await sb.from('purchase_items').insert(rows.slice(i,i+500));
      if(e2) throw e2;
    }
    await logAudit('purchase.import','purchase_batches',batch.id,cur.p.id,null,
      { rows:P.items.length, file:P.file });
    closeModal(); await loadFms(); FMS.tab='pur'; go('fab');
    toast(`手配リストを取込みました（${P.items.length} 行）`,'ok');
    sync('同期済');
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

// ── 製作進捗 ──
async function toggleStep(assmMk, partMk, stepCode, on){
  const cur = allZones().find(x=>x.z.id===FMS.zone);
  const k = assmMk+'||'+partMk;
  PROGRESS[FMS.zone] = PROGRESS[FMS.zone] || {};
  PROGRESS[FMS.zone][k] = PROGRESS[FMS.zone][k] || {};
  PROGRESS[FMS.zone][k][stepCode] = on;
  go('fab');
  try{
    await sb.from('fabrication_progress').upsert({
      work_zone_id:FMS.zone, project_id:cur.p.id,
      assm_mk:assmMk, part_mk:partMk, step_code:stepCode,
      is_complete:on, marked_by:ME.id, marked_at:new Date().toISOString()
    }, { onConflict:'work_zone_id,assm_mk,part_mk,step_code' });
    sync('保存済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); }
}

// 一括チェックは「表示中の部材」にのみ適用する
async function bulkStep(stepCode, on){
  const cur = allZones().find(x=>x.z.id===FMS.zone);
  const revs=(BOM_REVS[FMS.zone]||[]);
  const master=buildMaster(revs);
  let arr=Object.values(master).filter(p=>!p.is_consumable && p.masterStatus!=='removed');
  if(FMS.filter==='main')       arr=arr.filter(p=>(p.section||'').toUpperCase()==='MAIN');
  if(FMS.filter==='incomplete') arr=arr.filter(p=>progPct(FMS.zone,p.assm_mk,p.part_mk)<100);
  if(!arr.length) return;

  PROGRESS[FMS.zone] = PROGRESS[FMS.zone] || {};
  const rows = arr.map(p=>{
    PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk] = PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk] || {};
    PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk][stepCode] = on;
    return { work_zone_id:FMS.zone, project_id:cur.p.id,
      assm_mk:p.assm_mk, part_mk:p.part_mk, step_code:stepCode,
      is_complete:on, marked_by:ME.id, marked_at:new Date().toISOString() };
  });
  go('fab');
  const lbl = (PROC_STEPS.find(s=>s.step_code===stepCode)||{}).label_ja || stepCode;
  toast(`${on?'チェック':'解除'} ${lbl} — 表示中の ${rows.length} 部材`,'ok');
  try{
    sync(`保存中… 0/${rows.length}`);
    for(let i=0;i<rows.length;i+=400){
      await sb.from('fabrication_progress').upsert(rows.slice(i,i+400),
        { onConflict:'work_zone_id,assm_mk,part_mk,step_code' });
      sync(`保存中… ${Math.min(i+400,rows.length)}/${rows.length}`);
    }
    sync('保存済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}
