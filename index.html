<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辻鉄統合システム — TTSK System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --bg:#f6f8fb; --card:#ffffff; --bg2:#eef2f7;
  --border:#dde4ec; --border2:#c8d3e0;
  --text:#12233a; --muted:#64748b; --faint:#94a3b8;
  --accent:#1e5fa8; --accent2:#164a85; --accent-l:#e8f1fb;
  --ok:#15803d; --ok-l:#e8f5ec;
  --warn:#b45309; --warn-l:#fdf3e3;
  --danger:#b91c1c; --danger-l:#fceaea;
  --purple:#6d28d9; --purple-l:#f1ebfd;
  --radius:8px; --radius-s:5px;
  --sans:'Noto Sans JP','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* ── AUTH ── */
#authScreen{position:fixed;inset:0;background:linear-gradient(140deg,#12233a,#1e5fa8);z-index:9999;display:flex;align-items:center;justify-content:center}
#authScreen.hidden{display:none}
.auth-box{background:#fff;border-radius:14px;padding:38px 34px;width:410px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.02em}
.auth-logo p{font-size:12px;color:var(--muted);margin-top:5px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
.auth-tab{flex:1;padding:9px;background:var(--bg2);color:var(--muted);border:none;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.auth-tab.on{background:var(--accent);color:#fff}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border2);border-radius:var(--radius-s);padding:9px 11px;background:#fff;color:var(--text);outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,168,.12)}
.btn-full{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
.btn-full:hover{background:var(--accent2)}
.btn-full:disabled{opacity:.5;cursor:not-allowed}
.auth-msg{margin-top:13px;padding:9px 12px;border-radius:var(--radius-s);font-size:12.5px;display:none;line-height:1.5}
.auth-msg.err{display:block;background:var(--danger-l);color:var(--danger)}
.auth-msg.ok{display:block;background:var(--ok-l);color:var(--ok)}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:222px;min-width:222px;background:#12233a;color:#cbd6e4;display:flex;flex-direction:column}
.sb-logo{padding:17px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-logo h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em}
.sb-logo p{font-size:10.5px;color:#7e94ad;margin-top:2px;font-family:var(--mono)}
.sb-nav{flex:1;padding:9px 8px;overflow-y:auto}
.sb-sec{font-size:9.5px;color:#5f7690;text-transform:uppercase;letter-spacing:.09em;padding:11px 9px 5px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;background:none;border:none;color:#cbd6e4;cursor:pointer;border-radius:var(--radius-s);font-size:13px;text-align:left;transition:.12s;margin-bottom:1px}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.on{background:var(--accent);color:#fff;font-weight:600}
.sb-ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.sb-foot{padding:11px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:9px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.sb-user{flex:1;min-width:0}
.sb-user b{display:block;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user span{font-size:10.5px;color:#7e94ad}
.icon-btn{background:none;border:none;color:#7e94ad;cursor:pointer;padding:5px;border-radius:4px;font-size:14px}
.icon-btn:hover{background:rgba(255,255,255,.09);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:53px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.topbar h2{font-size:16px;font-weight:700;flex:1}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.page{display:none}
.page.on{display:block}

/* ── COMPONENTS ── */
.btn{border:1px solid var(--border2);background:#fff;color:var(--text);padding:7px 14px;border-radius:var(--radius-s);cursor:pointer;font-size:12.5px;font-weight:600;transition:.13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--muted)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-d{background:#fff;border-color:#e5b4b4;color:var(--danger)}
.btn-d:hover{background:var(--danger-l)}
.btn-s{padding:4px 9px;font-size:11.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:13.5px;font-weight:700;flex:1}
.card-b{padding:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill-ok{background:var(--ok-l);color:var(--ok)}
.pill-warn{background:var(--warn-l);color:var(--warn)}
.pill-risk{background:var(--danger-l);color:var(--danger)}
.pill-info{background:var(--accent-l);color:var(--accent)}
.pill-purple{background:var(--purple-l);color:var(--purple)}
.pill-grey{background:var(--bg2);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 11px;background:var(--bg2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty .big{font-size:34px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.stat .val{font-size:25px;font-weight:700;margin-top:3px;font-family:var(--mono)}
.stat .sub{font-size:11px;color:var(--faint);margin-top:1px}

/* ── MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:11px;width:600px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-h h3{font-size:15px;font-weight:700;flex:1}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg2);border-radius:0 0 11px 11px}
.x{background:none;border:none;font-size:21px;color:var(--faint);cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:var(--text)}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;padding:12px 17px;border-radius:var(--radius);font-size:13px;z-index:9999;opacity:0;transform:translateY(50px);transition:.25s;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateY(0)}
#toast.err{background:var(--danger)}
#toast.ok{background:var(--ok)}

/* ── PROJECT TREE ── */
.tree-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.tree-wrap{grid-template-columns:1fr}}
.tree{padding:8px}
.tnode{padding:7px 9px;border-radius:var(--radius-s);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;transition:.12s}
.tnode:hover{background:var(--bg2)}
.tnode.on{background:var(--accent-l);color:var(--accent);font-weight:600}
.tnode.lvl1{padding-left:22px;font-size:12.5px}
.tnode.lvl2{padding-left:38px;font-size:12.5px}
.tchev{width:13px;font-size:9px;color:var(--faint);flex-shrink:0}
.tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tzone{color:var(--purple)}

/* ── PHASE EDITOR ── */
.ph-row{display:grid;grid-template-columns:1fr 88px 110px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ph-row:last-child{border-bottom:none}
.ph-name{display:flex;align-items:center;gap:8px;font-size:12.5px}
.ph-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.ph-in{width:100%;border:1px solid var(--border2);border-radius:4px;padding:5px 8px;text-align:right;font-family:var(--mono);font-size:12px}
.ph-dates{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.chk input{width:14px;height:14px;cursor:pointer;accent-color:var(--ok)}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
canvas{display:block}

/* ── DELIVERY ── */
.truck-card{border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;margin-bottom:9px;background:var(--bg2)}
.truck-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.truck-h b{font-size:12.5px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:760px){.tgrid{grid-template-columns:1fr}}
.tf label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.tf input,.tf select{width:100%;border:1px solid var(--border2);border-radius:4px;padding:6px 8px;font-size:12.5px}

/* ── FLOW BOARD ── */
.board-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.board-row:last-child{border-bottom:none}
.board-proj b{font-size:12.5px;display:block}
.board-proj span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.phbar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.phcell{height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;position:relative}
.ph-done{background:#15803d}
.ph-cur{background:var(--accent);box-shadow:0 0 0 2px rgba(30,95,168,.28)}
.ph-none{background:var(--bg2);color:var(--faint)}
.ph-late{background:var(--danger)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.sec-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:16px 0 8px}
.tk-hdr,.tk-row{display:grid;grid-template-columns:1fr 74px 138px 138px 46px 128px;gap:8px;align-items:center}
.tk-hdr{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border2)}
.tk-phase{border-bottom:1px solid var(--border)}
.tk-phase:last-child{border-bottom:none}
.tk-row{padding:7px 8px}
.tk-main{background:var(--bg2)}
.tk-sub{padding-left:26px;font-size:12.5px}
.tk-sub.is-man{background:#faf6ff}
.tk-name{display:flex;align-items:center;gap:8px;min-width:0}
.tk-idx{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--bg2);border:1px solid var(--border2);font-size:10px;color:var(--muted);flex-shrink:0}
.tk-in{width:100%;border:1px solid var(--border2);border-radius:4px;padding:4px 7px;text-align:right;font-family:var(--mono);font-size:12px}
.tk-in:disabled{background:var(--bg2);color:var(--faint)}
.tk-dt{width:100%;border:1px solid var(--border2);border-radius:4px;padding:4px 6px;font-size:11.5px}
.tk-dt:disabled{background:var(--bg2);color:var(--faint);border-style:dashed}
.tk-date{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media(max-width:900px){.tk-hdr,.tk-row{grid-template-columns:1fr 60px 110px 110px 38px 92px;gap:5px}}
.proc{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);background:#fff;cursor:pointer;user-select:none;white-space:nowrap;font-size:11px}
.proc:hover{border-color:var(--accent)}
.proc.on{background:var(--ok-l);border-color:var(--ok);color:var(--ok);font-weight:600}
.proc input{width:11px;height:11px;pointer-events:none;accent-color:var(--ok)}
.prog2{display:flex;align-items:center;gap:6px;min-width:78px}
.prog2-bar{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.prog2-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .25s}
.dz{border:2px dashed var(--border2);border-radius:8px;padding:26px;text-align:center;cursor:pointer;transition:.15s;color:var(--muted)}
.dz:hover{border-color:var(--accent);background:var(--accent-l)}
.inline-note{background:var(--accent-l);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:12.5px;color:var(--text);margin-bottom:14px}
/* ══════════════════════════════════════════════════════════
   工程表 印刷レイアウト（A4 縦・1工区 1ページ）
   画面上は隠し、印刷時のみ出す。
   ══════════════════════════════════════════════════════════ */
.pcard-note{margin-bottom:9px;padding:6px 8px;background:var(--accent-l);border-radius:4px;
  font-size:11px;line-height:1.5;color:#334155;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard-note-t{font-size:9.5px;font-weight:700;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:0 4px;margin-right:5px}
#printRoot{display:none}
.pg{width:190mm;padding:0;font-family:var(--sans);color:#12233a;background:#fff}
.pg + .pg{margin-top:10mm}

.pg-hd{display:flex;align-items:flex-start;border-bottom:2px solid #12233a;padding-bottom:5px;margin-bottom:7px}
.pg-hd-l{flex:1;min-width:0}
.pg-ttl{font-size:16pt;font-weight:700;letter-spacing:.22em;line-height:1.15}
.pg-sub{font-size:10.5pt;font-weight:600;margin-top:3px}
.pg-path{font-size:9pt;color:#475569;margin-top:1px}
.pg-hd-r{flex:0 0 auto;text-align:right;margin-left:10px}
.stamp{border-collapse:collapse;margin-left:auto;border:1.2px solid #64748b}
.stamp-cap{font-size:7pt;font-weight:700;color:#64748b;letter-spacing:.14em;
           text-align:right;margin-bottom:1.5px}
.stamp th{border:1px solid #94a3b8;background:#eef2f7;font-size:7.5pt;font-weight:600;
          width:17mm;height:5mm;color:#475569;white-space:nowrap}
.stamp td{border:1px solid #94a3b8;height:13mm}
.pg-meta{display:flex;justify-content:flex-end;gap:6px;font-size:8.5pt;margin-top:3px}
.pg-meta span{color:#64748b}
.pg-meta b{font-weight:600;min-width:26mm;text-align:left;border-bottom:1px solid #cbd5e1;padding-left:3px}

.pg-legend{display:flex;flex-wrap:wrap;align-items:center;gap:3px 11px;
           border:1px solid #dde4ec;background:#f8fafc;border-radius:3px;padding:3px 7px;margin-bottom:6px}
.pg-legend .lg{display:inline-flex;align-items:center;gap:4px;font-size:7.5pt;color:#334155}
.pg-legend i{display:inline-block;width:9px;height:9px;border-radius:2px}

.pg-info{display:flex;flex-wrap:wrap;gap:0;border:1px solid #c8d3e0;margin-bottom:6px}
.pg-info div{flex:1 1 0;min-width:0;padding:3px 7px;border-right:1px solid #dde4ec;font-size:8.5pt}
.pg-info div:last-child{border-right:none}
.pg-info span{display:block;color:#64748b;font-size:7pt}
.pg-info b{font-family:var(--mono);font-size:9.5pt}

.pg-gantt{display:block;width:100%;border:1px solid #c8d3e0;margin-bottom:7px}

.pg-tbl{width:100%;border-collapse:collapse;font-size:8.5pt}
.pg-tbl th{background:#eef2f7;border:1px solid #c8d3e0;padding:3px 5px;font-weight:600;
           font-size:7.5pt;color:#475569;text-align:left}
.pg-tbl td{border:1px solid #dde4ec;padding:2.5px 5px;vertical-align:middle}
.pg-tbl tr.ph td{background:#f6f8fb;font-weight:700}
.pg-tbl tr.ph td.nm{border-left:3px solid var(--c)}
.pg-tbl td.num{text-align:right;font-family:var(--mono);width:13mm}
.pg-tbl td.dt{font-family:var(--mono);width:24mm;color:#334155}
.pg-tbl td.ctr{text-align:center;width:12mm}
.pg-tbl .idx{display:inline-block;width:13px;height:13px;line-height:13px;text-align:center;
             border:1px solid #cbd5e1;border-radius:50%;font-size:6.5pt;color:#64748b;margin-right:5px}
.pg-tbl .sub td.nm{padding-left:14px}
.pg-tbl .man{color:#6d28d9;font-weight:700}

.pg-note{font-size:7.5pt;color:#64748b;margin-top:5px;line-height:1.5}


.pg-clause{border:1px solid #c8d3e0;border-left:3px solid #12233a;padding:4px 8px;margin-top:7px}
.pg-clause-h{font-size:7.5pt;font-weight:700;color:#475569;letter-spacing:.08em;margin-bottom:1px}
.pg-clause p{font-size:8.5pt;line-height:1.65}

.pg-apv{margin-top:8px;display:flex;justify-content:flex-end}
.pg-apv-t{font-size:8pt;font-weight:600;color:#334155;align-self:flex-end;margin-right:8px;padding-bottom:2px}
.apv{border-collapse:collapse;border:1.2px solid #64748b}
.apv th{border:1px solid #94a3b8;background:#eef2f7;font-size:7.5pt;font-weight:600;
        color:#475569;padding:0 6px;height:8mm;white-space:nowrap;text-align:left}
.apv td{border:1px solid #94a3b8;height:8mm}
.apv td.w{width:46mm}
.apv td.nm{font-size:9pt;font-weight:600;padding:0 6px;vertical-align:middle}
.apv td.d{width:26mm}
.apv td.seal{width:26mm;background:repeating-linear-gradient(45deg,#fff 0 4px,#fafbfc 4px 8px)}
.pg-ft{display:flex;justify-content:space-between;border-top:1px solid #dde4ec;
       margin-top:6px;padding-top:3px;font-size:7.5pt;color:#94a3b8}

@media print{
  @page{ size:A4 portrait; margin:11mm 10mm; }
  html,body{background:#fff !important}
  #shell,#toast,#modalHost,#authScreen{display:none !important}
  #printRoot{display:block !important}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .pg,.pg-tbl,.pg-hd{page-break-inside:avoid}
  .pg-tbl tr{page-break-inside:avoid}

<script>

// ═══════════════════════════════════════════════════════════════

const SUPABASE_URL  = 'https://ezhdqhebaobkpdouhwjr.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aGRxaGViYW9ia3Bkb3Vod2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwMjk0MzIsImV4cCI6MjA4MTYwNTQzMn0.ERuR6c8uvJ0m9zr8IgcUAKjzs0C4z3s-zdtvyoZGn0o';

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let ME       = null;   // profile row
let PROJECTS = [];      // [{...project, subs:[{...sub, zones:[{...zone, phases:{}, actuals:{}}]}]}]
let PHASES   = [];      // schedule_phases (company default: 設計部→調達部→工場→工事部)
let DELIVS   = [];      // deliveries with trucks + items
let BOM_REVS   = {};    // zoneId → [revision {…, parts:[]}]
let PUR_BATCHES= {};    // zoneId → [batch]
let PUR_ITEMS  = {};    // zoneId → [item]
let PROGRESS   = {};    // zoneId → { 'assm||part': { step: bool } }
let PROC_STEPS = [];    // process_steps master
const ownerOf = r => r.block_id || r.work_zone_id;   // FMS の所有者キー
let PHASE_TASKS= [];    // phase_tasks master (サブ工程)
let PAGE     = 'dash';
let SEL      = { proj:null, sub:null, zone:null };
let authMode = 'in';

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
const $  = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// YYYY-MM-DD へ整形。
// ⚠ 以前は toISOString() を使っていたため、日本時間（UTC+9）では
//   par() が作る「現地0時」の Date が必ず前日として表示・保存されていた。
//   計算結果の日付（工程バー・computed_start/end・日付指定の初期値）が
//   すべて1日早くずれる原因になっていたので、現地の年月日を直接読む。
const fmt = d => {
  if(!d) return '';
  if(typeof d === 'string') return d.slice(0,10);   // 既に YYYY-MM-DD / ISO 文字列
  const x = (d instanceof Date) ? d : new Date(d);
  if(isNaN(x.getTime())) return '';
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
};
const par  = s => s ? new Date(s+'T00:00:00') : null;
const addD = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const dB   = (a,b) => Math.round((b-a)/864e5);
const fmtS = d => d ? (d.getMonth()+1)+'/'+d.getDate() : '';
const isWknd = d => { const x=d.getDay(); return x===0||x===6; };

// ═══════════════════════════════════════════════════════════════
//  稼働日カレンダー（日本の祝日 + 会社休日 + 部門別稼働パターン）
//
//  日数はすべて「稼働日数」で数える。暦日ではない。
//  祝日は法令どおり計算する（通信不要 — GitHub Pages でもオフラインでも動く）。
//  春分・秋分は天文近似式。1980〜2099 の範囲で有効。
// ═══════════════════════════════════════════════════════════════
const HOL_CACHE = {};
let COMPANY_HOL = {};          // 'YYYY-MM-DD' → 名称（会社独自の休業日）

const nthMonday = (y,m,n) => {           // その月の第 n 月曜
  const d = new Date(y, m-1, 1);
  const off = (8 - d.getDay()) % 7;      // 最初の月曜までの日数
  return new Date(y, m-1, 1 + off + (n-1)*7);
};
const keyOf = d => fmt(d);

// 国民の祝日（振替休日・国民の休日を含む）
function jpHolidays(year){
  if(HOL_CACHE[year]) return HOL_CACHE[year];
  const h = {};
  const put = (d,name)=>{ h[keyOf(d)] = name; };
  const fix = (m,day,name)=> put(new Date(year,m-1,day), name);

  fix(1,1,'元日');
  put(nthMonday(year,1,2), '成人の日');
  fix(2,11,'建国記念の日');
  if(year>=2020) fix(2,23,'天皇誕生日');
  // 春分・秋分（近似式）
  const sp = Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  const au = Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  put(new Date(year,2,sp), '春分の日');
  put(new Date(year,8,au), '秋分の日');
  fix(4,29,'昭和の日');
  fix(5,3,'憲法記念日');
  fix(5,4,'みどりの日');
  fix(5,5,'こどもの日');
  put(nthMonday(year,7,3), '海の日');
  fix(8,11,'山の日');
  put(nthMonday(year,9,3), '敬老の日');
  put(nthMonday(year,10,2), 'スポーツの日');
  fix(11,3,'文化の日');
  fix(11,23,'勤労感謝の日');

  // 振替休日 — 日曜と重なったら、次の平日まで送る
  Object.keys(h).slice().sort().forEach(k=>{
    const d = par(k);
    if(d.getDay()!==0) return;
    let n = addD(d,1);
    while(h[keyOf(n)]) n = addD(n,1);
    h[keyOf(n)] = '振替休日';
  });

  // 国民の休日 — 祝日に挟まれた平日（敬老の日と秋分の日の間など）
  Object.keys(h).slice().sort().forEach(k=>{
    const d = par(k), n2 = addD(d,2), mid = addD(d,1);
    if(h[keyOf(n2)] && !h[keyOf(mid)] && mid.getDay()!==0){
      h[keyOf(mid)] = '国民の休日';
    }
  });

  HOL_CACHE[year] = h;
  return h;
}

// その日の休日名（国民の祝日 → 会社休日 の順に見る）。休日でなければ ''
function holidayName(d){
  const k = keyOf(d);
  return jpHolidays(d.getFullYear())[k] || COMPANY_HOL[k] || '';
}
const isHoliday = d => !!holidayName(d);

// 部門ごとの稼働パターン
//   mon_fri  … 月〜金（土日祝・会社休日は休み）  既定
//   mon_sat  … 月〜土（日祝・会社休日は休み）
//   everyday … 無休（暦日と同じ）
const WORK_PATTERNS = [
  { key:'mon_fri',  label:'月〜金（土日祝 休み）' },
  { key:'mon_sat',  label:'月〜土（日祝 休み）'   },
  { key:'everyday', label:'無休（暦日）'          },
];
const BASE_PATTERN = 'mon_fri';        // 会社標準 — 工期判定の基準に使う

function patternOf(deptCode){
  const ph = PHASES.find(p=>p.dept_code===deptCode);
  return (ph && ph.work_pattern) || BASE_PATTERN;
}

// 稼働日かどうか
function isWorkday(d, pattern){
  const p = pattern || BASE_PATTERN;
  if(p==='everyday') return true;
  const w = d.getDay();
  if(w===0) return false;                       // 日曜は共通で休み
  if(w===6 && p!=='mon_sat') return false;      // 土曜は月〜土のみ稼働
  return !isHoliday(d);
}

// [a, b) に含まれる稼働日数
function wdB(a, b, pattern){
  if(!a||!b) return 0;
  let n=0, d=new Date(a), e=new Date(b), sign=1;
  if(e<d){ const t=d; d=e; e=t; sign=-1; }
  d.setHours(0,0,0,0); e.setHours(0,0,0,0);
  while(d<e){ if(isWorkday(d,pattern)) n++; d=addD(d,1); }
  return n*sign;
}

// a から n 稼働日ぶん進めた日（[a,x) の稼働日数が n になる最小の x）
function addWd(a, n, pattern){
  let d=new Date(a); d.setHours(0,0,0,0);
  let c=0, guard=0;
  while(c<n && guard++<20000){
    if(isWorkday(d,pattern)) c++;
    d=addD(d,1);
  }
  return d;
}

// b から n 稼働日ぶん遡った日（[x,b) の稼働日数が n になる最大の x）
function subWd(b, n, pattern){
  let d=new Date(b); d.setHours(0,0,0,0);
  let c=0, guard=0;
  while(c<n && guard++<20000){
    d=addD(d,-1);
    if(isWorkday(d,pattern)) c++;
  }
  return d;
}

// ═══════════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════════
function setAuthMode(m){

// ═══════════════════════════════════════════════════════════════
//  SCHEDULE ENGINE   ── 部門ベース（設計部→調達部→工場→工事部）
//
//  anchor の意味:
//    start          … 開始日から順方向
//    delivery_back  … 納期から逆算（納期に終わる）
//    delivery_fwd   … 納期から順方向（納入後の作業）
//    fill           … 前工程終了から。工期不足時は前後に重ねる（部分承認）
//
//  工期判定 need は counts_toward_need = true の工程のみ合計する。
//  工事部は現場搬入後の作業のため判定に含めない。
//
//  ★ 日数はすべて「稼働日数」。土日・祝日・会社休日は数えない。
//    稼働パターンは部門ごと（schedule_phases.work_pattern）。
//    必要日数・利用可能日数は会社標準カレンダー（月〜金）で測り、
//    部門ごとの暦の違いに左右されないようにしている。
// ═══════════════════════════════════════════════════════════════
function phasesFor(proj){
  const scope = proj.design_scope || {};
  const any = PHASES.some(p => scope[p.dept_code]);
  const list = any ? PHASES.filter(p => scope[p.dept_code]) : PHASES;
  return list.slice().sort((a,b)=>a.sequence-b.sequence);
}

function durOf(zone, code){
  const d = zone.dur && zone.dur[code];
  return (d && d.duration_days != null) ? d.duration_days : 50;
}

// ── サブ工程 ──
function tasksFor(deptCode){
  return PHASE_TASKS.filter(t=>t.dept_code===deptCode).sort((a,b)=>a.sequence-b.sequence);
}
function taskRec(zone, deptCode, taskCode){
  return (zone.tasks && zone.tasks[deptCode] && zone.tasks[deptCode][taskCode]) || {};
}
function taskDur(zone, deptCode, t){
  const r = taskRec(zone, deptCode, t.task_code);
  return r.duration_days ?? t.default_days ?? 10;
}

// 開始日からサブ工程を並べる。
// 手動日付が入っている工程はそれを優先し、後続はその終了日から続く。
function layoutTasks(zone, deptCode, phaseStart){
  const list = tasksFor(deptCode);
  if(!list.length) return null;
  let cursor = new Date(phaseStart);
  const out = [];
  for(const t of list){
    const r = taskRec(zone, deptCode, t.task_code);
    let s, e, manual = false;
    if(r.is_manual && r.start_date && r.end_date){
      s = par(r.start_date); e = par(r.end_date); manual = true;
    } else {
      s = new Date(cursor); e = addWd(s, taskDur(zone, deptCode, t), patternOf(deptCode));
    }
    out.push({ task:t, start:s, end:e, manual, done:!!r.completed });
    if(e > cursor) cursor = new Date(e);
  }
  return out;
}

// 工程の実効稼働日数 = サブ工程の日数の合計。
// 日付指定のサブ工程は、その期間（終了日−開始日）を自分の日数として持ち込む。
// 絶対位置は工期日数に影響させない（位置は layoutTasks が扱う）。
function effDur(zone, deptCode){
  const list = tasksFor(deptCode);
  if(!list.length) return durOf(zone, deptCode);
  return list.reduce((a,t)=>{
    const r = taskRec(zone, deptCode, t.task_code);
    if(r.is_manual && r.start_date && r.end_date){
      return a + Math.max(0, wdB(par(r.start_date), par(r.end_date), patternOf(deptCode)));
    }
    return a + taskDur(zone, deptCode, t);
  }, 0);
}

// 工区 = the only schedulable unit
function calcZone(zone, phases){
  zone.bars = {};
  zone.overlap = { before:0, after:0 };
  const st = par(zone.start_date), dl = par(zone.delivery_date);

  if(!st || !dl){
    zone.schedule_status='ok'; zone.needed_days=0; zone.available_days=0;
    zone.computed_start=null; zone.computed_end=null;
    return;
  }

  const D = {}; phases.forEach(p=>{ D[p.dept_code] = effDur(zone, p.dept_code); });

  // 工期判定 — 判定対象の工程を順に連ねたとき、開始日から納期までに収まるか。
  // 部門ごとに稼働暦が違うので、必要／利用可能はどちらも会社標準暦で測る。
  let chain = new Date(st);
  phases.filter(p=>p.counts_toward_need)
        .forEach(p=>{ chain = addWd(chain, D[p.dept_code], patternOf(p.dept_code)); });
  const need  = wdB(st, chain, BASE_PATTERN);
  const avail = wdB(st, dl,    BASE_PATTERN);
  zone.needed_days = need;
  zone.available_days = avail;
  zone.schedule_status = need <= avail ? 'ok' : 'risk';

  const fwd  = phases.find(p=>p.anchor==='start');
  const back = phases.find(p=>p.anchor==='delivery_back');
  const post = phases.find(p=>p.anchor==='delivery_fwd');
  const fill = phases.find(p=>p.anchor==='fill');

  let fwdEnd = st, backStart = dl;

  zone.taskBars = {};

  // 工程を配置し、その都度サブ工程を並べて実際の幅を確定する。
  // 手動日付で工程が伸びた場合、後続工程はその実際の終了日から始まる。
  const place = (ph, start, end) => {
    let b = { start, end };
    const lay = layoutTasks(zone, ph.dept_code, start);
    if(lay && lay.length){
      zone.taskBars[ph.dept_code] = lay;
      let tmn=null, tmx=null;
      lay.forEach(x=>{ if(!tmn||x.start<tmn)tmn=x.start; if(!tmx||x.end>tmx)tmx=x.end; });
      b = { start:tmn, end:tmx };
    }
    zone.bars[ph.dept_code] = b;
    return b;
  };

  // ① 順方向（設計）— 開始日から。サブ工程確定後の終了日を採用
  if(fwd) fwdEnd = place(fwd, st, addWd(st, D[fwd.dept_code], patternOf(fwd.dept_code))).end;

  // ② 逆算（製作）— 納期から遡る
  if(back) backStart = place(back, subWd(dl, D[back.dept_code], patternOf(back.dept_code)), dl).start;

  // ③ 納入後（工事）
  if(post) place(post, dl, addWd(dl, D[post.dept_code], patternOf(post.dept_code)));

  // ④ 中間（調達）— ①②が確定した後に配置する
  //    圧縮の式（excess を前後へ半分ずつ）は従来どおり。単位が稼働日になっただけ。
  if(fill){
    const pat = patternOf(fill.dept_code);
    const d   = D[fill.dept_code];
    const space = wdB(fwdEnd, backStart, pat);
    if(zone.schedule_status==='ok' && space >= d){
      // 順送り。製作開始まで余裕があれば空きが生じる
      place(fill, fwdEnd, addWd(fwdEnd, d, pat));
    } else {
      // 工期不足 → 前後に重ねて圧縮（部分承認での先行手配）
      const excess = d - space;
      const ol1 = Math.max(0, Math.ceil(excess/2));
      const ol2 = Math.max(0, Math.floor(excess/2));
      const s2  = subWd(fwdEnd, ol1, pat);
      place(fill, s2, addWd(s2, d, pat));
      zone.overlap = { before:ol1, after:ol2 };
    }
  }

  let mn=null, mx=null;
  Object.values(zone.bars).forEach(b=>{
    if(!mn||b.start<mn) mn=b.start;
    if(!mx||b.end  >mx) mx=b.end;
  });

  // ブロックを計算し、期間を包含する（§5 のとおりリスクは上へ伝播する）
  let blockRisk = false;
  (zone.blocks||[]).forEach(bk=>{
    calcBlock(bk, phases);
    if(bk.computed_start && (!mn||bk.computed_start<mn)) mn=bk.computed_start;
    if(bk.computed_end   && (!mx||bk.computed_end  >mx)) mx=bk.computed_end;
    if(bk.schedule_status==='risk') blockRisk = true;
  });
  zone.block_risk = blockRisk;
  zone.any_risk   = zone.schedule_status==='risk' || blockRisk;

  zone.computed_start = mn;
  zone.computed_end   = mx;
}

// ── 工区内ブロック（部分承認の上先行発注）──
// 一部だけ先に承認が下り、材料手配と製作を先行させる区画。
// 工区と同じ配置ルールだが、サブ工程は持たず工程日数だけで決まる。
function blockDur(bl, code){
  const d = bl.dur && bl.dur[code];
  return (d && d.duration_days != null) ? d.duration_days : 0;
}

function calcBlock(bl, phases){
  bl.bars = {};
  bl.overlap = { before:0, after:0 };
  const st = par(bl.start_date), dl = par(bl.delivery_date);
  if(!st || !dl){
    bl.schedule_status='ok'; bl.needed_days=0; bl.available_days=0;
    bl.computed_start=null; bl.computed_end=null;
    return;
  }

  const D = {}; phases.forEach(p=>{ D[p.dept_code] = blockDur(bl, p.dept_code); });

  let chain = new Date(st);
  phases.filter(p=>p.counts_toward_need)
        .forEach(p=>{ chain = addWd(chain, D[p.dept_code], patternOf(p.dept_code)); });
  bl.needed_days    = wdB(st, chain, BASE_PATTERN);
  bl.available_days = wdB(st, dl,    BASE_PATTERN);
  bl.schedule_status = bl.needed_days <= bl.available_days ? 'ok' : 'risk';

  const fwd  = phases.find(p=>p.anchor==='start');
  const back = phases.find(p=>p.anchor==='delivery_back');
  const post = phases.find(p=>p.anchor==='delivery_fwd');
  const fill = phases.find(p=>p.anchor==='fill');
  const put  = (ph,a,b)=>{ bl.bars[ph.dept_code] = { start:a, end:b }; return b; };

  let fwdEnd = st, backStart = dl;
  if(fwd && D[fwd.dept_code] > 0)
    fwdEnd = put(fwd, st, addWd(st, D[fwd.dept_code], patternOf(fwd.dept_code)));
  if(back && D[back.dept_code] > 0){
    const bs = subWd(dl, D[back.dept_code], patternOf(back.dept_code));
    put(back, bs, dl); backStart = bs;
  }
  if(post && D[post.dept_code] > 0)
    put(post, dl, addWd(dl, D[post.dept_code], patternOf(post.dept_code)));
  if(fill && D[fill.dept_code] > 0){
    const pat = patternOf(fill.dept_code), d = D[fill.dept_code];
    const space = wdB(fwdEnd, backStart, pat);
    if(bl.schedule_status==='ok' && space >= d){
      put(fill, fwdEnd, addWd(fwdEnd, d, pat));
    } else {
      const excess = d - space;
      const ol1 = Math.max(0, Math.ceil(excess/2));
      const ol2 = Math.max(0, Math.floor(excess/2));
      const s2  = subWd(fwdEnd, ol1, pat);
      put(fill, s2, addWd(s2, d, pat));
      bl.overlap = { before:ol1, after:ol2 };
    }
  }

  let mn=null, mx=null;
  Object.values(bl.bars).forEach(b=>{
    if(!mn||b.start<mn) mn=b.start;
    if(!mx||b.end  >mx) mx=b.end;
  });
  bl.computed_start = mn; bl.computed_end = mx;
}

// 項目 = rollup of its 工区
function calcSub(sub, phases){
  let mn=null, mx=null, risk=false;
  for(const z of sub.zones){
    calcZone(z, phases);
    if(z.computed_start && (!mn||z.computed_start<mn)) mn=z.computed_start;
    if(z.computed_end   && (!mx||z.computed_end  >mx)) mx=z.computed_end;
    if(z.any_risk || z.schedule_status==='risk') risk=true;
  }
  sub.computed_start=mn; sub.computed_end=mx;
  sub.schedule_status = risk?'risk':'ok';
}

// project = rollup of its 項目
function calcProject(proj){
  const phases = phasesFor(proj);
  let mn=null, mx=null, risk=false;
  for(const s of proj.subs){
    calcSub(s, phases);
    if(s.computed_start && (!mn||s.computed_start<mn)) mn=s.computed_start;
    if(s.computed_end   && (!mx||s.computed_end  >mx)) mx=s.computed_end;
    if(s.schedule_status==='risk') risk=true;
  }
  proj.computed_start=mn; proj.computed_end=mx;
  proj.schedule_status = risk?'risk':'ok';
  proj._zoneCount = proj.subs.reduce((a,s)=>a+s.zones.length,0);
}

function recalcAll(){ PROJECTS.forEach(calcProject); }

async function loadProjects(){
  const [pr, sp, wz, ps, pa, ts, bl, bd] = await Promise.all([
    sb.from('projects').select('*').order('project_code'),
    sb.from('sub_projects').select('*').order('sort_order'),
    sb.from('work_zones').select('*').order('sort_order'),
    sb.from('zone_phase_durations').select('*'),
    sb.from('zone_phase_actuals').select('*'),
    sb.from('zone_task_schedule').select('*'),
    sb.from('zone_blocks').select('*').order('sort_order'),
    sb.from('zone_block_durations').select('*'),
  ]);
  // ブロックは migration_v7 未適用でも落ちないようにする
  for(const r of [pr,sp,wz,ps,pa,ts]) if(r.error) throw r.error;

  const durByZone = {};
  (ps.data||[]).forEach(r=>{
    (durByZone[r.work_zone_id] = durByZone[r.work_zone_id] || {})[r.dept_code] = r;
  });
  const actByZone = {};
  (pa.data||[]).forEach(r=>{
    (actByZone[r.work_zone_id] = actByZone[r.work_zone_id] || {})[r.dept_code] = r;
  });

  const taskByZone = {};
  (ts.data||[]).forEach(r=>{
    const z = taskByZone[r.work_zone_id] = taskByZone[r.work_zone_id] || {};
    (z[r.dept_code] = z[r.dept_code] || {})[r.task_code] = r;
  });

  // ── 工区内ブロック（部分承認の上先行発注）──
  const bdurByBlock = {};
  (bd && bd.data ? bd.data : []).forEach(r=>{
    (bdurByBlock[r.block_id] = bdurByBlock[r.block_id] || {})[r.dept_code] = r;
  });
  const blocksByZone = {};
  (bl && bl.data ? bl.data : []).forEach(b=>{
    b.dur = bdurByBlock[b.id] || {};
    (blocksByZone[b.work_zone_id] = blocksByZone[b.work_zone_id] || []).push(b);
  });

  const zonesBySub = {};
  (wz.data||[]).forEach(z=>{
    z.dur     = durByZone[z.id] || {};
    z.actuals = actByZone[z.id] || {};
    z.tasks   = taskByZone[z.id] || {};
    z.blocks  = blocksByZone[z.id] || [];
    (zonesBySub[z.sub_project_id] = zonesBySub[z.sub_project_id] || []).push(z);
  });

  const subsByProj = {};
  (sp.data||[]).forEach(s=>{
    s.zones = zonesBySub[s.id] || [];
    (subsByProj[s.project_id] = subsByProj[s.project_id] || []).push(s);
  });

  PROJECTS = (pr.data||[]).map(p=>({ ...p, subs: subsByProj[p.id] || [] }));
  recalcAll();
}

// プロジェクトの実績進捗 — サブ工程の完了率
function projProgress(p){
  let total=0, done=0;
  p.subs.forEach(s=>s.zones.forEach(z=>{
    PHASES.forEach(ph=>tasksFor(ph.dept_code).forEach(t=>{
      total++;
      if(taskRec(z, ph.dept_code, t.task_code).completed) done++;
    }));
  }));
  return total ? done/total : 0;
}

// 予定進捗 — 経過日数の割合
function projElapsed(p){
  if(!p.computed_start || !p.computed_end) return null;
  const span = wdB(p.computed_start, p.computed_end, BASE_PATTERN);
  if(span <= 0) return null;
  const el = wdB(p.computed_start, new Date(), BASE_PATTERN);
  return Math.min(1, Math.max(0, el/span));
}

// 遅延判定 — 実績が予定より10ポイント以上遅れていれば遅延
function projHealth(p){
  if(p.schedule_status==='risk') return { key:'risk', ja:'工期リスク', cls:'pill-risk' };
  const el = projElapsed(p);
  const ac = projProgress(p);
  if(el === null)      return { key:'na',    ja:'日程未設定', cls:'pill-grey' };
  if(el >= 1 && ac<1)  return { key:'over',  ja:'納期超過',   cls:'pill-risk' };
  if(ac >= el - 0.10)  return { key:'ontime',ja:'順調',       cls:'pill-ok' };
  if(ac >= el - 0.25)  return { key:'watch', ja:'やや遅延',   cls:'pill-warn' };
  return { key:'late', ja:'遅延', cls:'pill-risk' };
}

function currentPhaseOf(p){
  const f = FLOW_PHASES.find(x=>phaseStateFor(p,x.code)==='cur');
  return f ? f.ja : (phaseStateFor(p,'G')==='done' ? '完了' : '—');
}

function delivPill(s){
  const M = {
    planned :['pill-grey','計画'],
    arranged:['pill-info','手配済'],

    shipped :['pill-warn','出荷済'],

// ═══════════════════════════════════════════════════════════════
//  BUSINESS FLOW BOARD  (M2 — simplified Phase 1)
// ═══════════════════════════════════════════════════════════════
const FLOW_PHASES = [
  {code:'A',ja:'受注'},{code:'B',ja:'引継'},{code:'C',ja:'設計'},
  {code:'D',ja:'製作'},{code:'E',ja:'検査'},{code:'F',ja:'出荷'},{code:'G',ja:'精算'}
];

// ── 実データからフェーズ進捗を算出する ──
// サブ工程の完了・BOM取込・手配・製作進捗・出荷実績を根拠にする。
// 根拠がない段階のみプロジェクト状態を使う。
function subTaskPct(proj, deptCodes){
  let total=0, done=0;
  proj.subs.forEach(s=>s.zones.forEach(z=>{
    deptCodes.forEach(dc=>{
      tasksFor(dc).forEach(t=>{
        total++;
        if(taskRec(z, dc, t.task_code).completed) done++;
      });
    });
  }));
  return total ? done/total : 0;
}

function zoneIdsOf(proj){
  const out=[];
  proj.subs.forEach(s=>s.zones.forEach(z=>out.push(z.id)));
  return out;
}

// 製作進捗（FMSの部材チェック）の平均
function fabPctOf(proj){
  const ids = zoneIdsOf(proj);
  let total=0, done=0;
  ids.forEach(zid=>{
    const revs=(BOM_REVS[zid]||[]);
    if(!revs.length) return;
    const m=buildMaster(revs);
    Object.values(m).forEach(p=>{
      if(p.is_consumable || p.masterStatus==='removed') return;
      total++;
      if(progPct(zid,p.assm_mk,p.part_mk)===100) done++;
    });
  });
  return total ? done/total : null;   // null = 根拠なし
}

function phaseProgress(proj, code){
  const st = proj.status || 'planning';
  const order = ['planning','design','fabrication','dispatching','complete','archived'];
  const idx = Math.max(0, order.indexOf(st));
  const ids = zoneIdsOf(proj);

  switch(code){
    case 'A': // 受注 — プロジェクトが存在すれば完了
      return 1;

    case 'B': // 引継 — 開始日が設定されていれば完了とみなす
      return proj.computed_start ? 1 : (idx>=1?1:0);

    case 'C': { // 設計 — 設計サブ工程の完了率
      return subTaskPct(proj, ['design']);
    }
    case 'D': { // 製作 — 調達＋製作サブ工程と、FMSの部材進捗の平均
      const sub = subTaskPct(proj, ['procure','factory']);
      const fab = fabPctOf(proj);
      return fab===null ? sub : (sub+fab)/2;
    }
    case 'E': { // 検査 — 製品検査サブ工程
      let total=0, done=0;
      proj.subs.forEach(s=>s.zones.forEach(z=>{
        total++;
        if(taskRec(z,'factory','qc').completed) done++;
      }));
      return total ? done/total : 0;
    }
    case 'F': { // 出荷 — 受領済／全出荷
      const ds = DELIVS.filter(d=>d.project_id===proj.id && d.status!=='cancelled');
      if(!ds.length) return 0;
      return ds.filter(d=>d.status==='received').length / ds.length;
    }
    case 'G': // 精算
      return st==='complete' || st==='archived' ? 1 : 0;
  }
  return 0;
}

function phaseStateFor(proj, code){
  const pct = phaseProgress(proj, code);
  if(pct >= 0.999) return 'done';
  if(pct > 0)      return 'cur';
  // 未着手でも、前フェーズが完了していれば「現在のフェーズ」とみなす
  const i = FLOW_PHASES.findIndex(f=>f.code===code);
  if(i>0 && phaseProgress(proj, FLOW_PHASES[i-1].code) >= 0.999) return 'cur';
  return 'none';
}

function renderDetail(){
  const p = curProj();

  if(s) return renderSubDetail(p, s);

}

          <td style="text-align:right"><span class="muted">›</span></td>
        </tr>`).join('')}</tbody></table>`

// ── WORK ZONE (工区) LEVEL — the schedule editor ──

// ═══════════════════════════════════════════════════════════════
//  部分承認の上先行発注 — 工区内ブロック
//
//  工事が進むと、工区の一部だけ先に承諾が下りることがある。
//  その区画を切り出し、本体とは別の日程で手配・製作を先行させる。
//  ブロックはサブ工程を持たず、工程日数だけで決まる。
// ═══════════════════════════════════════════════════════════════
function blocksOf(z){ return (z && z.blocks) || []; }

async function newBlock(){
  const p=curProj(), s=curSub(), z=curZone();
  if(!z){ toast('工区を選んでください','err'); return; }
  const n   = blocksOf(z).length + 1;
  const phs = phasesFor(p);
  // 既定は工区の期間の後半 — 先行分は本体より短い日程になることが多い
  const st  = z.start_date || fmt(new Date());
  const dl  = z.delivery_date || fmt(addD(new Date(),90));
  try{
    sync('作成中…');
    const { data:bk, error } = await sb.from('zone_blocks').insert({
      work_zone_id:z.id, project_id:p.id, name:'先行'+n,
      start_date:st, delivery_date:dl, approved_on:fmt(new Date()),
      sort_order:n, created_by:ME.id
    }).select().single();
    if(error) throw error;
    const rows = phs.map(ph=>({ block_id:bk.id, dept_code:ph.dept_code,
      duration_days: Math.max(1, Math.round((durOf(z,ph.dept_code)||10)/2)) }));
    const { error:e2 } = await sb.from('zone_block_durations').insert(rows);
    if(e2) throw e2;
    await loadProjects();
    toast('先行発注ブロックを作成しました','ok');
    refreshProj(); sync('保存済');
  }catch(e){
    toast('作成できません（migration_v7 未適用？）: '+e.message,'err'); sync('エラー');
  }
}

function onBlockField(blockId, field, val){
  const z=curZone(); if(!z) return;
  const bk = blocksOf(z).find(b=>b.id===blockId); if(!bk) return;
  bk[field] = val || null;
  calcProject(curProj());
  refreshProj();
}

function onBlockDur(blockId, code, val){
  const z=curZone(); if(!z) return;
  const bk = blocksOf(z).find(b=>b.id===blockId); if(!bk) return;
  bk.dur = bk.dur || {};
  bk.dur[code] = bk.dur[code] || { block_id:blockId, dept_code:code };
  bk.dur[code].duration_days = Math.max(0, parseInt(val,10) || 0);
  calcProject(curProj());
  refreshProj();
}

async function saveBlock(blockId){
  const p=curProj(), z=curZone();
  const bk = blocksOf(z).find(b=>b.id===blockId); if(!bk) return;
  try{
    sync('保存中…');
    const { error } = await sb.from('zone_blocks').update({
      name:bk.name, start_date:bk.start_date||null,
      delivery_date:bk.delivery_date||null, approved_on:bk.approved_on||null, note:bk.note||null
    }).eq('id', blockId);
    if(error) throw error;
    const rows = phasesFor(p).map(ph=>({
      block_id:blockId, dept_code:ph.dept_code, duration_days:blockDur(bk, ph.dept_code)
    }));
    const { error:e2 } = await sb.from('zone_block_durations')
      .upsert(rows, { onConflict:'block_id,dept_code' });
    if(e2) throw e2;
    await persistDerived(p);
    toast('先行発注ブロックを保存しました','ok'); sync('保存済 · '+new Date().toLocaleTimeString('ja-JP'));
    refreshProj();
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

async function delBlock(blockId){
  const z=curZone();
  const bk = blocksOf(z).find(b=>b.id===blockId); if(!bk) return;
  const hasFms = (BOM_REVS[blockId]||[]).length || (PUR_BATCHES[blockId]||[]).length;
  if(!confirm(`「${bk.name}」を削除します。`+(hasFms?'\nこのブロックのBOM・手配データも削除されます。':'')+'\nよろしいですか？')) return;
  try{
    const { error } = await sb.from('zone_blocks').delete().eq('id', blockId);
    if(error) throw error;
    await loadProjects(); await loadFms();
    if(FMS.zone===blockId) FMS.zone=null;
    toast('削除しました','ok'); refreshProj();
  }catch(e){ toast('削除エラー: '+e.message,'err'); }
}

// ═══════════════════════════════════════════════════════════════
//  工程表の印刷  ── A4縦・1工区 1ページ
//
//  時間軸はプロジェクト全体で共通。ページを並べて比較できるようにする。
//  画面の入力パネル（工程/サブ工程）をそのまま静的な表として刷る。
// ═══════════════════════════════════════════════════════════════
let PRINT = { subs:{}, zones:{}, omit:{}, author:'', date:'' };

function printSchedule(){
  const p = curProj(); if(!p) return;
  if(!p.subs.length){ toast('項目がありません','err'); return; }

  // 既定はすべて選択。工区がひとつだけの項目は「項目＝工区」なので名称を省く。
  PRINT = { subs:{}, zones:{}, omit:{}, author:(ME&&(ME.full_name||ME.email))||'', date:fmt(new Date()) };
  p.subs.forEach(s=>{
    PRINT.subs[s.id]=true;
    PRINT.omit[s.id]=(s.zones.length===1);
    s.zones.forEach(z=>{ PRINT.zones[z.id]=true; });
  });

  openModal(`
    <div class="modal" style="width:560px">
      <div class="modal-h"><h3>工程表を印刷 — ${esc(p.project_code)} ${esc(p.name)}</h3></div>
      <div class="modal-b" style="max-height:52vh;overflow-y:auto">
        <div class="sec-lbl" style="margin-top:0">印刷する項目・工区</div>
        <div id="prTree">${printTree(p)}</div>
      </div>
      <div class="modal-b" style="border-top:1px solid var(--border);padding-top:14px">
        <div class="grid g2">
          <div class="fld" style="margin:0"><label>作成日</label>
            <input type="date" id="prDate" value="${esc(PRINT.date)}"></div>
          <div class="fld" style="margin:0"><label>作成者</label>
            <input type="text" id="prAuthor" value="${esc(PRINT.author)}" placeholder="氏名"></div>
        </div>
        <p class="hint" style="margin-top:8px">
          A4縦・1工区につき1ページで出力します。時間軸はプロジェクト全体で共通です。
        </p>
      </div>
      <div class="modal-f">
        <button class="btn" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-p" onclick="doPrintSchedule()">🖨 印刷</button>
      </div>
    </div>`);
}

function printTree(p){
  return p.subs.map(s=>{
    const one = s.zones.length===1;
    return `
    <div style="border:1px solid var(--border);border-radius:var(--radius-s);padding:9px 11px;margin-bottom:7px">
      <label class="chk" style="font-weight:700">
        <input type="checkbox" ${PRINT.subs[s.id]?'checked':''}
          onchange="prToggleSub('${s.id}',this.checked)"> ${esc(s.name)}
        <span class="muted" style="font-weight:500;font-size:11px">　${s.zones.length}工区</span>
      </label>
      ${one ? `
        <div style="margin:6px 0 0 22px">
          <label class="chk" style="font-size:11.5px;color:var(--purple)">
            <input type="checkbox" ${PRINT.omit[s.id]?'checked':''}
              onchange="PRINT.omit['${s.id}']=this.checked">
            工区名「${esc(s.zones[0].name)}」を省略する（項目＝工区）
          </label>
        </div>`
      : `<div style="margin:6px 0 0 22px;display:flex;flex-wrap:wrap;gap:4px 14px">
          ${s.zones.map(z=>`
            <label class="chk" style="font-size:12px">
              <input type="checkbox" ${PRINT.zones[z.id]?'checked':''}
                onchange="PRINT.zones['${z.id}']=this.checked">
              ${esc(z.name)}${z.schedule_status==='risk'?' <span style="color:var(--danger)">⚠</span>':''}
            </label>`).join('')}
        </div>`}
    </div>`;
  }).join('');
}

function prToggleSub(sid, on){
  PRINT.subs[sid]=on;
  const p=curProj(); if(!p) return;
  const s=p.subs.find(x=>x.id===sid);
  if(s) s.zones.forEach(z=>{ PRINT.zones[z.id]=on; });
  $('prTree').innerHTML = printTree(p);
}

// 選択された工区を、印刷順（項目 → 工区）に並べて返す
function printTargets(p){
  const out=[];
  p.subs.forEach(s=>{
    if(!PRINT.subs[s.id]) return;
    s.zones.forEach(z=>{ if(PRINT.zones[z.id]) out.push({ s, z, omit:!!PRINT.omit[s.id] && s.zones.length===1 }); });
  });
  return out;
}

// プロジェクト全体の共通時間軸
function printRange(p){
  let mn=p.computed_start, mx=p.computed_end;
  p.subs.forEach(s=>s.zones.forEach(z=>{
    if(z.computed_start && (!mn||z.computed_start<mn)) mn=z.computed_start;
    if(z.computed_end   && (!mx||z.computed_end  >mx)) mx=z.computed_end;
  }));
  if(!mn){ mn=new Date(); mx=addD(new Date(),120); }
  return { mn:addD(mn,-5), mx:addD(mx,5) };
}

function doPrintSchedule(){
  const p=curProj(); if(!p) return;
  PRINT.date   = $('prDate').value || fmt(new Date());
  PRINT.author = $('prAuthor').value || '';
  const tg = printTargets(p);
  if(!tg.length){ toast('印刷する工区を選んでください','err'); return; }

  const range = printRange(p);
  $('printRoot').innerHTML = tg.map((t,i)=>printPage(p,t.s,t.z,t.omit,i+1,tg.length)).join('');
  closeModal();

  // キャンバスは display:none 配下でも描ける（レイアウト非依存のため）
  tg.forEach((t,i)=> drawPrintGantt($('pgc'+i), p, t.z, range));

  setTimeout(()=>{ window.print(); }, 60);
}

  const rows = phases.map(ph=>{
    const b    = z.bars ? z.bars[ph.dept_code] : null;
    const ac   = z.actuals[ph.dept_code] || {};
    const subs = tasksFor(ph.dept_code);
    const lay  = (z.taskBars && z.taskBars[ph.dept_code]) || null;
    const head = `
      <tr class="ph" style="--c:${ph.colour}">
        <td class="nm">${esc(ph.label_ja)}
          <span style="font-weight:400;font-size:7pt;color:#64748b">　${PR_ANCHOR[ph.anchor]||''}</span></td>
        <td class="num">${b?wdB(b.start,b.end,patternOf(ph.dept_code)):0}</td>

        <td class="dt">${b?fmt(b.end):'—'}</td>

      const r  = taskRec(z, ph.dept_code, t.task_code);

        <td class="num">${taskDur(z,ph.dept_code,t)}</td>

        <td class="dt">${man?esc(r.end_date||''):(bb?fmt(bb.end):'—')}</td>

    }).join('');

  }).join('');

  const keys = KEY_DATES.map(k=>{

  return `

      <div class="pg-hd-l">
        <div class="pg-ttl">工程表</div>
        <div class="pg-sub">${esc(p.project_code)}　${esc(p.name)}</div>
        <div class="pg-path">${path}</div>
      </div>
      <div class="pg-hd-r">
        <div class="stamp-cap">確　認</div>
        <table class="stamp">
          <tr>${phases.map(ph=>`<th>${esc(ph.label_ja)}</th>`).join('')}</tr>
          <tr>${phases.map(()=>'<td></td>').join('')}</tr>
        </table>
        <div class="pg-meta"><span>作成日</span><b>${esc(PRINT.date)}</b></div>
        <div class="pg-meta"><span>作成者</span><b>${esc(PRINT.author)}</b></div>
      </div>
    </div>

    <div class="pg-legend">
      ${phases.map(ph=>`<span class="lg"><i style="background:${ph.colour}"></i>${esc(ph.label_ja)}</span>`).join('')}
      ${KEY_DATES.map(k=>`<span class="lg"><span style="color:${k.colour}">◆</span>${k.label}</span>`).join('')}
    </div>

    <div class="pg-info">
      <div><span>開始日（設計着手）</span><b>${esc(z.start_date||'—')}</b></div>
      <div><span>納期（現場搬入）</span><b>${esc(z.delivery_date||'—')}</b></div>
      <div><span>必要稼働日数</span><b>${z.needed_days??0}日</b></div>
      <div><span>利用可能稼働日数</span><b>${z.available_days??0}日</b></div>
      <div><span>工期判定</span><b style="color:${risk?'#b91c1c':'#15803d'}">${risk?'要調整':'成立'}</b></div>
    </div>

    <canvas class="pg-gantt" id="pgc${no-1}"></canvas>

    <table class="pg-tbl">
      <thead><tr>
        <th>工程 ／ サブ工程</th><th style="text-align:right">日数</th>
        <th>開始</th><th>終了</th>
      </tr></thead>
      <tbody>${rows}</tbody>

    <div class="pg-info" style="margin-top:6px">${keys}</div>

    ${risk&&z.overlap&&(z.overlap.before||z.overlap.after)?`
      <p class="pg-note">※ 工期が不足しているため、調達を設計側へ ${z.overlap.before}日 ／ 製作側へ ${z.overlap.after}日 重ねています（部分承認による先行手配）。</p>`:''}
    <p class="pg-note">日数はすべて稼働日数です（土日・祝日・会社休日を除く）。工程の日数はサブ工程の合計です。</p>

    ${note ? `<div class="pg-clause">

    <div class="pg-apv">

        <tr><th>ご担当者</th><td class="w"></td><th>印</th><td class="seal"></td></tr>

    </div>

    <div class="pg-ft">
      <span>${esc(p.project_code)}　${esc(short)}</span>
      <span>${esc(PRINT.date)}　${no} / ${total}</span>
    </div>
  </div>`;
}

// ── 印刷用ガント（1工区・部門ごとに1行） ──
function drawPrintGantt(cv, proj, zone, range){
  if(!cv) return;
  const phases = phasesFor(proj);
  const LP=84, W=718, ROW=24, HDR=28, KEY=11, ROW_B=19;   // KEY = キー日程マーカー用の帯
  const blocks = zone.blocks || [];
  const H = HDR + KEY + phases.length*ROW + blocks.length*ROW_B + 4;
  const S = 3;                                  // 印刷解像度のための拡大率
  cv.width=Math.round(W*S); cv.height=Math.round(H*S);
  cv.style.height=(H*190/W)+'mm';
  const g=cv.getContext('2d'); g.setTransform(S,0,0,S,0,0);
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);

  const mn=range.mn, mx=range.mx;
  const days=Math.max(1, dB(mn,mx));
  const PW = W-LP-6;
  const X = d => LP + dB(mn,d)/days*PW;

  // ── ヘッダー（月目盛り） ──
  g.fillStyle='#eef2f7'; g.fillRect(0,0,W,HDR);
  const months=[]; let cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<mx){ months.push(new Date(cur)); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  const step=Math.max(1, Math.ceil(30/(PW/Math.max(1,months.length))));
  g.font='600 8px "Noto Sans JP",sans-serif';
  months.forEach((m,i)=>{
    const x=X(m); if(x<LP) return;
    g.strokeStyle='#c8d3e0'; g.lineWidth=.6;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
    if(i%step===0){
      g.fillStyle='#475569';
      g.fillText(`${String(m.getFullYear()).slice(2)}/${String(m.getMonth()+1).padStart(2,'0')}`, x+2, 11);
    }
  });
  g.strokeStyle='#94a3b8'; g.lineWidth=.8;
  g.beginPath(); g.moveTo(0,HDR); g.lineTo(W,HDR); g.stroke();
  g.beginPath(); g.moveTo(LP,0); g.lineTo(LP,H); g.stroke();
  g.strokeStyle='#e2e8f0'; g.lineWidth=.6;
  g.beginPath(); g.moveTo(LP,HDR+KEY); g.lineTo(W,HDR+KEY); g.stroke();

  // 非稼働日（密すぎるときは省く）
  if(PW/days >= 2.2){
    let d=new Date(mn);
    while(d<mx){
      const hol=isHoliday(d), wk=isWknd(d);
      if(hol||wk){ g.fillStyle = hol ? '#fbeaea' : '#f1f5f9'; g.fillRect(X(d),HDR,PW/days,H-HDR); }
      d=addD(d,1);
    }
  }

  const today=new Date(); today.setHours(0,0,0,0);
  if(today>=mn&&today<=mx){
    const x=X(today);
    g.strokeStyle='#dc2626'; g.lineWidth=.9;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
    g.fillStyle='#dc2626'; g.font='600 7px sans-serif'; g.fillText('本日',x+2,20);
  }

  const rr=(x,y,w,h,r,fill)=>{
    g.fillStyle=fill; g.beginPath();
    const rad=Math.min(r,h/2,Math.max(0,w/2));
    g.moveTo(x+rad,y); g.arcTo(x+w,y,x+w,y+h,rad); g.arcTo(x+w,y+h,x,y+h,rad);
    g.arcTo(x,y+h,x,y,rad); g.arcTo(x,y,x+w,y,rad); g.closePath(); g.fill();
  };

  // ── 部門ごとに1行 ──
  let y=HDR+KEY;
  phases.forEach(ph=>{
    // 下の表（8.5pt）と同じ見た目になる大きさ。
    // 幅718単位が190mmに縮むので 8.5pt(=3.00mm) は 3.00/(190/718) ≒ 11.3単位。
    g.fillStyle='#334155'; g.font='700 11.3px "Noto Sans JP",sans-serif';
    g.fillText(ph.label_ja.slice(0,6), 11, y+ROW/2+4);
    g.fillStyle=ph.colour; g.fillRect(3,y+ROW/2-5,4.5,10);

    const b = zone.bars ? zone.bars[ph.dept_code] : null;
    if(b&&b.start){
      const x1=X(b.start), w=Math.max(1.5,X(b.end)-x1);
      const lay=(zone.taskBars&&zone.taskBars[ph.dept_code])||null;
      if(lay&&lay.length){
        rr(x1,y+5,w,ROW-11,2,ph.colour+'40');
        lay.forEach((seg,si)=>{
          const sx=X(seg.start), sw=Math.max(1.5,X(seg.end)-sx);
          rr(sx,y+5,sw,ROW-11,1.5, si%2?ph.colour:ph.colour+'d0');
          if(seg.manual){ g.strokeStyle='#6d28d9'; g.lineWidth=.9; g.strokeRect(sx,y+5,sw,ROW-11); }
          if(sw>11){
            g.fillStyle='#fff'; g.font='600 6.5px "Noto Sans JP",sans-serif';
            const t=String(seg.task.sequence);
            g.fillText(t, sx+sw/2-g.measureText(t).width/2, y+ROW/2+2.5);
          }
        });
      } else {
        rr(x1,y+5,w,ROW-11,2,ph.colour);
        if(w>16){
          g.fillStyle='#fff'; g.font='600 6.5px "Noto Sans JP",sans-serif';
          const t=String(wdB(b.start,b.end,patternOf(ph.dept_code)));
          g.fillText(t, x1+w/2-g.measureText(t).width/2, y+ROW/2+2.5);
        }
      }
    }
    g.strokeStyle='#eef2f7'; g.lineWidth=.6;
    g.beginPath(); g.moveTo(0,y+ROW); g.lineTo(W,y+ROW); g.stroke();
    y+=ROW;
  });

  // ── 先行発注ブロック（工区の下にぶら下がる枝）──
  if(blocks.length){
    g.strokeStyle='#c8d3e0'; g.lineWidth=.6;
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
  }
  blocks.forEach((bk,bi)=>{
    // 枝の記号
    g.strokeStyle='#a78bfa'; g.lineWidth=.8;
    g.beginPath();
    g.moveTo(7.5, y); g.lineTo(7.5, y+ROW_B/2); g.lineTo(13, y+ROW_B/2);
    if(bi<blocks.length-1){ g.moveTo(7.5,y+ROW_B/2); g.lineTo(7.5,y+ROW_B); }
    g.stroke();
    g.fillStyle = bk.schedule_status==='risk' ? '#b91c1c' : '#7c3aed';
    g.font='700 9.6px "Noto Sans JP",sans-serif';
    g.fillText(('先行 '+(bk.name||'')).slice(0,8), 16, y+ROW_B/2+3.4);

    phases.forEach(ph=>{
      const b = bk.bars ? bk.bars[ph.dept_code] : null;
      if(!b||!b.start) return;
      const x1=X(b.start), w=Math.max(1.2,X(b.end)-x1);
      g.fillStyle=ph.colour+'c8';
      g.fillRect(x1, y+4, w, ROW_B-8);
      g.strokeStyle=ph.colour; g.lineWidth=.5;
      g.strokeRect(x1, y+4, w, ROW_B-8);
    });
    zoneOverlaps(bk, phases).forEach(ov=>{
      const ox=X(ov.start), ow=Math.max(1.2,X(ov.end)-ox);
      hatch(g, ox, y+4, ow, ROW_B-8, ov.a.colour+'e0', ov.b.colour+'e0');
      g.save(); g.strokeStyle=ov.compress?'#b91c1c':'#334155'; g.lineWidth=.7;
      g.setLineDash([2,1.5]); g.strokeRect(ox,y+4,ow,ROW_B-8); g.restore();
    });
    if(bk.delivery_date){
      const dx=X(par(bk.delivery_date));
      g.strokeStyle = bk.schedule_status==='risk' ? '#dc2626' : '#7c3aed';
      g.save(); g.setLineDash([1.5,1.5]); g.lineWidth=.7;
      g.beginPath(); g.moveTo(dx,y+2); g.lineTo(dx,y+ROW_B-2); g.stroke(); g.restore();
    }
    g.strokeStyle='#f1f5f9'; g.lineWidth=.5;
    g.beginPath(); g.moveTo(0,y+ROW_B); g.lineTo(W,y+ROW_B); g.stroke();
    y+=ROW_B;
  });

  // ── 部門重複（全行をまたぐ帯） ──
  const sel=phases;
  zoneOverlaps(zone, sel).forEach(ov=>{
    const ox=X(ov.start), ow=Math.max(1.5,X(ov.end)-ox);
    const ya=HDR+KEY+sel.indexOf(ov.a)*ROW, yb=HDR+KEY+sel.indexOf(ov.b)*ROW;
    [ya,yb].forEach(yy=>{
      hatch(g, ox, yy+5, ow, ROW-11, ov.a.colour+'e0', ov.b.colour+'e0');
      g.save(); g.strokeStyle=ov.compress?'#b91c1c':'#334155'; g.lineWidth=.9;
      g.setLineDash([2,1.5]); g.strokeRect(ox,yy+5,ow,ROW-11); g.restore();
    });
    // 二つの行をつなぐ縦の目印
    g.save(); g.strokeStyle=ov.compress?'#b91c1c':'#64748b'; g.lineWidth=.7; g.setLineDash([1.5,1.5]);
    g.beginPath(); g.moveTo(ox+ow/2, Math.min(ya,yb)+5); g.lineTo(ox+ow/2, Math.max(ya,yb)+ROW-6); g.stroke();
    g.restore();
    g.fillStyle=ov.compress?'#b91c1c':'#334155'; g.font='700 6.5px "Noto Sans JP",sans-serif';
    g.fillText(ov.days+'日', ox+ow/2+2, Math.min(ya,yb)+ROW-1);
  });

  // ── キー日程・納期 ──
  KEY_DATES.forEach(kd=>{
    const raw = kd.field==='delivery_date' ? zone.delivery_date : zone[kd.field];
    if(!raw) return;
    const kx=X(par(raw));
    g.fillStyle=kd.colour;
    g.beginPath(); g.moveTo(kx,HDR+1.5); g.lineTo(kx+3.2,HDR+5.5); g.lineTo(kx,HDR+9.5); g.lineTo(kx-3.2,HDR+5.5);
    g.closePath(); g.fill();
    g.save(); g.strokeStyle=kd.colour; g.lineWidth=.5; g.setLineDash([1.5,1.5]);
    g.beginPath(); g.moveTo(kx,HDR); g.lineTo(kx,H); g.stroke(); g.restore();
  });

  g.strokeStyle='#c8d3e0'; g.lineWidth=.8; g.strokeRect(.4,.4,W-.8,H-.8);
}

function nextCode(){
  const yr = String(new Date().getFullYear()).slice(2);
  let max = 0;
  PROJECTS.forEach(p=>{
    const m = (p.project_code||'').match(new RegExp('^P-'+yr+'(\\\\d+)$'));
    if(m) max = Math.max(max, parseInt(m[1]));
  });
  return 'P-'+yr+String(max+1).padStart(2,'0');
}

async function saveNewProject(){
  const code = $('npCode').value.trim(), name = $('npName').value.trim();
  if(!code||!name){ toast('コードと名称を入力してください','err'); return; }
  try{
    sync('作成中…');
    const scope = {}; PHASES.forEach(p=>scope[p.dept_code]=true);
    const { data:pr, error } = await sb.from('projects').insert({
      project_code:code, name, client_name:$('npClient').value.trim()||null,
      site_address:$('npAddr').value.trim()||null, lead_factory:$('npFac').value||null,
      notes:$('npNote').value.trim(),
      design_scope:scope, created_by:ME.id
    }).select().single();
    if(error) throw error;

    const { data:sub } = await sb.from('sub_projects')
      .insert({ project_id:pr.id, name:'本体', sort_order:0 }).select().single();
    const today = fmt(new Date());
    const { data:zone } = await sb.from('work_zones').insert({
      sub_project_id:sub.id, project_id:pr.id, name:'A工区', sort_order:0,
      start_date:today, delivery_date:fmt(addD(new Date(),180))
    }).select().single();
    await sb.from('zone_phase_durations').insert(
      PHASES.map(ph=>({ work_zone_id:zone.id, dept_code:ph.dept_code, duration_days:ph.default_days??50 })));

    await logAudit('project.create','projects',pr.id,pr.id,null,{code,name});
    closeModal(); await loadProjects();
    SEL={proj:pr.id,sub:null,zone:null}; go('proj');
    toast('プロジェクトを作成しました','ok'); sync('同期済');
  }catch(e){ toast('作成エラー: '+e.message,'err'); sync('エラー'); }
}

async function delProject(){
  const p=curProj(); if(!p) return;

function onPhaseDur(code, val){

  z.dur[code] = { ...(z.dur[code]||{}), duration_days: parseInt(val)||0 };
  recalcAll(); refreshProj();

function taskSlot(z, dc, tc){
  z.tasks = z.tasks || {};
  z.tasks[dc] = z.tasks[dc] || {};
  z.tasks[dc][tc] = z.tasks[dc][tc] || {};
  return z.tasks[dc][tc];
}

function onTaskField(dc, tc, field, val){
  const z=curZone(); if(!z) return;
  const r = taskSlot(z, dc, tc);
  if(field==='duration_days')      r.duration_days = parseInt(val)||0;
  else if(field==='completed')     { r.completed = val; if(val && !r.completed_date) r.completed_date = fmt(new Date()); }
  else                             r[field] = val || null;
  recalcAll(); refreshProj();
}

// 「手動」ON にした時は、現在の自動計算値を初期値として入れる
function onTaskManual(dc, tc, on){
  const z=curZone(); if(!z) return;
  const r = taskSlot(z, dc, tc);
  r.is_manual = on;
  if(on && (!r.start_date || !r.end_date)){
    const lay = z.taskBars && z.taskBars[dc];
    const b = lay && lay.find(x=>x.task.task_code===tc);
    if(b){ r.start_date = fmt(b.start); r.end_date = fmt(b.end); }
  }
  recalcAll(); refreshProj();
}
function onActual(code, field, val){
  const z=curZone(); if(!z) return;
  const a = z.actuals[code] = z.actuals[code] || {};
  if(field==='completed') a.completed = val;
  else a.completed_date = val || null;
}

async function saveZone(){
  const p=curProj(), z=curZone(); if(!z) return;
  try{
    sync('保存中…');
    await sb.from('work_zones').update({
      start_date:z.start_date, delivery_date:z.delivery_date,
      key_approval:z.key_approval||null, key_order:z.key_order||null,
      key_fabrication:z.key_fabrication||null,
      needed_days:z.needed_days, available_days:z.available_days,
      schedule_status:z.schedule_status,
      overlap_before:z.overlap?z.overlap.before:0,
      overlap_after: z.overlap?z.overlap.after :0,
      computed_start:z.computed_start?fmt(z.computed_start):null,
      computed_end:z.computed_end?fmt(z.computed_end):null
    }).eq('id', z.id);

    const phases = phasesFor(p);
    for(const ph of phases){
      const b = z.bars ? z.bars[ph.dept_code] : null;
      await sb.from('zone_phase_durations').upsert({
        work_zone_id:z.id, dept_code:ph.dept_code,
        duration_days: durOf(z, ph.dept_code),
        computed_start:b&&b.start?fmt(b.start):null,
        computed_end:  b&&b.end  ?fmt(b.end)  :null
      }, { onConflict:'work_zone_id,dept_code' });

      const a = z.actuals[ph.dept_code];
      if(a && (a.completed || a.completed_date)){
        await sb.from('zone_phase_actuals').upsert({
          work_zone_id:z.id, dept_code:ph.dept_code,
          completed:!!a.completed, completed_date:a.completed_date||null,
          updated_by: ME.id
        }, { onConflict:'work_zone_id,dept_code' });
      }

      // サブ工程
      const subs = tasksFor(ph.dept_code);
      if(subs.length){
        const lay = z.taskBars && z.taskBars[ph.dept_code];
        const rows = subs.map(t=>{
          const r = taskRec(z, ph.dept_code, t.task_code);
          const b = lay && lay.find(x=>x.task.task_code===t.task_code);
          return {
            work_zone_id:z.id, dept_code:ph.dept_code, task_code:t.task_code,
            duration_days: taskDur(z, ph.dept_code, t),
            is_manual: !!r.is_manual,
            start_date: r.is_manual ? (r.start_date||null) : null,
            end_date:   r.is_manual ? (r.end_date||null)   : null,
            computed_start: b?fmt(b.start):null,
            computed_end:   b?fmt(b.end)  :null,
            completed: !!r.completed,
            completed_date: r.completed_date || null,
            updated_by: ME.id
          };
        });
        const { error:et } = await sb.from('zone_task_schedule')
          .upsert(rows, { onConflict:'work_zone_id,dept_code,task_code' });
        if(et) throw et;
      }
    }
    await persistDerived(p);
    await logAudit('schedule.save','work_zones',z.id,p.id,null,{zone:z.name});
    toast('スケジュールを保存しました','ok'); sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

// ═══════════════════════════════════════════════════════════════
//  GANTT  — three levels: project ▸ 項目 ▸ 工区
// ═══════════════════════════════════════════════════════════════
// ガント表示フィルタ
let GF = { depts:{}, riskOnly:false, project:'', sort:'code', zoom:'w' };

// スクロール位置の保持（ズームを変えたときだけ今日へ寄せる）
let GSCROLL = { left:null, top:null, zoom:null };

// 折りたたみ状態。true = 閉じている。既定はすべて開いた状態。
// プロジェクト管理のツリーは「選択中のものだけが開く」方式だが、
// ガントでは複数を同時に閉じたいので、節ごとに独立して持つ。
let GCOL = { p:{}, s:{}, z:{} };

// 行の当たり判定（左パネルのクリックで折りたたむために drawGantt が記録する）
let GHIT = [];

function ganttToggle(kind, id){
  GCOL[kind][id] = !GCOL[kind][id];
  drawGantt();
}

// すべて展開 / すべて折りたたむ
function ganttCollapseAll(on){
  GCOL = { p:{}, s:{}, z:{} };
  if(on) PROJECTS.forEach(p=>{
    GCOL.p[p.id]=true;
    (p.subs||[]).forEach(s=>{
      GCOL.s[s.id]=true;
      (s.zones||[]).forEach(z=>{ GCOL.z[z.id]=true; });
    });
  });
  drawGantt();
}

// ── ズーム段階 ──
// px = 1日あたりの横幅。fit は従来どおり全体を 1000px 前後に収める。
const ZOOMS = [
  { key:'fit', label:'全体',   px:null, tier:'month' },
  { key:'q',   label:'四半期', px:1.8,  tier:'month' },
  { key:'m',   label:'月',     px:4,    tier:'month' },
  { key:'w',   label:'週',     px:10,   tier:'week'  },
  { key:'d',   label:'日',     px:24,   tier:'day'   },
];
const zoomOf = () => ZOOMS.find(z=>z.key===GF.zoom) || ZOOMS[0];

function ganttDepts(){
  const on = PHASES.filter(p=>GF.depts[p.dept_code]);
  return on.length ? on : PHASES;   // 何も選ばれていなければ全部
}

// ═══════════════════════════════════════════════════════════════
//  並び替え
//  納期はプロジェクト／項目には存在しない。工区の納期を最早値で上へ集約する。
//  ＝ 次に迫っている搬入が早いものほど上に来る。
// ═══════════════════════════════════════════════════════════════
const INF_T = 8640000000000000;
function zoneDelivKey(z){ return z && z.delivery_date ? par(z.delivery_date).getTime() : INF_T; }
function subDelivKey(s){  return (s.zones||[]).reduce((a,z)=>Math.min(a, zoneDelivKey(z)), INF_T); }
function projDelivKey(p){ return (p.subs ||[]).reduce((a,s)=>Math.min(a, subDelivKey(s)),  INF_T); }

const cmpCode  = (a,b)=>String(a.project_code||'').localeCompare(String(b.project_code||''),'ja',{numeric:true,sensitivity:'base'});
const cmpName  = (a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja',{numeric:true,sensitivity:'base'});
const cmpOrder = (a,b)=>((a.sort_order??0)-(b.sort_order??0)) || cmpName(a,b);

// slice() してから並べ替える。PROJECTS 自体の順序は壊さない。
function sortProjects(list){
  const l = (list||[]).slice();
  return GF.sort==='deliv'
    ? l.sort((a,b)=> (projDelivKey(a)-projDelivKey(b)) || cmpCode(a,b))
    : l.sort(cmpCode);
}
function sortSubs(list){
  const l = (list||[]).slice();
  return GF.sort==='deliv'
    ? l.sort((a,b)=> (subDelivKey(a)-subDelivKey(b)) || cmpOrder(a,b))
    : l.sort(cmpOrder);
}
function sortZones(list){
  const l = (list||[]).slice();
  return GF.sort==='deliv'
    ? l.sort((a,b)=> (zoneDelivKey(a)-zoneDelivKey(b)) || cmpOrder(a,b))
    : l.sort(cmpOrder);
}

function ganttProjects(){
  let list = PROJECTS;
  if(GF.project)  list = list.filter(p=>p.id===GF.project);
  if(GF.riskOnly) list = list.filter(p=>p.schedule_status==='risk');
  return sortProjects(list);
}

// 描画行 — プロジェクト ▸ 項目 ▸ 工区。
// 三階層すべてに並び替えを適用し、折りたたまれた節の子は行に出さない。
// 閉じても親のロールアップバーは残るので、全体の期間は見えたままになる。
function ganttRows(){
  const rows = [];
  ganttProjects().forEach(p=>{
    const subs = sortSubs(p.subs);
    const pc = !!GCOL.p[p.id];
    const nz = subs.reduce((a,s)=>a+(s.zones||[]).length,0);
    rows.push({ t:'p', o:p, kids:subs.length, zones:nz, collapsed:pc });
    if(pc) return;
    subs.forEach(s=>{
      const zones = sortZones(s.zones);
      const sc = !!GCOL.s[s.id];
      rows.push({ t:'s', o:s, p, kids:zones.length, collapsed:sc });
      if(sc) return;
      zones.forEach(z=>{
        const zc = !!GCOL.z[z.id];
        rows.push({ t:'z', o:z, s, p, collapsed:zc, blocks:(z.blocks||[]).length });
        // 工区を開いているときだけ、先行発注ブロックを枝として出す
        if(!zc) (z.blocks||[]).forEach((bk,i,arr)=>
          rows.push({ t:'b', o:bk, z, s, p, last:i===arr.length-1 }));
      });
    });
  });
  return rows;
}

// 表示中の工区の総数（折りたたみに関係なく数える）
function ganttZoneCount(){
  return ganttProjects().reduce((a,p)=>a+(p.subs||[]).reduce((b,s)=>b+(s.zones||[]).length,0),0);
}

// ═══════════════════════════════════════════════════════════════
//  部門重複の検出
//
//  ★ スケジュールエンジンは変更しない。calcZone が確定させた bars 同士を
//    突き合わせて、重なっている区間を報告するだけ。
//
//  重複が生じる経路は二つある:
//    ① 調達の圧縮（部分承認）— 工期不足のとき設計・製作へ食い込む
//    ② サブ工程の日付指定   — 工程が実際に伸び、隣の工程に掛かる
// ═══════════════════════════════════════════════════════════════
function zoneOverlaps(zone, phases){
  const out = [];
  const list = (phases||[]).filter(ph => zone.bars && zone.bars[ph.dept_code] && zone.bars[ph.dept_code].start);
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const A = list[i], B = list[j];
      const a = zone.bars[A.dept_code], b = zone.bars[B.dept_code];
      const s = a.start > b.start ? a.start : b.start;   // 遅いほうの開始
      const e = a.end   < b.end   ? a.end   : b.end;     // 早いほうの終了
      const days = wdB(s, e, BASE_PATTERN);
      if(days > 0){
        // 調達の圧縮に由来するものは「部分承認」として区別する
        const compress = (A.anchor==='fill' || B.anchor==='fill')
                      && zone.schedule_status==='risk'
                      && !!(zone.overlap && (zone.overlap.before || zone.overlap.after));
        out.push({ a:A, b:B, start:s, end:e, days, compress });
      }
    }
  }
  return out.sort((x,y)=> x.start - y.start);
}

// 画面全体の重複一覧（表示中の部門・プロジェクトに限る）
// ★ 折りたたみ状態には影響されない。閉じた行の重複が一覧から消えると
//   問題を見落とすため、行の描画とは独立に全工区を走査する。
function allOverlaps(){
  const sel = ganttDepts().map(d=>d.dept_code);
  const out = [];
  ganttProjects().forEach(p=>{
    const phases = phasesFor(p).filter(ph=>sel.includes(ph.dept_code));
    sortSubs(p.subs).forEach(s=>{
      sortZones(s.zones).forEach(z=>{
        zoneOverlaps(z, phases).forEach(ov=> out.push(Object.assign({}, ov, { z, s, p })));
        (z.blocks||[]).forEach(bk=>{
          zoneOverlaps(bk, phases).forEach(ov=>
            out.push(Object.assign({}, ov, { z, s, p, block:bk })));
        });
      });
    });
  });
  return out;
}

// 斜線ハッチ — 重なっている二部門の色を交互に引く
function hatch(g,x,y,w,h,c1,c2){
  if(w<=0||h<=0) return;
  g.save();
  g.beginPath(); g.rect(x,y,w,h); g.clip();
  const step = 7;
  g.lineWidth = step*0.8;
  for(let i=-h; i<w+h; i+=step){
    g.strokeStyle = (Math.abs(Math.round(i/step))%2) ? c2 : c1;
    g.beginPath(); g.moveTo(x+i, y+h); g.lineTo(x+i+h, y); g.stroke();
  }
  g.restore();
}

// 部門別 月次負荷 — 選択中の部門について、各月に稼働している工区数と日数
function deptWorkload(){
  const depts = ganttDepts();
  const rows = [];
  const months = {};
  ganttProjects().forEach(p=>p.subs.forEach(s=>s.zones.forEach(z=>{
    depts.forEach(ph=>{
      const b = z.bars && z.bars[ph.dept_code];
      if(!b || !b.start) return;
      let d = new Date(b.start.getFullYear(), b.start.getMonth(), 1);
      while(d <= b.end){
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        const mStart = new Date(d.getFullYear(), d.getMonth(), 1);
        const mEnd   = new Date(d.getFullYear(), d.getMonth()+1, 0);
        const ovS = b.start > mStart ? b.start : mStart;
        const ovE = b.end   < mEnd   ? b.end   : mEnd;
        const days = Math.max(0, wdB(ovS, ovE, patternOf(ph.dept_code)));
        if(days > 0){
          const m = months[key] = months[key] || { key, byDept:{}, zones:new Set(), days:0 };
          m.byDept[ph.dept_code] = (m.byDept[ph.dept_code]||0) + days;
          m.zones.add(z.id);
          m.days += days;
        }
        d = new Date(d.getFullYear(), d.getMonth()+1, 1);
      }
    });
  })));
  Object.values(months).forEach(m=>rows.push(m));
  rows.sort((a,b)=>a.key.localeCompare(b.key));
  return rows;
}
