<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辻鉄統合システム — TTSK System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --bg:#f6f8fb; --card:#ffffff; --bg2:#eef2f7;
  --border:#dde4ec; --border2:#c8d3e0;
  --text:#12233a; --muted:#64748b; --faint:#94a3b8;
  --accent:#1e5fa8; --accent2:#164a85; --accent-l:#e8f1fb;
  --ok:#15803d; --ok-l:#e8f5ec;
  --warn:#b45309; --warn-l:#fdf3e3;
  --danger:#b91c1c; --danger-l:#fceaea;
  --purple:#6d28d9; --purple-l:#f1ebfd;
  --radius:8px; --radius-s:5px;
  --sans:'Noto Sans JP','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* ── AUTH ── */
#authScreen{position:fixed;inset:0;background:linear-gradient(140deg,#12233a,#1e5fa8);z-index:9999;display:flex;align-items:center;justify-content:center}
#authScreen.hidden{display:none}
.auth-box{background:#fff;border-radius:14px;padding:38px 34px;width:410px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.02em}
.auth-logo p{font-size:12px;color:var(--muted);margin-top:5px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
.auth-tab{flex:1;padding:9px;background:var(--bg2);color:var(--muted);border:none;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.auth-tab.on{background:var(--accent);color:#fff}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border2);border-radius:var(--radius-s);padding:9px 11px;background:#fff;color:var(--text);outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,168,.12)}
.btn-full{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-weight:700;cursor:pointer;margin-top:6px;transition:.15s}
.btn-full:hover{background:var(--accent2)}
.btn-full:disabled{opacity:.5;cursor:not-allowed}
.auth-msg{margin-top:13px;padding:9px 12px;border-radius:var(--radius-s);font-size:12.5px;display:none;line-height:1.5}
.auth-msg.err{display:block;background:var(--danger-l);color:var(--danger)}
.auth-msg.ok{display:block;background:var(--ok-l);color:var(--ok)}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:222px;min-width:222px;background:#12233a;color:#cbd6e4;display:flex;flex-direction:column}
.sb-logo{padding:17px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-logo h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em}
.sb-logo p{font-size:10.5px;color:#7e94ad;margin-top:2px;font-family:var(--mono)}
.sb-nav{flex:1;padding:9px 8px;overflow-y:auto}
.sb-sec{font-size:9.5px;color:#5f7690;text-transform:uppercase;letter-spacing:.09em;padding:11px 9px 5px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;background:none;border:none;color:#cbd6e4;cursor:pointer;border-radius:var(--radius-s);font-size:13px;text-align:left;transition:.12s;margin-bottom:1px}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.on{background:var(--accent);color:#fff;font-weight:600}
.sb-ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.sb-foot{padding:11px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:9px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.sb-user{flex:1;min-width:0}
.sb-user b{display:block;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user span{font-size:10.5px;color:#7e94ad}
.icon-btn{background:none;border:none;color:#7e94ad;cursor:pointer;padding:5px;border-radius:4px;font-size:14px}
.icon-btn:hover{background:rgba(255,255,255,.09);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:53px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.topbar h2{font-size:16px;font-weight:700;flex:1}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.page{display:none}
.page.on{display:block}

/* ── COMPONENTS ── */
.btn{border:1px solid var(--border2);background:#fff;color:var(--text);padding:7px 14px;border-radius:var(--radius-s);cursor:pointer;font-size:12.5px;font-weight:600;transition:.13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--muted)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-d{background:#fff;border-color:#e5b4b4;color:var(--danger)}
.btn-d:hover{background:var(--danger-l)}
.btn-s{padding:4px 9px;font-size:11.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:13.5px;font-weight:700;flex:1}
.card-b{padding:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill-ok{background:var(--ok-l);color:var(--ok)}
.pill-warn{background:var(--warn-l);color:var(--warn)}
.pill-risk{background:var(--danger-l);color:var(--danger)}
.pill-info{background:var(--accent-l);color:var(--accent)}
.pill-purple{background:var(--purple-l);color:var(--purple)}
.pill-grey{background:var(--bg2);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 11px;background:var(--bg2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty .big{font-size:34px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.stat .val{font-size:25px;font-weight:700;margin-top:3px;font-family:var(--mono)}
.stat .sub{font-size:11px;color:var(--faint);margin-top:1px}

/* ── MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:11px;width:600px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-h h3{font-size:15px;font-weight:700;flex:1}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg2);border-radius:0 0 11px 11px}
.x{background:none;border:none;font-size:21px;color:var(--faint);cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:var(--text)}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;padding:12px 17px;border-radius:var(--radius);font-size:13px;z-index:9999;opacity:0;transform:translateY(50px);transition:.25s;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateY(0)}
#toast.err{background:var(--danger)}
#toast.ok{background:var(--ok)}

/* ── PROJECT TREE ── */
.tree-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.tree-wrap{grid-template-columns:1fr}}
.tree{padding:8px}
.tnode{padding:7px 9px;border-radius:var(--radius-s);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;transition:.12s}
.tnode:hover{background:var(--bg2)}
.tnode.on{background:var(--accent-l);color:var(--accent);font-weight:600}
.tnode.lvl1{padding-left:22px;font-size:12.5px}
.tnode.lvl2{padding-left:38px;font-size:12.5px}
.tchev{width:13px;font-size:9px;color:var(--faint);flex-shrink:0}
.tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tzone{color:var(--purple)}

/* ── PHASE EDITOR ── */
.ph-row{display:grid;grid-template-columns:1fr 88px 110px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ph-row:last-child{border-bottom:none}
.ph-name{display:flex;align-items:center;gap:8px;font-size:12.5px}
.ph-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.ph-in{width:100%;border:1px solid var(--border2);border-radius:4px;padding:5px 8px;text-align:right;font-family:var(--mono);font-size:12px}
.ph-dates{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.chk input{width:14px;height:14px;cursor:pointer;accent-color:var(--ok)}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
canvas{display:block}

/* ── DELIVERY ── */
.truck-card{border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;margin-bottom:9px;background:var(--bg2)}
.truck-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.truck-h b{font-size:12.5px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:760px){.tgrid{grid-template-columns:1fr}}
.tf label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.tf input,.tf select{width:100%;border:1px solid var(--border2);border-radius:4px;padding:6px 8px;font-size:12.5px}

/* ── FLOW BOARD ── */
.board-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.board-row:last-child{border-bottom:none}
.board-proj b{font-size:12.5px;display:block}
.board-proj span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.phbar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.phcell{height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;position:relative}
.ph-done{background:#15803d}
.ph-cur{background:var(--accent);box-shadow:0 0 0 2px rgba(30,95,168,.28)}
.ph-none{background:var(--bg2);color:var(--faint)}
.ph-late{background:var(--danger)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.sec-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:16px 0 8px}
.tk-hdr,.tk-row{display:grid;grid-template-columns:1fr 74px 138px 138px 46px 128px;gap:8px;align-items:center}
.tk-hdr{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border2)}
.tk-phase{border-bottom:1px solid var(--border)}
.tk-phase:last-child{border-bottom:none}
.tk-row{padding:7px 8px}
.tk-main{background:var(--bg2)}
.tk-sub{padding-left:26px;font-size:12.5px}
.tk-sub.is-man{background:#faf6ff}
.tk-name{display:flex;align-items:center;gap:8px;min-width:0}
.tk-idx{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--bg2);border:1px solid var(--border2);font-size:10px;color:var(--muted);flex-shrink:0}
.tk-in{width:100%;border:1px solid var(--border2);border-radius:4px;padding:4px 7px;text-align:right;font-family:var(--mono);font-size:12px}
.tk-in:disabled{background:var(--bg2);color:var(--faint)}
.tk-dt{width:100%;border:1px solid var(--border2);border-radius:4px;padding:4px 6px;font-size:11.5px}
.tk-dt:disabled{background:var(--bg2);color:var(--faint);border-style:dashed}
.tk-date{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media(max-width:900px){.tk-hdr,.tk-row{grid-template-columns:1fr 60px 110px 110px 38px 92px;gap:5px}}
.proc{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);background:#fff;cursor:pointer;user-select:none;white-space:nowrap;font-size:11px}
.proc:hover{border-color:var(--accent)}
.proc.on{background:var(--ok-l);border-color:var(--ok);color:var(--ok);font-weight:600}
.proc input{width:11px;height:11px;pointer-events:none;accent-color:var(--ok)}
.prog2{display:flex;align-items:center;gap:6px;min-width:78px}
.prog2-bar{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.prog2-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .25s}
.dz{border:2px dashed var(--border2);border-radius:8px;padding:26px;text-align:center;cursor:pointer;transition:.15s;color:var(--muted)}
.dz:hover{border-color:var(--accent);background:var(--accent-l)}
.inline-note{background:var(--accent-l);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;font-size:12.5px;color:var(--text);margin-bottom:14px}
</style>
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>辻鉄統合システム</h1>
      <p>TTSK System Application　v1.0</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tabIn"  onclick="setAuthMode('in')">ログイン</button>
      <button class="auth-tab"    id="tabUp"  onclick="setAuthMode('up')">新規登録</button>
    </div>
    <div class="fld" id="nameFld" style="display:none">
      <label>氏名</label><input id="auName" placeholder="辻鉄 太郎">
    </div>
    <div class="fld"><label>メールアドレス</label><input id="auEmail" type="email" placeholder="you@example.com"></div>
    <div class="fld"><label>パスワード</label><input id="auPass" type="password" placeholder="••••••••"></div>
    <button class="btn-full" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="auth-msg" id="auMsg"></div>
  </div>
</div>

<!-- ══ SHELL ══ -->
<div class="shell" id="shell" style="display:none">
  <aside class="sidebar">
    <div class="sb-logo">
      <h1>辻鉄統合システム</h1>
      <p>TTSK SYSTEM v1.0 · b8730a5</p>
    </div>
    <nav class="sb-nav">
      <div class="sb-sec">概要</div>
      <button class="sb-item on" data-pg="dash"  onclick="go('dash')"><span class="sb-ico">📊</span>ダッシュボード</button>
      <button class="sb-item"    data-pg="board" onclick="go('board')"><span class="sb-ico">🗂</span>業務フローボード</button>
      <div class="sb-sec">工程管理</div>
      <button class="sb-item" data-pg="proj"  onclick="go('proj')"><span class="sb-ico">📋</span>プロジェクト管理</button>
      <button class="sb-item" data-pg="gantt" onclick="go('gantt')"><span class="sb-ico">📅</span>ガントチャート</button>
      <div class="sb-sec">製作</div>
      <button class="sb-item" data-pg="fab" onclick="go('fab')"><span class="sb-ico">🏭</span>製作管理 (FMS)</button>
      <div class="sb-sec">出荷・納品</div>
      <button class="sb-item" data-pg="deliv" onclick="go('deliv')"><span class="sb-ico">🚚</span>出荷管理</button>
      <div class="sb-sec">設定</div>
      <button class="sb-item" data-pg="settings" onclick="go('settings')"><span class="sb-ico">⚙️</span>設定</button>
    </nav>
    <div class="sb-foot">
      <div class="avatar" id="sbAv">U</div>
      <div class="sb-user"><b id="sbName">—</b><span id="sbRole">メンバー</span></div>
      <button class="icon-btn" onclick="signOut()" title="ログアウト">⏻</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="pgTitle">ダッシュボード</h2>
      <span class="mono muted" id="syncLbl" style="font-size:11px"></span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modalHost"></div>
<script>
'use strict';
const BUILD = 'b8730a5';
console.log('TTSK build', BUILD);

// ═══════════════════════════════════════════════════════════════
//  CONFIG  ── replace these two values with your Supabase project
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://ezhdqhebaobkpdouhwjr.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aGRxaGViYW9ia3Bkb3Vod2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwMjk0MzIsImV4cCI6MjA4MTYwNTQzMn0.ERuR6c8uvJ0m9zr8IgcUAKjzs0C4z3s-zdtvyoZGn0o';


const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let ME       = null;   // profile row
let PROJECTS = [];      // [{...project, subs:[{...sub, zones:[{...zone, phases:{}, actuals:{}}]}]}]
let PHASES   = [];      // schedule_phases (company default: 設計部→調達部→工場→工事部)
let DELIVS   = [];      // deliveries with trucks + items
let BOM_REVS   = {};    // zoneId → [revision {…, parts:[]}]
let PUR_BATCHES= {};    // zoneId → [batch]
let PUR_ITEMS  = {};    // zoneId → [item]
let PROGRESS   = {};    // zoneId → { 'assm||part': { step: bool } }
let PROC_STEPS = [];    // process_steps master
let PHASE_TASKS= [];    // phase_tasks master (サブ工程)
let PAGE     = 'dash';
let SEL      = { proj:null, sub:null, zone:null };
let authMode = 'in';

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
const $  = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt  = d => d ? new Date(d).toISOString().slice(0,10) : '';
const par  = s => s ? new Date(s+'T00:00:00') : null;
const addD = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const dB   = (a,b) => Math.round((b-a)/864e5);
const fmtS = d => d ? (d.getMonth()+1)+'/'+d.getDate() : '';
const isWknd = d => { const x=d.getDay(); return x===0||x===6; };

function toast(msg, kind){
  const t=$('toast'); t.textContent=msg; t.className='on '+(kind||'');

// ═══════════════════════════════════════════════════════════════
//  SCHEDULE ENGINE   ── 部門ベース（設計部→調達部→工場→工事部）
//
//  anchor の意味:
//    start          … 開始日から順方向
//    delivery_back  … 納期から逆算（納期に終わる）
//    delivery_fwd   … 納期から順方向（納入後の作業）
//    fill           … 前工程終了から。工期不足時は前後に重ねる（部分承認）
//
//  工期判定 need は counts_toward_need = true の工程のみ合計する。
//  工事部は現場搬入後の作業のため判定に含めない。
// ═══════════════════════════════════════════════════════════════
function phasesFor(proj){
  const scope = proj.design_scope || {};
  const any = PHASES.some(p => scope[p.dept_code]);
  const list = any ? PHASES.filter(p => scope[p.dept_code]) : PHASES;
  return list.slice().sort((a,b)=>a.sequence-b.sequence);
}

function durOf(zone, code){
  const d = zone.dur && zone.dur[code];
  return (d && d.duration_days != null) ? d.duration_days : 50;
}

// ── サブ工程 ──
function tasksFor(deptCode){
  return PHASE_TASKS.filter(t=>t.dept_code===deptCode).sort((a,b)=>a.sequence-b.sequence);
}
function taskRec(zone, deptCode, taskCode){
  return (zone.tasks && zone.tasks[deptCode] && zone.tasks[deptCode][taskCode]) || {};
}
function taskDur(zone, deptCode, t){
  const r = taskRec(zone, deptCode, t.task_code);
  return r.duration_days ?? t.default_days ?? 10;
}

// 開始日からサブ工程を並べる。
// 手動日付が入っている工程はそれを優先し、後続はその終了日から続く。
function layoutTasks(zone, deptCode, phaseStart){
  const list = tasksFor(deptCode);
  if(!list.length) return null;
  let cursor = new Date(phaseStart);
  const out = [];
  for(const t of list){
    const r = taskRec(zone, deptCode, t.task_code);
    let s, e, manual = false;
    if(r.is_manual && r.start_date && r.end_date){
      s = par(r.start_date); e = par(r.end_date); manual = true;
    } else {
      s = new Date(cursor); e = addD(s, taskDur(zone, deptCode, t));
    }
    out.push({ task:t, start:s, end:e, manual, done:!!r.completed });
    if(e > cursor) cursor = new Date(e);
  }
  return out;
}

// 工程の実効日数 = サブ工程の日数の合計。
// 日付指定のサブ工程は、その期間（終了日−開始日）を自分の日数として持ち込む。
// 絶対位置は工期日数に影響させない（位置は layoutTasks が扱う）。
function effDur(zone, deptCode){
  const list = tasksFor(deptCode);
  if(!list.length) return durOf(zone, deptCode);
  return list.reduce((a,t)=>{
    const r = taskRec(zone, deptCode, t.task_code);
    if(r.is_manual && r.start_date && r.end_date){
      return a + Math.max(0, dB(par(r.start_date), par(r.end_date)));
    }
    return a + taskDur(zone, deptCode, t);
  }, 0);
}

// 工区 = the only schedulable unit
function calcZone(zone, phases){
  zone.bars = {};
  zone.overlap = { before:0, after:0 };
  const st = par(zone.start_date), dl = par(zone.delivery_date);

  if(!st || !dl){
    zone.schedule_status='ok'; zone.needed_days=0; zone.available_days=0;
    zone.computed_start=null; zone.computed_end=null;
    return;
  }

  const D = {}; phases.forEach(p=>{ D[p.dept_code] = effDur(zone, p.dept_code); });
  const need  = phases.filter(p=>p.counts_toward_need).reduce((a,p)=>a+D[p.dept_code],0);
  const avail = dB(st, dl);
  zone.needed_days = need;
  zone.available_days = avail;
  zone.schedule_status = need <= avail ? 'ok' : 'risk';

  const fwd  = phases.find(p=>p.anchor==='start');
  const back = phases.find(p=>p.anchor==='delivery_back');
  const post = phases.find(p=>p.anchor==='delivery_fwd');
  const fill = phases.find(p=>p.anchor==='fill');

  let fwdEnd = st, backStart = dl;

  zone.taskBars = {};

  // 工程を配置し、その都度サブ工程を並べて実際の幅を確定する。
  // 手動日付で工程が伸びた場合、後続工程はその実際の終了日から始まる。
  const place = (ph, start, end) => {
    let b = { start, end };
    const lay = layoutTasks(zone, ph.dept_code, start);
    if(lay && lay.length){
      zone.taskBars[ph.dept_code] = lay;
      let tmn=null, tmx=null;
      lay.forEach(x=>{ if(!tmn||x.start<tmn)tmn=x.start; if(!tmx||x.end>tmx)tmx=x.end; });
      b = { start:tmn, end:tmx };
    }
    zone.bars[ph.dept_code] = b;
    return b;
  };

  // ① 順方向（設計）— 開始日から。サブ工程確定後の終了日を採用
  if(fwd) fwdEnd = place(fwd, st, addD(st, D[fwd.dept_code])).end;

  // ② 逆算（製作）— 納期から遡る
  if(back) backStart = place(back, addD(dl, -D[back.dept_code]), dl).start;

  // ③ 納入後（工事）
  if(post) place(post, dl, addD(dl, D[post.dept_code]));

  // ④ 中間（調達）— ①②が確定した後に配置する
  if(fill){
    const d = D[fill.dept_code];
    if(zone.schedule_status==='ok' && dB(fwdEnd, backStart) >= d){
      // 順送り。製作開始まで余裕があれば空きが生じる
      place(fill, fwdEnd, addD(fwdEnd, d));
    } else {
      // 工期不足 → 前後に重ねて圧縮（部分承認での先行手配）
      const space  = dB(fwdEnd, backStart);
      const excess = d - space;
      const ol1 = Math.max(0, Math.ceil(excess/2));
      const ol2 = Math.max(0, Math.floor(excess/2));
      const s2  = addD(fwdEnd, -ol1);
      place(fill, s2, addD(s2, d));
      zone.overlap = { before:ol1, after:ol2 };
    }
  }

  let mn=null, mx=null;
  Object.values(zone.bars).forEach(b=>{
    if(!mn||b.start<mn) mn=b.start;
    if(!mx||b.end  >mx) mx=b.end;
  });
  zone.computed_start = mn;
  zone.computed_end   = mx;
}

// 項目 = rollup of its 工区
function calcSub(sub, phases){
  let mn=null, mx=null, risk=false;
  for(const z of sub.zones){
    calcZone(z, phases);
    if(z.computed_start && (!mn||z.computed_start<mn)) mn=z.computed_start;
    if(z.computed_end   && (!mx||z.computed_end  >mx)) mx=z.computed_end;
    if(z.schedule_status==='risk') risk=true;
  }
  sub.computed_start=mn; sub.computed_end=mx;
  sub.schedule_status = risk?'risk':'ok';
}

// project = rollup of its 項目
function calcProject(proj){
  const phases = phasesFor(proj);
  let mn=null, mx=null, risk=false;
  for(const s of proj.subs){
    calcSub(s, phases);
    if(s.computed_start && (!mn||s.computed_start<mn)) mn=s.computed_start;
    if(s.computed_end   && (!mx||s.computed_end  >mx)) mx=s.computed_end;
    if(s.schedule_status==='risk') risk=true;
  }
  proj.computed_start=mn; proj.computed_end=mx;
  proj.schedule_status = risk?'risk':'ok';
  proj._zoneCount = proj.subs.reduce((a,s)=>a+s.zones.length,0);
}

function recalcAll(){ PROJECTS.forEach(calcProject); }

async function loadPhases(){

async function loadProjects(){
  const [pr, sp, wz, ps, pa, ts] = await Promise.all([
    sb.from('projects').select('*').order('project_code'),
    sb.from('sub_projects').select('*').order('sort_order'),
    sb.from('work_zones').select('*').order('sort_order'),
    sb.from('zone_phase_durations').select('*'),
    sb.from('zone_phase_actuals').select('*'),
    sb.from('zone_task_schedule').select('*'),
  ]);
  for(const r of [pr,sp,wz,ps,pa,ts]) if(r.error) throw r.error;

  const durByZone = {};
  (ps.data||[]).forEach(r=>{
    (durByZone[r.work_zone_id] = durByZone[r.work_zone_id] || {})[r.dept_code] = r;
  });
  const actByZone = {};
  (pa.data||[]).forEach(r=>{
    (actByZone[r.work_zone_id] = actByZone[r.work_zone_id] || {})[r.dept_code] = r;
  });

  const taskByZone = {};
  (ts.data||[]).forEach(r=>{
    const z = taskByZone[r.work_zone_id] = taskByZone[r.work_zone_id] || {};
    (z[r.dept_code] = z[r.dept_code] || {})[r.task_code] = r;
  });

  const zonesBySub = {};
  (wz.data||[]).forEach(z=>{
    z.dur     = durByZone[z.id] || {};
    z.actuals = actByZone[z.id] || {};
    z.tasks   = taskByZone[z.id] || {};
    (zonesBySub[z.sub_project_id] = zonesBySub[z.sub_project_id] || []).push(z);
  });

  const subsByProj = {};
  (sp.data||[]).forEach(s=>{
    s.zones = zonesBySub[s.id] || [];
    (subsByProj[s.project_id] = subsByProj[s.project_id] || []).push(s);
  });

  PROJECTS = (pr.data||[]).map(p=>({ ...p, subs: subsByProj[p.id] || [] }));
  recalcAll();
}

async function loadFms(){

}

let DASH = { view:'cards' };

// プロジェクトの実績進捗 — サブ工程の完了率
function projProgress(p){
  let total=0, done=0;
  p.subs.forEach(s=>s.zones.forEach(z=>{
    PHASES.forEach(ph=>tasksFor(ph.dept_code).forEach(t=>{
      total++;
      if(taskRec(z, ph.dept_code, t.task_code).completed) done++;
    }));
  }));
  return total ? done/total : 0;
}

// 予定進捗 — 経過日数の割合
function projElapsed(p){
  if(!p.computed_start || !p.computed_end) return null;
  const span = dB(p.computed_start, p.computed_end);
  if(span <= 0) return null;
  const el = dB(p.computed_start, new Date());
  return Math.min(1, Math.max(0, el/span));
}

// 遅延判定 — 実績が予定より10ポイント以上遅れていれば遅延
function projHealth(p){
  if(p.schedule_status==='risk') return { key:'risk', ja:'工期リスク', cls:'pill-risk' };
  const el = projElapsed(p);
  const ac = projProgress(p);
  if(el === null)      return { key:'na',    ja:'日程未設定', cls:'pill-grey' };
  if(el >= 1 && ac<1)  return { key:'over',  ja:'納期超過',   cls:'pill-risk' };
  if(ac >= el - 0.10)  return { key:'ontime',ja:'順調',       cls:'pill-ok' };
  if(ac >= el - 0.25)  return { key:'watch', ja:'やや遅延',   cls:'pill-warn' };
  return { key:'late', ja:'遅延', cls:'pill-risk' };
}

function currentPhaseOf(p){
  const f = FLOW_PHASES.find(x=>phaseStateFor(p,x.code)==='cur');
  return f ? f.ja : (phaseStateFor(p,'G')==='done' ? '完了' : '—');
}

  const cur = currentPhaseOf(p);
  const daysLeft = p.computed_end ? dB(new Date(), p.computed_end) : null;

  return `
  <div class="pcard" onclick="SEL={proj:'${p.id}',sub:null,zone:null};go('proj')">
    <div class="pcard-h">

      </div>
      <span class="pill ${h.cls}">${h.ja}</span>
    </div>
    <div class="pcard-b">
      <div class="pcard-meta">
        <span class="muted">得意先</span><span>${esc(p.client_name||'—')}</span>
        <span class="muted">主幹工場</span><span>${esc(p.lead_factory||'—')}</span>
        <span class="muted">開始</span><span class="mono">${p.computed_start?fmt(p.computed_start):'—'}</span>
        <span class="muted">完了予定</span><span class="mono">${p.computed_end?fmt(p.computed_end):'—'}
          ${daysLeft!==null?`<span class="muted" style="font-size:11px">（${daysLeft>=0?'残 '+daysLeft+'日':'超過 '+(-daysLeft)+'日'}）</span>`:''}</span>
      </div>

      <div class="pcard-phase">
        <span class="muted" style="font-size:11px">現在のフェーズ</span>
        <b style="color:var(--accent)">${esc(cur)}</b>
      </div>

// ═══════════════════════════════════════════════════════════════
//  BUSINESS FLOW BOARD  (M2 — simplified Phase 1)
// ═══════════════════════════════════════════════════════════════
const FLOW_PHASES = [
  {code:'A',ja:'受注'},{code:'B',ja:'引継'},{code:'C',ja:'設計'},
  {code:'D',ja:'製作'},{code:'E',ja:'検査'},{code:'F',ja:'出荷'},{code:'G',ja:'精算'}
];

// ── 実データからフェーズ進捗を算出する ──
// サブ工程の完了・BOM取込・手配・製作進捗・出荷実績を根拠にする。
// 根拠がない段階のみプロジェクト状態を使う。
function subTaskPct(proj, deptCodes){
  let total=0, done=0;
  proj.subs.forEach(s=>s.zones.forEach(z=>{
    deptCodes.forEach(dc=>{
      tasksFor(dc).forEach(t=>{
        total++;
        if(taskRec(z, dc, t.task_code).completed) done++;
      });
    });
  }));
  return total ? done/total : 0;
}

function zoneIdsOf(proj){
  const out=[];
  proj.subs.forEach(s=>s.zones.forEach(z=>out.push(z.id)));
  return out;
}

// 製作進捗（FMSの部材チェック）の平均
function fabPctOf(proj){
  const ids = zoneIdsOf(proj);
  let total=0, done=0;
  ids.forEach(zid=>{
    const revs=(BOM_REVS[zid]||[]);
    if(!revs.length) return;
    const m=buildMaster(revs);
    Object.values(m).forEach(p=>{
      if(p.is_consumable || p.masterStatus==='removed') return;
      total++;
      if(progPct(zid,p.assm_mk,p.part_mk)===100) done++;
    });
  });
  return total ? done/total : null;   // null = 根拠なし
}

function phaseProgress(proj, code){
  const st = proj.status || 'planning';
  const order = ['planning','design','fabrication','dispatching','complete','archived'];
  const idx = Math.max(0, order.indexOf(st));
  const ids = zoneIdsOf(proj);

  switch(code){
    case 'A': // 受注 — プロジェクトが存在すれば完了
      return 1;

    case 'B': // 引継 — 開始日が設定されていれば完了とみなす
      return proj.computed_start ? 1 : (idx>=1?1:0);

    case 'C': { // 設計 — 設計サブ工程の完了率
      return subTaskPct(proj, ['design']);
    }
    case 'D': { // 製作 — 調達＋製作サブ工程と、FMSの部材進捗の平均
      const sub = subTaskPct(proj, ['procure','factory']);
      const fab = fabPctOf(proj);
      return fab===null ? sub : (sub+fab)/2;
    }
    case 'E': { // 検査 — 製品検査サブ工程
      let total=0, done=0;
      proj.subs.forEach(s=>s.zones.forEach(z=>{
        total++;
        if(taskRec(z,'factory','qc').completed) done++;
      }));
      return total ? done/total : 0;
    }
    case 'F': { // 出荷 — 受領済／全出荷
      const ds = DELIVS.filter(d=>d.project_id===proj.id && d.status!=='cancelled');
      if(!ds.length) return 0;
      return ds.filter(d=>d.status==='received').length / ds.length;
    }
    case 'G': // 精算
      return st==='complete' || st==='archived' ? 1 : 0;
  }
  return 0;
}

function phaseStateFor(proj, code){
  const pct = phaseProgress(proj, code);
  if(pct >= 0.999) return 'done';
  if(pct > 0)      return 'cur';
  // 未着手でも、前フェーズが完了していれば「現在のフェーズ」とみなす
  const i = FLOW_PHASES.findIndex(f=>f.code===code);
  if(i>0 && phaseProgress(proj, FLOW_PHASES[i-1].code) >= 0.999) return 'cur';
  return 'none';
}

        <span class="hint" style="align-self:center">保存すると項目・プロジェクトの日程が再集計されます</span>

function nextCode(){
  const yr = String(new Date().getFullYear()).slice(2);
  let max = 0;
  PROJECTS.forEach(p=>{
    const m = (p.project_code||'').match(new RegExp('^P-'+yr+'(\\\\d+)$'));
    if(m) max = Math.max(max, parseInt(m[1]));
  });
  return 'P-'+yr+String(max+1).padStart(2,'0');
}

async function saveNewProject(){
  const code = $('npCode').value.trim(), name = $('npName').value.trim();
  if(!code||!name){ toast('コードと名称を入力してください','err'); return; }
  try{
    sync('作成中…');
    const scope = {}; PHASES.forEach(p=>scope[p.dept_code]=true);
    const { data:pr, error } = await sb.from('projects').insert({
      project_code:code, name, client_name:$('npClient').value.trim()||null,
      site_address:$('npAddr').value.trim()||null, lead_factory:$('npFac').value||null,
      design_scope:scope, created_by:ME.id
    }).select().single();
    if(error) throw error;

    const { data:sub } = await sb.from('sub_projects')
      .insert({ project_id:pr.id, name:'本体', sort_order:0 }).select().single();
    const today = fmt(new Date());
    const { data:zone } = await sb.from('work_zones').insert({
      sub_project_id:sub.id, project_id:pr.id, name:'A工区', sort_order:0,
      start_date:today, delivery_date:fmt(addD(new Date(),180))
    }).select().single();
    await sb.from('zone_phase_durations').insert(
      PHASES.map(ph=>({ work_zone_id:zone.id, dept_code:ph.dept_code, duration_days:ph.default_days??50 })));

    await logAudit('project.create','projects',pr.id,pr.id,null,{code,name});
    closeModal(); await loadProjects();
    SEL={proj:pr.id,sub:null,zone:null}; go('proj');
    toast('プロジェクトを作成しました','ok'); sync('同期済');
  }catch(e){ toast('作成エラー: '+e.message,'err'); sync('エラー'); }
}

async function toggleScope(code, on){
  const p=curProj(); if(!p) return;

    p.design_scope = scope; recalcAll(); refreshProj();
    await persistDerived(p);
  }catch(e){ toast('保存エラー: '+e.message,'err'); }

  }catch(e){ toast('追加エラー: '+e.message,'err'); }
}

// ── ZONE SCHEDULE EDITING ──
function onZoneField(){
  const z=curZone(); if(!z) return;
  z.start_date    = $('zSD').value || null;
  z.delivery_date = $('zDD').value || null;
  recalcAll(); refreshProj();
}
function onKeyDate(){
  const z=curZone(); if(!z) return;
  z.key_approval    = $('zKA').value || null;
  z.key_order       = $('zKO').value || null;
  z.key_fabrication = $('zKF').value || null;
}
function onPhaseDur(code, val){
  const z=curZone(); if(!z) return;
  z.dur[code] = { ...(z.dur[code]||{}), duration_days: parseInt(val)||0 };
  recalcAll(); refreshProj();
}

function taskSlot(z, dc, tc){
  z.tasks = z.tasks || {};
  z.tasks[dc] = z.tasks[dc] || {};
  z.tasks[dc][tc] = z.tasks[dc][tc] || {};
  return z.tasks[dc][tc];
}

function onTaskField(dc, tc, field, val){
  const z=curZone(); if(!z) return;
  const r = taskSlot(z, dc, tc);
  if(field==='duration_days')      r.duration_days = parseInt(val)||0;
  else if(field==='completed')     { r.completed = val; if(val && !r.completed_date) r.completed_date = fmt(new Date()); }
  else                             r[field] = val || null;
  recalcAll(); refreshProj();
}

// 「手動」ON にした時は、現在の自動計算値を初期値として入れる
function onTaskManual(dc, tc, on){
  const z=curZone(); if(!z) return;
  const r = taskSlot(z, dc, tc);
  r.is_manual = on;
  if(on && (!r.start_date || !r.end_date)){
    const lay = z.taskBars && z.taskBars[dc];
    const b = lay && lay.find(x=>x.task.task_code===tc);
    if(b){ r.start_date = fmt(b.start); r.end_date = fmt(b.end); }
  }
  recalcAll(); refreshProj();
}
function onActual(code, field, val){
  const z=curZone(); if(!z) return;
  const a = z.actuals[code] = z.actuals[code] || {};
  if(field==='completed') a.completed = val;
  else a.completed_date = val || null;
}

async function saveZone(){
  const p=curProj(), z=curZone(); if(!z) return;
  try{
    sync('保存中…');
    await sb.from('work_zones').update({
      start_date:z.start_date, delivery_date:z.delivery_date,
      key_approval:z.key_approval||null, key_order:z.key_order||null,
      key_fabrication:z.key_fabrication||null,
      needed_days:z.needed_days, available_days:z.available_days,
      schedule_status:z.schedule_status,
      overlap_before:z.overlap?z.overlap.before:0,
      overlap_after: z.overlap?z.overlap.after :0,
      computed_start:z.computed_start?fmt(z.computed_start):null,
      computed_end:z.computed_end?fmt(z.computed_end):null
    }).eq('id', z.id);

    const phases = phasesFor(p);
    for(const ph of phases){
      const b = z.bars ? z.bars[ph.dept_code] : null;
      await sb.from('zone_phase_durations').upsert({
        work_zone_id:z.id, dept_code:ph.dept_code,
        duration_days: durOf(z, ph.dept_code),
        computed_start:b&&b.start?fmt(b.start):null,
        computed_end:  b&&b.end  ?fmt(b.end)  :null
      }, { onConflict:'work_zone_id,dept_code' });

      const a = z.actuals[ph.dept_code];
      if(a && (a.completed || a.completed_date)){
        await sb.from('zone_phase_actuals').upsert({
          work_zone_id:z.id, dept_code:ph.dept_code,
          completed:!!a.completed, completed_date:a.completed_date||null,
          updated_by: ME.id
        }, { onConflict:'work_zone_id,dept_code' });
      }

      // サブ工程
      const subs = tasksFor(ph.dept_code);
      if(subs.length){
        const lay = z.taskBars && z.taskBars[ph.dept_code];
        const rows = subs.map(t=>{
          const r = taskRec(z, ph.dept_code, t.task_code);
          const b = lay && lay.find(x=>x.task.task_code===t.task_code);
          return {
            work_zone_id:z.id, dept_code:ph.dept_code, task_code:t.task_code,
            duration_days: taskDur(z, ph.dept_code, t),
            is_manual: !!r.is_manual,
            start_date: r.is_manual ? (r.start_date||null) : null,
            end_date:   r.is_manual ? (r.end_date||null)   : null,
            computed_start: b?fmt(b.start):null,
            computed_end:   b?fmt(b.end)  :null,
            completed: !!r.completed,
            completed_date: r.completed_date || null,
            updated_by: ME.id
          };
        });
        const { error:et } = await sb.from('zone_task_schedule')
          .upsert(rows, { onConflict:'work_zone_id,dept_code,task_code' });
        if(et) throw et;
      }
    }
    await persistDerived(p);
    await logAudit('schedule.save','work_zones',z.id,p.id,null,{zone:z.name});
    toast('スケジュールを保存しました','ok'); sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

// Persist rolled-up dates for 項目 and project
async function persistDerived(p){
  for(const s of p.subs){
    await sb.from('sub_projects').update({
      computed_start:s.computed_start?fmt(s.computed_start):null,
      computed_end:s.computed_end?fmt(s.computed_end):null,
      schedule_status:s.schedule_status
    }).eq('id', s.id);
  }
  await sb.from('projects').update({
    computed_start:p.computed_start?fmt(p.computed_start):null,
    computed_end:p.computed_end?fmt(p.computed_end):null,
    schedule_status:p.schedule_status
  }).eq('id', p.id);
}

async function logAudit(action, entityType, entityId, projectId, prev, next){
  try{
    await sb.from('audit_log').insert({
      actor_id:ME.id, actor_name:ME.full_name||ME.email,
      module:'core', action, entity_type:entityType, entity_id:entityId,
      project_id:projectId, prev_value:prev, new_value:next
    });
  }catch(e){ /* non-fatal */ }
}

// ガント表示フィルタ
let GF = { depts:{}, riskOnly:false, project:'' };

function ganttDepts(){
  const on = PHASES.filter(p=>GF.depts[p.dept_code]);
  return on.length ? on : PHASES;   // 何も選ばれていなければ全部
}

function ganttProjects(){
  let list = PROJECTS;
  if(GF.project) list = list.filter(p=>p.id===GF.project);
  if(GF.riskOnly) list = list.filter(p=>p.schedule_status==='risk');
  return list;
}

// 部門別 月次負荷 — 選択中の部門について、各月に稼働している工区数と日数
function deptWorkload(){
  const depts = ganttDepts();
  const rows = [];
  const months = {};
  ganttProjects().forEach(p=>p.subs.forEach(s=>s.zones.forEach(z=>{
    depts.forEach(ph=>{
      const b = z.bars && z.bars[ph.dept_code];
      if(!b || !b.start) return;
      let d = new Date(b.start.getFullYear(), b.start.getMonth(), 1);
      while(d <= b.end){
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        const mStart = new Date(d.getFullYear(), d.getMonth(), 1);
        const mEnd   = new Date(d.getFullYear(), d.getMonth()+1, 0);
        const ovS = b.start > mStart ? b.start : mStart;
        const ovE = b.end   < mEnd   ? b.end   : mEnd;
        const days = Math.max(0, dB(ovS, ovE));
        if(days > 0){
          const m = months[key] = months[key] || { key, byDept:{}, zones:new Set(), days:0 };
          m.byDept[ph.dept_code] = (m.byDept[ph.dept_code]||0) + days;
          m.zones.add(z.id);
          m.days += days;
        }
        d = new Date(d.getFullYear(), d.getMonth()+1, 1);
      }
    });
  })));
  Object.values(months).forEach(m=>rows.push(m));
  rows.sort((a,b)=>a.key.localeCompare(b.key));
  return rows;
}

function ganttRange(){
  let mn=null,mx=null;
  ganttProjects().forEach(p=>{
    if(p.computed_start && (!mn||p.computed_start<mn)) mn=p.computed_start;
    if(p.computed_end   && (!mx||p.computed_end  >mx)) mx=p.computed_end;
  });
  if(!mn){ mn=new Date(); mx=addD(new Date(),120); }
  return { mn:addD(mn,-7), mx:addD(mx,14) };
}

function drawGantt(){
  const cv = $('gCanvas'); if(!cv) return;
  const { mn, mx } = ganttRange();
  const days = Math.max(1, dB(mn,mx));

  const LP = 250;                       // left panel width
  const PX = Math.max(3.2, Math.min(9, 1000/days));
  const W  = LP + days*PX + 24;
  const HDR = 46, ROW_P = 30, ROW_S = 26, ROW_Z = 30;

  let rows = [];
  ganttProjects().forEach(p=>{
    rows.push({ t:'p', o:p });
    p.subs.forEach(s=>{
      rows.push({ t:'s', o:s, p });
      s.zones.forEach(z=> rows.push({ t:'z', o:z, s, p }));
    });
  });
  const H = HDR + rows.reduce((a,r)=>a+(r.t==='p'?ROW_P:r.t==='s'?ROW_S:ROW_Z),0) + 16;

  const dpr = window.devicePixelRatio||1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);

  const X = d => LP + dB(mn,d)*PX;

  // ── month header ──
  g.fillStyle='#eef2f7'; g.fillRect(0,0,W,HDR);
  g.strokeStyle='#dde4ec'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,HDR+.5); g.lineTo(W,HDR+.5); g.stroke();

  let cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  g.font='600 11px "Noto Sans JP",sans-serif';
  while(cur<mx){
    const x=X(cur);
    if(x>=LP){
      g.strokeStyle='#c8d3e0'; g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,H); g.stroke();
      g.fillStyle='#475569'; g.fillText(`${cur.getFullYear()}/${String(cur.getMonth()+1).padStart(2,'0')}`, x+5, 17);
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  // week ticks
  if(PX>=5){
    let d=new Date(mn);
    while(d<mx){
      if(d.getDay()===1){
        const x=X(d);
        if(x>=LP){ g.strokeStyle='#eef2f7'; g.beginPath(); g.moveTo(x+.5,HDR); g.lineTo(x+.5,H); g.stroke(); }
      }
      d=addD(d,1);
    }
  }
  // today
  const today=new Date(); today.setHours(0,0,0,0);
  if(today>=mn&&today<=mx){
    const x=X(today);
    g.strokeStyle='#dc2626'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x+.5,HDR); g.lineTo(x+.5,H); g.stroke();
    g.fillStyle='#dc2626'; g.font='600 10px sans-serif'; g.fillText('今日',x+3,HDR+11);
    g.lineWidth=1;
  }

  // ── rows ──
  let y = HDR;
  const rr=(x,yy,w,h,r,fill)=>{
    g.fillStyle=fill; g.beginPath();
    const rad=Math.min(r,h/2,w/2);
    g.moveTo(x+rad,yy); g.arcTo(x+w,yy,x+w,yy+h,rad); g.arcTo(x+w,yy+h,x,yy+h,rad);
    g.arcTo(x,yy+h,x,yy,rad); g.arcTo(x,yy,x+w,yy,rad); g.closePath(); g.fill();
  };

  rows.forEach(r=>{
    const h = r.t==='p'?ROW_P:r.t==='s'?ROW_S:ROW_Z;

    if(r.t==='p'){
      g.fillStyle='#f6f8fb'; g.fillRect(0,y,W,h);
      g.fillStyle='#12233a'; g.font='700 12px "Noto Sans JP",sans-serif';
      g.fillText(`${r.o.project_code}  ${r.o.name}`.slice(0,30), 10, y+h/2+4);
      if(r.o.computed_start&&r.o.computed_end){
        const x1=X(r.o.computed_start), w=Math.max(3,X(r.o.computed_end)-x1);
        rr(x1,y+h/2-4,w,8,4, r.o.schedule_status==='risk'?'#b91c1c':'#12233a');
      }
    }
    else if(r.t==='s'){
      g.fillStyle='#12233a'; g.font='600 11.5px "Noto Sans JP",sans-serif';
      g.fillText('  ▸ '+r.o.name.slice(0,24), 12, y+h/2+4);
      if(r.o.computed_start&&r.o.computed_end){
        const x1=X(r.o.computed_start), w=Math.max(3,X(r.o.computed_end)-x1);
        rr(x1,y+h/2-3,w,6,3, r.o.schedule_status==='risk'?'#dc2626':'#64748b');
      }
    }
    else {
      const z=r.o, proj=r.p;
      g.fillStyle='#6d28d9'; g.font='500 11px "Noto Sans JP",sans-serif';
      g.fillText('     ◆ '+z.name.slice(0,22), 14, y+h/2+4);
      const sel = ganttDepts().map(d=>d.dept_code);
      const phases = phasesFor(proj).filter(ph=>sel.includes(ph.dept_code));
      // phase bars, with sub-task segments where defined
      phases.forEach(ph=>{
        const b = z.bars ? z.bars[ph.dept_code] : null;
        if(!b||!b.start) return;
        const x1=X(b.start), w=Math.max(2,X(b.end)-x1);
        const lay = z.taskBars && z.taskBars[ph.dept_code];
        if(lay && lay.length){
          // pale base spanning the whole phase
          rr(x1,y+6,w,14,3,ph.colour+'40');
          lay.forEach((seg,si)=>{
            const sx=X(seg.start), sw=Math.max(2,X(seg.end)-sx);
            rr(sx,y+6,sw,14,2, si%2 ? ph.colour : ph.colour+'d0');
            if(seg.manual){
              g.save(); g.strokeStyle='#6d28d9'; g.lineWidth=1.5;
              g.strokeRect(sx+.5,y+6.5,sw-1,13); g.restore();
            }
            if(sw>26){
              g.fillStyle='#fff'; g.font='600 8.5px "Noto Sans JP",sans-serif';
              g.fillText(String(seg.task.sequence), sx+sw/2-2, y+16);
            }
          });
        } else {
          rr(x1,y+6,w,14,3,ph.colour);
          if(w>34){
            g.fillStyle='#fff'; g.font='600 9px "Noto Sans JP",sans-serif';
            g.fillText(String(dB(b.start,b.end)), x1+w/2-6, y+16);
          }
        }
      });
      // overlap hatch where 調達部 was compressed into neighbours
      if(z.schedule_status==='risk' && z.overlap && (z.overlap.before||z.overlap.after)){
        const fillPh = phases.find(p=>p.anchor==='fill');
        const b = fillPh && z.bars ? z.bars[fillPh.dept_code] : null;
        if(b){
          g.save();
          g.fillStyle='rgba(185,28,28,.30)';
          if(z.overlap.before){
            const ox=X(b.start), ow=Math.max(1,X(addD(b.start,z.overlap.before))-ox);
            g.fillRect(ox,y+6,ow,14);
          }
          if(z.overlap.after){
            const oe=X(b.end), os=X(addD(b.end,-z.overlap.after));
            g.fillRect(os,y+6,Math.max(1,oe-os),14);
          }
          g.restore();
        }
      }
      // key milestone markers
      KEY_DATES.forEach(kd=>{
        const raw = kd.field==='delivery_date' ? z.delivery_date : z[kd.field];
        if(!raw) return;
        const kx=X(par(raw));
        g.fillStyle=kd.colour;
        g.beginPath();
        g.moveTo(kx,y+2); g.lineTo(kx+4,y+7); g.lineTo(kx,y+12); g.lineTo(kx-4,y+7);
        g.closePath(); g.fill();
      });
      // delivery line
      if(z.delivery_date){
        const dx=X(par(z.delivery_date));
        g.strokeStyle = z.schedule_status==='risk' ? '#dc2626' : '#15803d';
        g.setLineDash([3,3]); g.beginPath(); g.moveTo(dx,y+2); g.lineTo(dx,y+h-2); g.stroke(); g.setLineDash([]);
      }
    }

    g.strokeStyle='#eef2f7'; g.beginPath(); g.moveTo(0,y+h+.5); g.lineTo(W,y+h+.5); g.stroke();
    y+=h;
  });

  // left panel divider
  g.strokeStyle='#c8d3e0'; g.beginPath(); g.moveTo(LP+.5,0); g.lineTo(LP+.5,H); g.stroke();

  const gr=$('gRange');
  if(gr) gr.textContent = `${fmt(mn)} 〜 ${fmt(mx)}　${rows.filter(r=>r.t==='z').length} 工区`;
}
