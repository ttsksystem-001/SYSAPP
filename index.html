function ganttRange(){
  let mn=null,mx=null;
  ganttProjects().forEach(p=>{
    if(p.computed_start && (!mn||p.computed_start<mn)) mn=p.computed_start;
    if(p.computed_end   && (!mx||p.computed_end  >mx)) mx=p.computed_end;
  });
  if(!mn){ mn=new Date(); mx=addD(new Date(),120); }
  return { mn:addD(mn,-7), mx:addD(mx,14) };
}

// 1日あたりの横幅。キャンバスが極端に広くならないよう上限で抑える。
const GANTT_MAXW = 24000;
function ganttPx(days){
  const z = zoomOf();
  let px = (z.px == null) ? Math.max(3.2, Math.min(9, 1000/days)) : z.px;
  if(days*px > GANTT_MAXW) px = GANTT_MAXW/days;
  return px;
}

// ── 三角の開閉マーク ──
function chevron(ctx,x,y,open,colour){
  ctx.fillStyle=colour; ctx.beginPath();
  if(open){ ctx.moveTo(x-4.2,y-2.2); ctx.lineTo(x+4.2,y-2.2); ctx.lineTo(x,y+3.4); }
  else    { ctx.moveTo(x-2.2,y-4.4); ctx.lineTo(x+3.4,y);     ctx.lineTo(x-2.2,y+4.4); }
  ctx.closePath(); ctx.fill();
}
function diamond(ctx,x,y,r,colour){
  ctx.fillStyle=colour; ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.lineTo(x+r,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r,y);
  ctx.closePath(); ctx.fill();
}

// 工区にサブ工程が定義されているか（開閉マークを出すかの判定）
function zoneHasTasks(z){
  return !!(z.taskBars && Object.keys(z.taskBars).some(k=>(z.taskBars[k]||[]).length));
}

// 左パネルのクリック → 該当行の開閉
function ganttClick(ev){
  const cv=$('gCanvasL'); if(!cv) return;
  const rect=cv.getBoundingClientRect();
  const y=ev.clientY-rect.top;
  const hit=GHIT.find(r=> y>=r.y && y<r.y+r.h);
  if(!hit) return;
  if(hit.t==='p' && hit.kids)            ganttToggle('p', hit.id);
  else if(hit.t==='s' && hit.kids)       ganttToggle('s', hit.id);
  else if(hit.t==='z' && hit.hasTasks)   ganttToggle('z', hit.id);
}

function drawGantt(){
  const cvHL=$('gHeadL'), cvHR=$('gHeadR'), cvL=$('gCanvasL'), cvR=$('gCanvas');
  if(!cvHL || !cvHR || !cvL || !cvR) return;

  const { mn, mx } = ganttRange();
  const days = Math.max(1, dB(mn,mx));
  const z  = zoomOf();
  const PX = ganttPx(days);

  const LP = 250;                       // 固定ラベル欄の幅
  const TW = Math.max(320, days*PX + 24);
  const HDR = 46, ROW_P = 30, ROW_S = 26, ROW_Z = 30, ROW_B = 24;

  const rows = ganttRows();
  const BH = rows.reduce((a,r)=>a+(r.t==='p'?ROW_P:r.t==='s'?ROW_S:r.t==='b'?ROW_B:ROW_Z),0) + 16;

  // 幅が大きいときは dpr を落としてメモリを抑える
  const dpr = TW > 8000 ? 1 : (window.devicePixelRatio||1);
  const prep = (cv,w,h)=>{
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    cv.style.width=w+'px'; cv.style.height=h+'px';
    const c=cv.getContext('2d');
    c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle='#fff'; c.fillRect(0,0,w,h);
    return c;
  };
  const gh = prep(cvHL, LP, HDR);   // 左上の角（固定）
  const gH = prep(cvHR, TW, HDR);   // 日付ヘッダー（縦スクロールしても残る）
  const gl = prep(cvL,  LP, BH);    // 行ラベル（横スクロールしても残る）
  const g  = prep(cvR,  TW, BH);    // バー本体

  const X = d => dB(mn,d)*PX;

  const rr=(ctx,x,yy,w,h,r,fill)=>{
    ctx.fillStyle=fill; ctx.beginPath();
    const rad=Math.min(r,h/2,w/2);
    ctx.moveTo(x+rad,yy); ctx.arcTo(x+w,yy,x+w,yy+h,rad); ctx.arcTo(x+w,yy+h,x,yy+h,rad);
    ctx.arcTo(x,yy+h,x,yy,rad); ctx.arcTo(x,yy,x+w,yy,rad); ctx.closePath(); ctx.fill();
  };

  const today=new Date(); today.setHours(0,0,0,0);

  // ═══ 左上の角 ═══
  gh.fillStyle='#eef2f7'; gh.fillRect(0,0,LP,HDR);
  gh.fillStyle='#475569'; gh.font='600 11px "Noto Sans JP",sans-serif';
  gh.fillText('プロジェクト / 項目 / 工区', 10, 20);
  gh.fillStyle='#94a3b8'; gh.font='500 10px "Noto Sans JP",sans-serif';
  gh.fillText(GF.sort==='deliv' ? '納期順（最早）' : 'プロジェクト番号順', 10, 36);
  gh.strokeStyle='#c8d3e0'; gh.lineWidth=1;
  gh.beginPath(); gh.moveTo(0,HDR-.5); gh.lineTo(LP,HDR-.5); gh.stroke();
  gh.beginPath(); gh.moveTo(LP-.5,0);  gh.lineTo(LP-.5,HDR); gh.stroke();

  // ═══ 日付ヘッダー ═══
  gH.fillStyle='#eef2f7'; gH.fillRect(0,0,TW,HDR);
  // 非稼働日を塗る（祝日・会社休日は赤系、土日は灰）
  const shade = PX >= 3.5;
  if(shade){
    let d=new Date(mn);
    while(d<mx){
      const hol=isHoliday(d), wk=isWknd(d);
      if(hol||wk){ gH.fillStyle = hol ? '#f7dede' : '#e3e9f0'; gH.fillRect(X(d),0,PX,HDR); }
      d=addD(d,1);
    }
  }
  // 月の見出し
  let cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  gH.font='600 11px "Noto Sans JP",sans-serif';
  while(cur<mx){
    const x=X(cur);
    if(x>=0){
      gH.strokeStyle='#c8d3e0'; gH.beginPath(); gH.moveTo(x+.5,0); gH.lineTo(x+.5,HDR); gH.stroke();
      gH.fillStyle='#475569'; gH.fillText(`${cur.getFullYear()}/${String(cur.getMonth()+1).padStart(2,'0')}`, x+5, 17);
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  // 週・日の目盛り
  if(z.tier==='week'){
    let d=new Date(mn); gH.font='500 9.5px "Noto Sans JP",sans-serif';
    while(d<mx){
      if(d.getDay()===1){ const x=X(d);
        gH.strokeStyle='#dbe3ec'; gH.beginPath(); gH.moveTo(x+.5,22); gH.lineTo(x+.5,HDR); gH.stroke();
        gH.fillStyle='#64748b'; gH.fillText(`${d.getMonth()+1}/${d.getDate()}`, x+3, HDR-6);
      }
      d=addD(d,1);
    }
  }
  if(z.tier==='day'){
    let d=new Date(mn); gH.font='500 9px "Noto Sans JP",sans-serif';
    while(d<mx){
      const x=X(d);
      gH.strokeStyle = d.getDay()===1 ? '#cbd5e1' : '#e6ebf1';
      gH.beginPath(); gH.moveTo(x+.5,22); gH.lineTo(x+.5,HDR); gH.stroke();
      gH.fillStyle = isHoliday(d) ? '#b91c1c' : isWknd(d) ? '#94a3b8' : '#475569';
      const lbl=String(d.getDate());
      gH.fillText(lbl, x + PX/2 - gH.measureText(lbl).width/2, HDR-6);
      d=addD(d,1);
    }
  }
  gH.strokeStyle='#c8d3e0'; gH.lineWidth=1;
  gH.beginPath(); gH.moveTo(0,HDR-.5); gH.lineTo(TW,HDR-.5); gH.stroke();
  if(today>=mn&&today<=mx){
    const x=X(today);
    gH.strokeStyle='#dc2626'; gH.lineWidth=1.5;
    gH.beginPath(); gH.moveTo(x+.5,0); gH.lineTo(x+.5,HDR); gH.stroke();
    gH.fillStyle='#dc2626'; gH.font='600 10px sans-serif'; gH.fillText('今日',x+3,11);
    gH.lineWidth=1;
  }

  // ═══ 本体の背景（週末・月線・今日） ═══
  if(shade){
    let d=new Date(mn);
    while(d<mx){
      const hol=isHoliday(d), wk=isWknd(d);
      if(hol||wk){ g.fillStyle = hol ? '#fbeaea' : '#f1f5f9'; g.fillRect(X(d),0,PX,BH); }
      d=addD(d,1);
    }
  }
  cur=new Date(mn.getFullYear(),mn.getMonth(),1);
  while(cur<mx){
    const x=X(cur);
    if(x>=0){ g.strokeStyle='#c8d3e0'; g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,BH); g.stroke(); }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  if(z.tier==='week' || (z.tier==='month' && PX>=5) || z.tier==='day'){
    let d=new Date(mn);
    while(d<mx){
      const x=X(d);
      if(z.tier==='day'){
        g.strokeStyle = d.getDay()===1 ? '#cbd5e1' : '#eef2f7';
        g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,BH); g.stroke();
      } else if(d.getDay()===1){
        g.strokeStyle = z.tier==='week' ? '#e2e8f0' : '#eef2f7';
        g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,BH); g.stroke();
      }
      d=addD(d,1);
    }
  }
  if(today>=mn&&today<=mx){
    const x=X(today);
    g.strokeStyle='#dc2626'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,BH); g.stroke();
    g.lineWidth=1;
  }

  // ═══ 行 ═══
  let y = 0;
  GHIT = [];

  rows.forEach(r=>{
    const h = r.t==='p'?ROW_P:r.t==='s'?ROW_S:r.t==='b'?ROW_B:ROW_Z;

    if(r.t==='p'){
      GHIT.push({ y, h, t:'p', id:r.o.id, kids:r.kids });
      gl.fillStyle='#f6f8fb'; gl.fillRect(0,y,LP,h);
      g.fillStyle ='#f6f8fb'; g.fillRect(0,y,TW,h);
      if(r.kids) chevron(gl, 12, y+h/2, !r.collapsed, '#64748b');
      gl.fillStyle='#12233a'; gl.font='700 12px "Noto Sans JP",sans-serif';
      gl.fillText(`${r.o.project_code}  ${r.o.name}`.slice(0,26), 22, y+h/2+4);
      if(r.collapsed && r.zones){
        gl.fillStyle='#94a3b8'; gl.font='600 9.5px "Noto Sans JP",sans-serif';
        const t=r.zones+'工区';
        gl.fillText(t, LP - gl.measureText(t).width - 8, y+h/2+4);
      }
      if(r.o.computed_start&&r.o.computed_end){
        const x1=X(r.o.computed_start), w=Math.max(3,X(r.o.computed_end)-x1);
        rr(g,x1,y+h/2-4,w,8,4, r.o.schedule_status==='risk'?'#b91c1c':'#12233a');
      }
    }
    else if(r.t==='s'){
      GHIT.push({ y, h, t:'s', id:r.o.id, kids:r.kids });
      if(r.kids) chevron(gl, 26, y+h/2, !r.collapsed, '#94a3b8');
      gl.fillStyle='#12233a'; gl.font='600 11.5px "Noto Sans JP",sans-serif';
      gl.fillText(r.o.name.slice(0,20), 36, y+h/2+4);
      if(r.collapsed && r.kids){
        gl.fillStyle='#94a3b8'; gl.font='600 9.5px "Noto Sans JP",sans-serif';
        const t=r.kids+'工区';
        gl.fillText(t, LP - gl.measureText(t).width - 8, y+h/2+4);
      }
      if(r.o.computed_start&&r.o.computed_end){
        const x1=X(r.o.computed_start), w=Math.max(3,X(r.o.computed_end)-x1);
        rr(g,x1,y+h/2-3,w,6,3, r.o.schedule_status==='risk'?'#dc2626':'#64748b');
      }
    }
    else if(r.t==='z'){
      const z0=r.o, proj=r.p;
      const hasTasks = zoneHasTasks(z0) || (z0.blocks||[]).length>0;
      GHIT.push({ y, h, t:'z', id:z0.id, hasTasks });

      if(hasTasks) chevron(gl, 40, y+h/2, !r.collapsed, '#a78bfa');
      diamond(gl, 52, y+h/2-1, 3.4, '#6d28d9');
      gl.fillStyle='#6d28d9'; gl.font='500 11px "Noto Sans JP",sans-serif';
      const znm = z0.name.slice(0,12);
      gl.fillText(znm, 60, y+h/2+4);
      if(r.blocks && r.collapsed){
        gl.fillStyle='#a78bfa'; gl.font='600 9px "Noto Sans JP",sans-serif';
        gl.fillText('＋先行'+r.blocks, 62+gl.measureText(znm).width, y+h/2+4);
      }
      // 納期順で並べたときに根拠が見えるよう、右端に納期を出す
      if(z0.delivery_date){
        gl.fillStyle = z0.schedule_status==='risk' ? '#dc2626' : '#94a3b8';
        gl.font='600 9.5px ui-monospace,SFMono-Regular,monospace';
        const t=String(z0.delivery_date).slice(2);
        gl.fillText(t, LP - gl.measureText(t).width - 8, y+h/2+4);
      }

      const sel = ganttDepts().map(d=>d.dept_code);
      const phases = phasesFor(proj).filter(ph=>sel.includes(ph.dept_code));

      // 工程バー。折りたたんだ工区はサブ工程を出さず、部門ごとに1本にまとめる。
      phases.forEach(ph=>{
        const b = z0.bars ? z0.bars[ph.dept_code] : null;
        if(!b||!b.start) return;
        const x1=X(b.start), w=Math.max(2,X(b.end)-x1);
        const lay = (!r.collapsed && z0.taskBars) ? z0.taskBars[ph.dept_code] : null;
        if(lay && lay.length){
          rr(g,x1,y+6,w,14,3,ph.colour+'40');
          lay.forEach((seg,si)=>{
            const sx=X(seg.start), sw=Math.max(2,X(seg.end)-sx);
            rr(g,sx,y+6,sw,14,2, si%2 ? ph.colour : ph.colour+'d0');
            if(seg.manual){
              g.save(); g.strokeStyle='#6d28d9'; g.lineWidth=1.5;
              g.strokeRect(sx+.5,y+6.5,sw-1,13); g.restore();
            }
            if(sw>26){
              g.fillStyle='#fff'; g.font='600 8.5px "Noto Sans JP",sans-serif';
              g.fillText(String(seg.task.sequence), sx+sw/2-2, y+16);
            }
          });
        } else {
          rr(g,x1,y+6,w,14,3,ph.colour);
          if(w>34){
            g.fillStyle='#fff'; g.font='600 9px "Noto Sans JP",sans-serif';
            const t=String(wdB(b.start,b.end,patternOf(ph.dept_code)));
            g.fillText(t, x1+w/2-g.measureText(t).width/2, y+16);
          }
        }
      });

      // ── 部門重複 ──
      // 同じ行に重ねて描くと後の工程が前を塗り潰してしまうため、
      // 重なり区間は両部門の色の斜線で塗り直し、破線で囲って明示する。
      zoneOverlaps(z0, phases).forEach(ov=>{
        const ox=X(ov.start), ow=Math.max(2, X(ov.end)-ox);
        hatch(g, ox, y+6, ow, 14, ov.a.colour+'e0', ov.b.colour+'e0');
        g.save();
        g.strokeStyle = ov.compress ? '#b91c1c' : '#334155';
        g.lineWidth = 1.5; g.setLineDash([3,2]);
        g.strokeRect(ox+.5, y+6.5, Math.max(1,ow-1), 13);
        g.restore();
        if(ow>=28){
          const lbl = ov.days+'日';
          g.font='700 8.5px "Noto Sans JP",sans-serif';
          const tw=g.measureText(lbl).width;
          g.fillStyle='rgba(255,255,255,.88)';
          g.fillRect(ox+ow/2-tw/2-2, y+8, tw+4, 11);
          g.fillStyle = ov.compress ? '#b91c1c' : '#0f172a';
          g.fillText(lbl, ox+ow/2-tw/2, y+16.5);
        }
      });

      // キー日程
      KEY_DATES.forEach(kd=>{
        const raw = kd.field==='delivery_date' ? z0.delivery_date : z0[kd.field];
        if(!raw) return;
        const kx=X(par(raw));
        g.fillStyle=kd.colour;
        g.beginPath();
        g.moveTo(kx,y+2); g.lineTo(kx+4,y+7); g.lineTo(kx,y+12); g.lineTo(kx-4,y+7);
        g.closePath(); g.fill();
      });
      // 納期線
      if(z0.delivery_date){
        const dx=X(par(z0.delivery_date));
        g.strokeStyle = z0.schedule_status==='risk' ? '#dc2626' : '#15803d';
        g.setLineDash([3,3]); g.beginPath(); g.moveTo(dx,y+2); g.lineTo(dx,y+h-2); g.stroke(); g.setLineDash([]);
      }
    }

    if(r.t==='b'){
      const bk=r.o, proj=r.p;
      GHIT.push({ y, h, t:'b', id:bk.id });

      // ツリーの枝 — 親の工区からぶら下がる
      gl.strokeStyle='#c4b5fd'; gl.lineWidth=1;
      gl.beginPath();
      gl.moveTo(56.5, y);            // 親（工区）の行から下ろす
      gl.lineTo(56.5, y+h/2);        // 枝の高さまで
      gl.lineTo(70,   y+h/2);        // 横に出す（└─ の形）
      if(!r.last) gl.moveTo(56.5, y+h/2), gl.lineTo(56.5, y+h);   // 下に兄弟が続く（├─）
      gl.stroke();

      gl.fillStyle = bk.schedule_status==='risk' ? '#b91c1c' : '#7c3aed';
      gl.font='600 10px "Noto Sans JP",sans-serif';
      gl.fillText('先行 '+String(bk.name||'').slice(0,10), 74, y+h/2+3.5);
      if(bk.delivery_date){
        gl.fillStyle = bk.schedule_status==='risk' ? '#dc2626' : '#a78bfa';
        gl.font='600 9px ui-monospace,SFMono-Regular,monospace';
        const t=String(bk.delivery_date).slice(2);
        gl.fillText(t, LP - gl.measureText(t).width - 8, y+h/2+3.5);
      }

      const sel = ganttDepts().map(d=>d.dept_code);
      const bphases = phasesFor(proj).filter(ph=>sel.includes(ph.dept_code));
      bphases.forEach(ph=>{
        const b = bk.bars ? bk.bars[ph.dept_code] : null;
        if(!b||!b.start) return;
        const x1=X(b.start), w=Math.max(2,X(b.end)-x1);
        rr(g,x1,y+6,w,11,2,ph.colour+'c8');
        g.save(); g.strokeStyle=ph.colour; g.lineWidth=.8;
        g.strokeRect(x1+.5,y+6.5,Math.max(1,w-1),10); g.restore();
        if(w>30){
          g.fillStyle='#fff'; g.font='600 8px "Noto Sans JP",sans-serif';
          const t=String(wdB(b.start,b.end,patternOf(ph.dept_code)));
          g.fillText(t, x1+w/2-g.measureText(t).width/2, y+14.5);
        }
      });
      zoneOverlaps(bk, bphases).forEach(ov=>{
        const ox=X(ov.start), ow=Math.max(2, X(ov.end)-ox);
        hatch(g, ox, y+6, ow, 11, ov.a.colour+'e0', ov.b.colour+'e0');
        g.save(); g.strokeStyle=ov.compress?'#b91c1c':'#334155';
        g.lineWidth=1.2; g.setLineDash([2,2]);
        g.strokeRect(ox+.5,y+6.5,Math.max(1,ow-1),10); g.restore();
      });
      if(bk.delivery_date){
        const dx=X(par(bk.delivery_date));
        g.strokeStyle = bk.schedule_status==='risk' ? '#dc2626' : '#7c3aed';
        g.setLineDash([2,2]); g.beginPath(); g.moveTo(dx,y+2); g.lineTo(dx,y+h-2); g.stroke(); g.setLineDash([]);
      }
    }

    gl.strokeStyle='#eef2f7'; gl.beginPath(); gl.moveTo(0,y+h+.5); gl.lineTo(LP,y+h+.5); gl.stroke();
    g.strokeStyle ='#eef2f7'; g.beginPath();  g.moveTo(0,y+h+.5);  g.lineTo(TW,y+h+.5);  g.stroke();
    y+=h;
  });

  // 左パネルの右端
  gl.strokeStyle='#c8d3e0'; gl.beginPath(); gl.moveTo(LP-.5,0); gl.lineTo(LP-.5,BH); gl.stroke();
  cvL.onclick = ganttClick;

  // スクロール位置 — ズームを変えたときは今日が見える位置へ寄せる
  const vp = $('gViewport');
  if(vp){
    if(GSCROLL.zoom !== GF.zoom || GSCROLL.left == null){
      const tx = (today>=mn && today<=mx) ? X(today) : 0;
      vp.scrollLeft = Math.max(0, tx - (vp.clientWidth-LP)/3);
      GSCROLL.zoom = GF.zoom; GSCROLL.left = vp.scrollLeft;
    } else {
      vp.scrollLeft = Math.min(GSCROLL.left, Math.max(0, LP+TW - vp.clientWidth));
      if(GSCROLL.top != null) vp.scrollTop = Math.min(GSCROLL.top, Math.max(0, HDR+BH - vp.clientHeight));
    }
    vp.onscroll = () => { GSCROLL.left = vp.scrollLeft; GSCROLL.top = vp.scrollTop; };
  }

  const gr=$('gRange');
  if(gr) gr.textContent = `${fmt(mn)} 〜 ${fmt(mx)}　${ganttZoneCount()} 工区　${zoomOf().label}`;
}

const TRUCK_SIZES = ['2t','4t','4t ユニック','10t','10t ユニック','トレーラー','セルフローダー'];

function viewDeliv(){
  const upcoming = DELIVS.filter(d=>d.status!=='received'&&d.status!=='cancelled');
  const done     = DELIVS.filter(d=>d.status==='received'||d.status==='cancelled');
  return `
  <div class="inline-note">
    <b>出荷管理</b> — 工事部が納入日・台数を登録し、<b>工務部</b>が運送会社・車両・ドライバー情報を入力します。
    業務フローでは納入2週間前までの手配が定められています。
  </div>

  <div class="card">
    <div class="card-h"><h3>出荷予定</h3>
      <button class="btn btn-p btn-s" onclick="newDelivery()">＋ 出荷を登録</button></div>
    ${upcoming.length ? delivTable(upcoming) :
      `<div class="empty" style="padding:30px"><p>出荷予定はありません</p>
       <button class="btn btn-p btn-s" style="margin-top:10px" onclick="newDelivery()">＋ 出荷を登録</button></div>`}
  </div>

  ${done.length ? `<div class="card">
    <div class="card-h"><h3>完了・中止</h3><span class="muted" style="font-size:11.5px">${done.length}件</span></div>
    ${delivTable(done)}
  </div>` : ''}`;
}

function delivTable(list){
  return `<table>
    <thead><tr>
      <th>納入日</th><th>プロジェクト</th><th>工区</th><th>搬入先</th>
      <th>台数</th><th>車両・ドライバー</th><th>状態</th><th></th>
    </tr></thead>
    <tbody>${list.map(d=>{
      const p = PROJECTS.find(x=>x.id===d.project_id);
      let zoneName='—';
      if(d.work_zone_id&&p){
        for(const s of p.subs){ const z=s.zones.find(z=>z.id===d.work_zone_id); if(z){ zoneName=s.name+' / '+z.name; break; } }
      }
      const dd = par(d.delivery_date);
      const daysLeft = dd ? wdB(new Date(), dd, BASE_PATTERN) : null;
      const soon = daysLeft!==null && daysLeft>=0 && daysLeft<=14 && d.trucks.length===0;
      return `<tr>
        <td class="mono"><b>${esc(d.delivery_date)}</b>
          ${d.delivery_time?`<br><span class="muted" style="font-size:11px">${esc(d.delivery_time)}</span>`:''}
          ${soon?`<br><span class="pill pill-warn" style="font-size:10px">車両未手配</span>`:''}</td>
        <td>${p?`<b>${esc(p.name)}</b><br><span class="muted mono" style="font-size:11px">${esc(p.project_code)}</span>`:'—'}</td>
        <td class="muted" style="font-size:12px">${esc(zoneName)}</td>
        <td class="muted">${esc(d.site_name||'—')}</td>
        <td class="mono">${d.trucks.length||d.truck_count||0}</td>
        <td style="font-size:11.5px">${d.trucks.length ? d.trucks.map(t=>
            `<div class="mono">${esc(t.truck_size||'')} ${esc(t.plate_no||'')}${t.driver_name?` <span class="muted">/ ${esc(t.driver_name)}</span>`:''}</div>`).join('')
          : '<span class="muted">未登録</span>'}</td>
        <td>${delivPill(d.status)}</td>
        <td style="text-align:right"><button class="btn btn-s" onclick="editDelivery('${d.id}')">開く</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function zoneOptions(projId, selected){
  const p = PROJECTS.find(x=>x.id===projId);
  if(!p) return '<option value="">—</option>';
  let out = '<option value="">（工区を指定しない）</option>';
  p.subs.forEach(s=>{
    s.zones.forEach(z=>{
      out += `<option value="${z.id}" ${selected===z.id?'selected':''}>${esc(s.name)} / ${esc(z.name)}</option>`;
    });
  });
  return out;
}

function newDelivery(){
  if(!PROJECTS.length){ toast('先にプロジェクトを作成してください','err'); return; }
  const p0 = PROJECTS[0];
  openModal(`<div class="modal">
    <div class="modal-h"><h3>出荷を登録</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="grid g2">
        <div class="fld"><label>プロジェクト</label>
          <select id="ndProj" onchange="$('ndZone').innerHTML=zoneOptions(this.value)">
            ${PROJECTS.map(p=>`<option value="${p.id}">${esc(p.project_code)} ${esc(p.name)}</option>`).join('')}
          </select></div>
        <div class="fld"><label>工区</label><select id="ndZone">${zoneOptions(p0.id)}</select></div>
      </div>
      <div class="grid g3">
        <div class="fld"><label>納入日</label><input type="date" id="ndDate" value="${fmt(addD(new Date(),14))}"></div>
        <div class="fld"><label>搬入時刻</label><input id="ndTime" placeholder="例: 8:00"></div>
        <div class="fld"><label>台数（予定）</label><input type="number" id="ndCount" min="1" value="1"></div>
      </div>
      <div class="fld"><label>搬入先・現場名</label><input id="ndSite" placeholder="例: ○○ビル建設現場"></div>
      <div class="fld"><label>備考</label><input id="ndNotes" placeholder="任意"></div>
      <p class="hint">登録後、詳細画面で工務部が運送会社・車両・ドライバー情報を入力します。</p>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-p" onclick="saveNewDelivery()">登録</button></div>
  </div>`);
}

async function saveNewDelivery(){
  const date=$('ndDate').value;
  if(!date){ toast('納入日を入力してください','err'); return; }
  try{
    sync('登録中…');
    const projId=$('ndProj').value;
    const { data, error } = await sb.from('deliveries').insert({
      project_id:projId, work_zone_id:$('ndZone').value||null,
      delivery_date:date, delivery_time:$('ndTime').value.trim()||null,
      site_name:$('ndSite').value.trim()||null,
      truck_count:parseInt($('ndCount').value)||1,
      notes:$('ndNotes').value.trim()||null,
      requested_by:ME.id, requested_at:new Date().toISOString(),
      status:'planned'
    }).select().single();
    if(error) throw error;
    await logAudit('delivery.create','deliveries',data.id,projId,null,{date});
    closeModal(); await loadDeliveries(); go('deliv');
    toast('出荷を登録しました','ok'); sync('同期済');
    editDelivery(data.id);
  }catch(e){ toast('登録エラー: '+e.message,'err'); }
}

function editDelivery(id){
  const d = DELIVS.find(x=>x.id===id); if(!d) return;
  const p = PROJECTS.find(x=>x.id===d.project_id);
  const dd = par(d.delivery_date);
  const daysLeft = dd ? wdB(new Date(), dd, BASE_PATTERN) : null;

  openModal(`<div class="modal" style="width:760px">
    <div class="modal-h">
      <h3>出荷詳細 — ${esc(d.delivery_date)}</h3>
      ${delivPill(d.status)}
      <button class="x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      ${daysLeft!==null && daysLeft>=0 && daysLeft<14 && !d.trucks.length ? `
        <div style="background:var(--warn-l);border-left:3px solid var(--warn);padding:9px 12px;border-radius:0 5px 5px 0;margin-bottom:14px;font-size:12.5px">
          <b style="color:var(--warn)">⚠ 納入まで ${daysLeft} 日</b> — 業務フローでは2週間前までの手配が定められています。車両情報が未登録です。
        </div>`:''}

      <div class="sec-lbl">基本情報　<span class="muted" style="font-weight:400">（工事部）</span></div>

        <div class="fld"><label>搬入時刻</label><input id="edTime" value="${esc(d.delivery_time||'')}" placeholder="8:00"></div>
        <div class="fld"><label>工区</label><select id="edZone">${zoneOptions(d.project_id, d.work_zone_id)}</select></div>
      </div>
      <div class="grid g2">
        <div class="fld"><label>搬入先・現場名</label><input id="edSite" value="${esc(d.site_name||'')}"></div>
        <div class="fld"><label>出荷番号</label><input id="edNo" value="${esc(d.delivery_no||'')}" placeholder="任意"></div>
      </div>

      <div class="sec-lbl" style="color:var(--purple)">運送手配　<span class="muted" style="font-weight:400">（工務部）</span></div>
      <div class="grid g2">
        <div class="fld"><label>運送会社</label><input id="edCarrier" value="${esc(d.carrier_name||'')}" placeholder="例: ○○運輸"></div>
        <div class="fld"><label>運送手配書番号</label><input id="edTON" value="${esc(d.transport_order_no||'')}" placeholder="任意"></div>
      </div>

      <div class="sec-lbl" style="color:var(--purple)">車両・ドライバー情報</div>
      <div id="truckList">${renderTrucks(d)}</div>
      <button class="btn btn-s" style="margin-top:8px" onclick="addTruck('${d.id}')">＋ 車両を追加</button>

      <div class="sec-lbl">ステータス</div>
      <div class="grid g2">
        <div class="fld"><label>状態</label><select id="edStatus">
          ${[['planned','計画'],['arranged','手配済'],['notified','連絡済（前日）'],
             ['shipped','出荷済'],['received','受領済'],['cancelled','中止']]

async function addTruck(delivId){
  const d = DELIVS.find(x=>x.id===delivId);
  try{
    const { data, error } = await sb.from('delivery_trucks')
      .insert({ delivery_id:delivId, seq_no:(d.trucks.length||0)+1 }).select().single();
    if(error) throw error;
    d.trucks.push(data);
    $('truckList').innerHTML = renderTrucks(d);
    toast('車両を追加しました','ok');
  }catch(e){ toast('追加エラー: '+e.message,'err'); }
}

async function delTruck(truckId, delivId){
  if(!confirm('この車両情報を削除しますか？')) return;
  try{
    await sb.from('delivery_trucks').delete().eq('id',truckId);
    const d = DELIVS.find(x=>x.id===delivId);
    d.trucks = d.trucks.filter(t=>t.id!==truckId);
    $('truckList').innerHTML = renderTrucks(d);
    toast('削除しました','ok');
  }catch(e){ toast('削除エラー: '+e.message,'err'); }
}

async function saveDelivery(id){
  const d = DELIVS.find(x=>x.id===id); if(!d) return;
  try{
    sync('保存中…');
    const status = $('edStatus').value;
    const patch = {
      delivery_date:$('edDate').value||null,
      delivery_time:$('edTime').value.trim()||null,
      work_zone_id:$('edZone').value||null,
      site_name:$('edSite').value.trim()||null,
      delivery_no:$('edNo').value.trim()||null,
      carrier_name:$('edCarrier').value.trim()||null,
      transport_order_no:$('edTON').value.trim()||null,
      status,
      receipt_by:$('edRcpt').value.trim()||null,
      receipt_signed:$('edSigned').checked,
      notes:$('edNotes').value.trim()||null,
      truck_count: d.trucks.length || d.truck_count
    };
    if($('edCarrier').value.trim() && !d.arranged_by){
      patch.arranged_by = ME.id; patch.arranged_at = new Date().toISOString();
    }
    if(status==='notified' && !d.notified_at) patch.notified_at = new Date().toISOString();
    if(status==='shipped'  && !d.shipped_at)  patch.shipped_at  = new Date().toISOString();
    if(status==='received' && !d.received_at) patch.received_at = new Date().toISOString();

    const { error } = await sb.from('deliveries').update(patch).eq('id',id);
    if(error) throw error;

    // save truck rows from the DOM
    for(const el of document.querySelectorAll('[data-truck]')){
      const tid = el.dataset.truck, upd = {};
      el.querySelectorAll('[data-f]').forEach(f=>{
        let v = f.value;
        if(f.dataset.f==='load_weight') v = v===''?null:parseFloat(v);
        upd[f.dataset.f] = (v===''?null:v);
      });
      await sb.from('delivery_trucks').update(upd).eq('id',tid);
    }

    await logAudit('delivery.update','deliveries',id,d.project_id,null,{status});
    closeModal(); await loadDeliveries(); go('deliv');
    toast('保存しました','ok'); sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

async function delDelivery(id){
  if(!confirm('この出荷記録を削除しますか？')) return;
  try{
    await sb.from('deliveries').delete().eq('id',id);
    closeModal(); await loadDeliveries(); go('deliv'); toast('削除しました','ok');
  }catch(e){ toast('削除エラー: '+e.message,'err'); }
}


// ═══════════════════════════════════════════════════════════════
//  FMS — 製作管理エンジン
//  BOM取込 / 改訂差分 / 手配照合 / 製作進捗
//  ※ ロジックは実データ（Tekla BOM出力）で検証済み
// ═══════════════════════════════════════════════════════════════

// Tekla BOM の列名（ヘッダー行自動検出に使用）
const BOM_COLS = ['DWG.NO','REV.NO','REV.DATE','ITEM','ASSM-MK','SECTION','SHAPE',
  'PART-MK','PROFILE','LENGTH','TOTALQTY','WEIGHT(Kg)','PAINT','MATL',
  'FINISH','GRID','ELEV','REMARK'];

// 手配リストの列名（仕入先ごとに書式が異なるため広めに取る）
const PUR_COLS = ['PART-MK','PART_MK','PARTMK','MARK','部品番号','部材番号','マーク','記号',
  'LENGTH','長さ','長','切断長','QTY','TOTALQTY','QUANTITY','数量','員数','本数',
  'PROFILE','SECTION','断面','材質','MATL','MATERIAL'];

// ヘッダー行を先頭25行から自動検出
function detectAndParse(wb, cols){
  const known = cols || BOM_COLS;
  const ws  = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let bestRow=0, bestScore=0;
  for(let i=0;i<Math.min(raw.length,25);i++){
    const row=(raw[i]||[]).map(c=>String(c).trim().toUpperCase());
    let score=0;
    for(const c of known) if(row.includes(c.toUpperCase())) score++;
    if(score>bestScore){ bestScore=score; bestRow=i; }
  }
  const headers=(raw[bestRow]||[]).map(c=>String(c).trim());
  const data=[];
  for(let i=bestRow+1;i<raw.length;i++){
    const row=raw[i]||[];
    if(row.every(c=>String(c).trim()==='')) continue;
    const o={};
    headers.forEach((h,j)=>{ if(h) o[h]=String(row[j]??'').trim(); });
    data.push(o);
  }
  return { headerRow:bestRow+1, colsFound:bestScore, headers, data };
}

// 列名ゆらぎ吸収
function pick(row, cands){
  for(const c of cands){
    if(row[c]!==undefined && String(row[c]).trim()!=='') return String(row[c]).trim();
  }
  const keys=Object.keys(row);
  const norm=s=>s.toUpperCase().replace(/[\s._-]/g,'');
  for(const c of cands){
    const k=keys.find(k=>norm(k)===norm(c));
    if(k && String(row[k]).trim()!=='') return String(row[k]).trim();
  }
  return '';
}

const numOr = (v,d) => { const n=parseFloat(v); return isNaN(n)?d:n; };

// Tekla BOM 行 → 部材
function mapBomRow(r){
  const partMk = (r['PART-MK']||r['PART_MK']||'').trim();
  return {
    item_group:  r['ITEM']||'',
    assm_mk:     (r['ASSM-MK']||r['ASSEMBLY']||'').trim(),
    part_mk:     partMk,
    section:     r['SECTION']||'',
    shape:       r['SHAPE']||'',
    profile:     r['PROFILE']||'',
    length_mm:   numOr(r['LENGTH'], null),
    qty:         Math.round(numOr(r['TOTALQTY']||r['QTY'], 0)),
    weight_kg:   numOr(r['WEIGHT(Kg)']||r['WEIGHT'], null),
    paint:       r['PAINT']||'',
    material:    r['MATL']||r['MATERIAL']||'',
    finish:      r['FINISH']||'',
    grid:        r['GRID']||'',
    elev:        r['ELEV']||'',
    remark:      r['REMARK']||'',
    dwg_no:      r['DWG.NO']||'',
    is_consumable: partMk === '*',
  };
}

// 手配リスト行 → 手配品
function mapPurRow(r){
  return {
    part_mk:   pick(r,['PART-MK','PART_MK','PARTMK','PART MARK','MARK','部品番号','部材番号','マーク','記号','部品記号']),
    length_mm: numOr(pick(r,['LENGTH','長さ','長','切断長','LEN','L']), null),
    qty:       Math.round(numOr(pick(r,['TOTALQTY','QTY','QUANTITY','数量','員数','本数','COUNT','個数']), 0)),
    profile:   pick(r,['PROFILE','SECTION','断面','SIZE','サイズ']),
    material:  pick(r,['MATL','MATERIAL','材質','GRADE']),
  };
}

// 複合キー — ASSM-MK + PART-MK。PART-MK 単独では一意にならない。
// ただし消耗品行（PART-MK='*'）は同一組立内に複数存在しうるため、
// 断面と長さまで含めて区別する。
const pkey = p => p.is_consumable || p.part_mk === '*'
  ? p.assm_mk + '||*||' + (p.profile||'') + '||' + (p.length_mm ?? '')
  : p.assm_mk + '||' + p.part_mk;

// ── マスターBOM ──
// 各改訂は不変。Rev N は Rev N−1 と比較し、差分を累積する。
function buildMaster(revisions){
  const mm = {};
  if(!revisions.length) return mm;

  const sorted = revisions.slice().sort((a,b)=>a.rev_index-b.rev_index);
  for(const p of (sorted[0].parts||[])){
    mm[pkey(p)] = { ...p, revHistory:[], masterStatus:'baseline' };
  }

  for(let i=1;i<sorted.length;i++){
    const prev = sorted[i-1].parts||[], curr = sorted[i].parts||[];
    const rl = 'Rev '+sorted[i].rev_index;
    const pm={}, cm={};
    prev.forEach(p=>pm[pkey(p)]=p);
    curr.forEach(p=>cm[pkey(p)]=p);

    // 追加
    for(const [k,p] of Object.entries(cm)){
      if(!pm[k]){
        if(!mm[k]) mm[k]={ ...p, revHistory:[] };
        mm[k].revHistory.push({ rev:rl, status:'added', changes:[] });
        mm[k].masterStatus='added';
        Object.assign(mm[k], p);
      }
    }
    // 削除
    for(const [k,p] of Object.entries(pm)){
      if(!cm[k]){
        if(!mm[k]) mm[k]={ ...p, revHistory:[] };
        mm[k].revHistory.push({ rev:rl, status:'removed', changes:[] });
        mm[k].masterStatus='removed';
      }
    }
    // 変更 — 方向まで報告する
    for(const [k,c] of Object.entries(cm)){
      if(!pm[k]) continue;
      const p=pm[k], ch=[];
      const pq=p.qty||0, cq=c.qty||0;
      if(pq!==cq) ch.push({field:'員数',type:cq>pq?'increased':'decreased',from:pq,to:cq});
      const pl=p.length_mm||0, cl=c.length_mm||0;
      if(pl!==cl) ch.push({field:'長さ',type:cl>pl?'increased':'decreased',from:pl,to:cl});
      for(const [f,lbl] of [['profile','断面'],['material','材質'],['shape','形状'],['weight_kg','重量']]){
        if(String(p[f]??'')!==String(c[f]??'')) ch.push({field:lbl,type:'changed',from:p[f]??'—',to:c[f]??'—'});
      }
      if(ch.length){
        if(!mm[k]) mm[k]={ ...p, revHistory:[] };
        mm[k].revHistory.push({ rev:rl, status:'changed', changes:ch });
        if(mm[k].masterStatus!=='removed') mm[k].masterStatus='changed';
        Object.assign(mm[k], c);
      } else if(mm[k]) Object.assign(mm[k], c);
    }
  }
  return mm;
}

// ── 手配照合・充当 ──
// 同一 PART-MK は複数の組立にまたがる。
// 手配数が不足する場合、ASSM-MK の昇順に充当する。
// 均等配分すると全組立が未完になるため、若い組立から満たす。
function buildPurchaseStatus(master, purItems){
  const statusMap = {};

  // 手配プール  partMk → 長さ → 数量
  const pool = {};
  for(const it of purItems){
    const mk = String(it.part_mk||'').trim();
    if(!mk || mk==='*') continue;
    const L = String(it.length_mm ?? 0);
    (pool[mk] = pool[mk] || {});
    pool[mk][L] = (pool[mk][L]||0) + (it.qty||0);
  }

  // 需要を PART-MK 単位にまとめる
  const demand = {};
  for(const [key,p] of Object.entries(master)){
    const mk = String(p.part_mk||'').trim();
    if(!mk || mk==='*') continue;          // 消耗品は対象外
    if(p.is_consumable) continue;
    if(p.masterStatus==='removed') continue; // 削除部材は手配不要
    (demand[mk] = demand[mk] || []).push({
      key, assm_mk:p.assm_mk, length_mm:p.length_mm||0, qty:p.qty||0, profile:p.profile||''
    });
  }

  const summary=[]; let ok=0, short=0, warn=0, none=0;

  for(const [mk, items] of Object.entries(demand)){
    // ASSM-MK 昇順（数値混在に対応）
    items.sort((a,b)=>String(a.assm_mk).localeCompare(String(b.assm_mk),'ja',{numeric:true,sensitivity:'base'}));

    const required = items.reduce((a,i)=>a+i.qty,0);
    const lengths  = pool[mk];

    if(!lengths){
      items.forEach(it=>{
        statusMap[it.key]={ status:'none', allocated:0, required:it.qty,
          shortfall:it.qty, remark:'未手配' };
      });
      none += items.length;
      summary.push({ part_mk:mk, profile:items[0].profile, bomLength:items[0].length_mm,
        purLength:'—', required, purchased:0, shortfall:required, leftover:0,
        status:'none', assemblies:items.length });
      continue;
    }

    const remain = { ...lengths };
    const purchased = Object.values(lengths).reduce((a,v)=>a+v,0);
    let lenWarn=false;

    for(const it of items){
      const L = String(it.length_mm||0);
      if(remain[L] > 0){
        const give = Math.min(remain[L], it.qty);
        remain[L] -= give;
        if(give >= it.qty){
          statusMap[it.key]={ status:'ok', allocated:give, required:it.qty,
            shortfall:0, remark:'照合OK' };
          ok++;
        } else {
          const sh = it.qty - give;
          statusMap[it.key]={ status:'short', allocated:give, required:it.qty,
            shortfall:sh, remark:`不足 ${sh}本（手配 ${give}/${it.qty}）` };
          short++;
        }
      } else {
        const avail = Object.keys(remain).filter(k=>remain[k]>0);
        if(avail.length){
          lenWarn = true;
          statusMap[it.key]={ status:'len_warn', allocated:0, required:it.qty,
            shortfall:it.qty, remark:`⚠ 長さ相違 BOM:${it.length_mm} / 手配:${avail.join(', ')}` };
          warn++;
        } else {
          statusMap[it.key]={ status:'short', allocated:0, required:it.qty,
            shortfall:it.qty, remark:`不足 ${it.qty}本（手配 0/${it.qty}）` };
          short++;
        }
      }
    }

    const leftover = Object.values(remain).reduce((a,v)=>a+v,0);
    const shortfall = Math.max(0, required - purchased);
    let st = 'ok';
    if(lenWarn)        st='warn';
    else if(shortfall) st='short';
    else if(leftover)  st='over';

    summary.push({ part_mk:mk, profile:items[0].profile, bomLength:items[0].length_mm,
      purLength:Object.keys(lengths).join(', '), required, purchased, shortfall,
      leftover, status:st, assemblies:items.length });
  }

  // BOM に存在しない手配品
  const extras=[];
  for(const mk of Object.keys(pool)){
    if(!demand[mk]){
      const t = Object.values(pool[mk]).reduce((a,v)=>a+v,0);
      extras.push({ part_mk:mk, qty:t, lengths:Object.keys(pool[mk]).join(', ') });
    }
  }

  summary.sort((a,b)=>String(a.part_mk).localeCompare(String(b.part_mk),'ja',{numeric:true}));
  return { statusMap, summary, extras, counts:{ ok, short, warn, none } };
}

// ── 製作進捗 ──
function progOf(zoneId, assmMk, partMk){
  const m = PROGRESS[zoneId] || {};
  return m[assmMk+'||'+partMk] || {};
}
function progPct(zoneId, assmMk, partMk){
  const st = progOf(zoneId, assmMk, partMk);
  const done = PROC_STEPS.filter(s=>st[s.step_code]).length;
  return PROC_STEPS.length ? Math.round(done/PROC_STEPS.length*100) : 0;
}

// ═══════════════════════════════════════════════════════════════
//  FMS — 製作管理  画面
// ═══════════════════════════════════════════════════════════════
// ── 材種分類 ──
// Tekla の SHAPE を第一根拠にし、無い場合は PROFILE から推定する。
// 仕入先が分かれるため、分類は発注単位と一致させる。
const MAT_CATS = [
  { key:'shape', ja:'形鋼',     colour:'#2563eb' },
  { key:'plate', ja:'切り板',   colour:'#16a34a' },
  { key:'bolt',  ja:'Bolt',     colour:'#d97706' },
  { key:'brace', ja:'Brace',    colour:'#7c3aed' },
  { key:'other', ja:'その他',   colour:'#64748b' },
];

function matCat(p){
  const sh = (p.shape||'').toUpperCase().trim();
  const pf = (p.profile||'').toUpperCase().trim();
  const mk = (p.part_mk||'').trim();

  // ボルト — 部品マーク '*' か SHAPE=BOLT、または M16- 形式の断面
  if(mk === '*' || p.is_consumable) return 'bolt';
  if(sh === 'BOLT' || sh === 'BL')  return 'bolt';
  if(/^M\d+\s*-/.test(pf))          return 'bolt';

  // ブレース — SHAPE=TB（ターンバックル）、または断面が TB/BR/丸鋼
  if(sh === 'TB' || sh === 'BR')    return 'brace';
  if(/^(TB|BR|ブレース|φ|Φ)/.test(pf)) return 'brace';

  // 切り板 — SHAPE=PL、または断面が PL 始まり
  if(sh === 'PL' || sh === 'PLT')   return 'plate';
  if(/^PL/.test(pf))                return 'plate';

  // 形鋼 — H, C, L, I, T, CT, FB, 角パイプ等
  if(/^(H|C|L|I|T|CT|FB|BH|RH|P|STKR|□|\[)/.test(pf)) return 'shape';
  if(sh && ['H','C','L','I','T','CT','FB'].includes(sh)) return 'shape';

  return pf ? 'other' : 'other';
}

// 断面サイズの正規化キー — H200*200*8*13 → H200
// 「H200 を含むもの全て」で拾えるようにする
function profileBase(profile){
  const pf = String(profile||'').trim().toUpperCase();
  if(!pf) return '';
  const m = pf.match(/^([A-Zａ-ｚ□\[]+)\s*(\d+)/);
  return m ? (m[1]+m[2]) : pf.split('*')[0].split('-')[0];
}

// 断面ごとの集計 — 総本数・総長さ・総重量
function profileSummary(parts){
  const g = {};
  parts.forEach(p=>{
    const key = p.profile || '(断面なし)';
    const r = g[key] = g[key] || {
      profile:key, base:profileBase(key), cat:matCat(p),
      rows:0, qty:0, lengthMm:0, weightKg:0, assemblies:new Set()
    };
    const q = p.qty || 0;
    r.rows++; r.qty += q;
    r.lengthMm += (p.length_mm||0) * q;
    r.weightKg += (p.weight_kg||0) * q;
    r.assemblies.add(p.assm_mk);
  });
  return Object.values(g).sort((a,b)=>b.weightKg-a.weightKg);
}

let FMS = { zone:null, tab:'master', filter:'all', cat:'', prof:'' };

// 出荷管理などで使う「工区だけ」の一覧。先行発注ブロックは含めない。
function allZones(){
  const out=[];
  PROJECTS.forEach(p=>p.subs.forEach(s=>s.zones.forEach(z=>
    out.push({ z, s, p, label:`${p.project_code} ${p.name} › ${s.name} › ${z.name}` }))));
  return out;
}

// FMS の対象一覧 — 工区に加えて、先行発注ブロックも独立した対象として並べる。
// id は「所有者キー」。工区ならその id、ブロックならブロックの id。
// BOM_REVS / PUR_ITEMS / PROGRESS はこのキーで引ける。
function fmsTargets(){
  const out=[];
  PROJECTS.forEach(p=>p.subs.forEach(s=>s.zones.forEach(z=>{
    out.push({ id:z.id, work_zone_id:z.id, block_id:null, z, s, p, block:null,
               label:`${p.project_code} ${p.name} › ${s.name} › ${z.name}` });
    (z.blocks||[]).forEach(bk=>
      out.push({ id:bk.id, work_zone_id:z.id, block_id:bk.id, z, s, p, block:bk,
                 label:`　└ ${p.project_code} ${s.name} › ${z.name} › 先行 ${bk.name}` }));
  })));
  return out;
}

function secBadge(sec){
  const u=(sec||'').toUpperCase();
  if(u==='MAIN') return `<span class="pill pill-info" style="font-size:10px">MAIN</span>`;
  if(sec)        return `<span class="pill pill-grey" style="font-size:10px">${esc(sec)}</span>`;
  return '—';
}
function purMark(ps){
  if(!ps) return '<span class="muted">–</span>';
  if(ps.status==='ok')       return '<span style="color:var(--ok);font-weight:700">✓</span>';
  if(ps.status==='short')    return '<span style="color:var(--warn);font-weight:700">△</span>';
  if(ps.status==='len_warn') return '<span style="color:var(--danger);font-weight:700">!</span>';
  return '<span class="muted">–</span>';
}
function revBadges(p){
  if(!p.revHistory || !p.revHistory.length) return '<span class="muted" style="font-size:11px">変更なし</span>';
  return p.revHistory.map(h=>{
    if(h.status==='added')   return `<span class="pill pill-ok" style="font-size:10px">${h.rev} 追加</span>`;
    if(h.status==='removed') return `<span class="pill pill-risk" style="font-size:10px">${h.rev} 削除</span>`;
    return h.changes.map(c=>{
      const ar = c.type==='increased'?'↑':c.type==='decreased'?'↓':'→';
      return `<span class="pill pill-warn" style="font-size:10px">${h.rev} ${c.field} ${ar} ${c.from}→${c.to}</span>`;
    }).join(' ');
  }).join(' ');
}
function rowCls(p){
  return p.masterStatus==='added'?'style="background:var(--ok-l)"'
       : p.masterStatus==='removed'?'style="background:var(--danger-l);opacity:.75"'
       : p.masterStatus==='changed'?'style="background:var(--warn-l)"' : '';
}

// ── マスターBOM ──
function fabMaster(master, pur, hasPur){
  const all = Object.values(master);
  let arr = all;
  const f = FMS.filter;
  if(f==='added')    arr=arr.filter(p=>p.masterStatus==='added');
  if(f==='removed')  arr=arr.filter(p=>p.masterStatus==='removed');
  if(f==='changed')  arr=arr.filter(p=>p.masterStatus==='changed');
  if(f==='main')     arr=arr.filter(p=>(p.section||'').toUpperCase()==='MAIN');
  if(f==='pur_ok')   arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='ok');
  if(f==='pur_short')arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='short');
  if(f==='pur_warn') arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='len_warn');
  if(f==='pur_none') arr=arr.filter(p=>(pur.statusMap[pkey(p)]||{}).status==='none');

  // 材種フィルタ（仕入先別）
  if(FMS.cat)  arr = arr.filter(p=>matCat(p)===FMS.cat);
  // 断面サイズフィルタ — 部分一致（H200 で H200*200*8*13 等をすべて拾う）
  if(FMS.prof){
    const q = FMS.prof.toUpperCase();
    arr = arr.filter(p=>String(p.profile||'').toUpperCase().includes(q));
  }

  arr.sort((a,b)=>String(a.assm_mk).localeCompare(String(b.assm_mk),'ja',{numeric:true})
                || String(a.part_mk).localeCompare(String(b.part_mk),'ja',{numeric:true}));

  const chip=(k,l,c)=>`<button class="btn btn-s ${FMS.filter===k?'btn-p':''}"
    onclick="FMS.filter='${k}';go('fab')">${l}${c!==undefined?` (${c})`:''}</button>`;

  // 材種別の件数
  const catCount = {};
  all.forEach(p=>{ const c=matCat(p); catCount[c]=(catCount[c]||0)+1; });

  // 断面候補（現在の材種フィルタ内）
  const profPool = (FMS.cat ? all.filter(p=>matCat(p)===FMS.cat) : all);
  const profList = [...new Set(profPool.map(p=>p.profile).filter(Boolean))]
    .sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}));

  // 絞り込み結果の集計
  const tot = arr.reduce((a,p)=>{
    const q=p.qty||0;
    a.rows++; a.qty+=q;
    a.len += (p.length_mm||0)*q;
    a.wt  += (p.weight_kg||0)*q;
    a.asm.add(p.assm_mk);
    return a;
  }, {rows:0,qty:0,len:0,wt:0,asm:new Set()});

  const filtered = FMS.cat || FMS.prof;

  return `
  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap">
    ${chip('all','すべて')}
    ${chip('main','MAINのみ')}
    ${chip('added','＋追加',all.filter(p=>p.masterStatus==='added').length)}
    ${chip('removed','−削除',all.filter(p=>p.masterStatus==='removed').length)}
    ${chip('changed','△変更',all.filter(p=>p.masterStatus==='changed').length)}
    ${hasPur?`${chip('pur_ok','✓手配済',pur.counts.ok)}${chip('pur_short','△不足',pur.counts.short)}${chip('pur_warn','!長さ相違',pur.counts.warn)}${chip('pur_none','未手配',pur.counts.none)}`:''}
  </div>

  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:11px;font-weight:700">材種:</span>
    <button class="btn btn-s ${!FMS.cat?'btn-p':''}" onclick="FMS.cat='';FMS.prof='';go('fab')">すべて</button>
    ${MAT_CATS.filter(c=>catCount[c.key]).map(c=>`
      <button class="btn btn-s ${FMS.cat===c.key?'btn-p':''}" onclick="FMS.cat='${c.key}';FMS.prof='';go('fab')">
        <span style="display:inline-block;width:9px;height:9px;background:${c.colour};border-radius:2px"></span>
        ${c.ja} (${catCount[c.key]})</button>`).join('')}

    <span class="muted" style="font-size:11px;font-weight:700;margin-left:10px">断面:</span>
    <select onchange="FMS.prof=this.value;go('fab')"
      style="border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px;min-width:190px">
      <option value="">すべての断面</option>
      ${profList.map(pf=>`<option value="${esc(pf)}" ${FMS.prof===pf?'selected':''}>${esc(pf)}</option>`).join('')}
    </select>
    <input id="profQ" value="${esc(FMS.prof)}" placeholder="例: H200 で部分一致"
      onkeydown="if(event.key==='Enter'){FMS.prof=this.value.trim();go('fab')}"
      style="border:1px solid var(--border2);border-radius:5px;padding:5px 9px;font-size:12px;width:150px">
    ${FMS.prof?`<button class="btn btn-s btn-d" onclick="FMS.prof='';go('fab')">解除</button>`:''}
    <div style="flex:1"></div>
    <button class="btn btn-s ${FMS.tab==='prof'?'btn-p':''}" onclick="FMS.tab='prof';go('fab')">断面集計を見る</button>
  </div>

  ${filtered?`
  <div class="card-b" style="padding:11px 16px;border-bottom:1px solid var(--border);background:var(--accent-l)">
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:baseline">
      <b style="font-size:12.5px">${FMS.cat?(MAT_CATS.find(c=>c.key===FMS.cat)||{}).ja:''}${FMS.prof?(FMS.cat?' / ':'')+esc(FMS.prof):''} の集計</b>
      <span><span class="muted" style="font-size:11px">部材行</span> <b class="mono">${tot.rows}</b></span>
      <span><span class="muted" style="font-size:11px">総本数</span> <b class="mono">${tot.qty}</b></span>
      <span><span class="muted" style="font-size:11px">総長さ</span> <b class="mono">${(tot.len/1000).toFixed(1)}</b> m</span>
      <span><span class="muted" style="font-size:11px">総重量</span> <b class="mono">${tot.wt.toFixed(1)}</b> kg
        <span class="muted">(${(tot.wt/1000).toFixed(2)} t)</span></span>
      <span><span class="muted" style="font-size:11px">使用組立</span> <b class="mono">${tot.asm.size}</b></span>
    </div>
  </div>`:''}

  <div style="overflow-x:auto;max-height:58vh;overflow-y:auto">
  <table>
    <thead><tr>
      <th>組立マーク</th><th>区分</th><th>材種</th><th>部品マーク</th><th>断面</th>
      <th>長さ</th><th>員数</th><th>重量</th>
      ${hasPur?'<th>手配</th><th>備考</th>':''}
      <th>改訂状況</th>
    </tr></thead>
    <tbody>${arr.length?arr.map(p=>{
      const ps = pur.statusMap[pkey(p)];
      const c  = MAT_CATS.find(x=>x.key===matCat(p)) || MAT_CATS[4];
      return `<tr ${rowCls(p)}>
        <td class="mono">${esc(p.assm_mk)}</td>
        <td>${secBadge(p.section)}</td>
        <td><span class="pill" style="font-size:10px;background:${c.colour}1a;color:${c.colour}">${c.ja}</span></td>
        <td class="mono"><b>${esc(p.part_mk)}</b></td>
        <td style="font-size:12px">${esc(p.profile||'—')}</td>
        <td class="mono">${p.length_mm??'—'}</td>
        <td class="mono">${p.qty??'—'}</td>
        <td class="mono">${p.weight_kg??'—'}</td>
        ${hasPur?`<td style="text-align:center">${purMark(ps)}</td>
          <td style="font-size:11px;color:${ps&&ps.status==='ok'?'var(--ok)':ps&&ps.status==='short'?'var(--warn)':ps&&ps.status==='len_warn'?'var(--danger)':'var(--muted)'}">${esc(ps?ps.remark:'—')}</td>`:''}
        <td>${revBadges(p)}</td>
      </tr>`;
    }).join(''):`<tr><td colspan="${hasPur?11:9}" class="empty">該当する部材がありません</td></tr>`}</tbody>
  </table></div>`;
}

// ── 断面集計タブ ── 発注単位のまとめ

  const gt = sum.reduce((a,r)=>({qty:a.qty+r.qty, len:a.len+r.lengthMm, wt:a.wt+r.weightKg}),
                        {qty:0,len:0,wt:0});

  return `
  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:11px;font-weight:700">材種:</span>

    ${MAT_CATS.filter(c=>catCount[c.key]).map(c=>`
      <button class="btn btn-s ${FMS.cat===c.key?'btn-p':''}" onclick="FMS.cat='${c.key}';go('fab')">

  <div style="overflow-x:auto;max-height:62vh;overflow-y:auto">
  <table>
    <thead><tr><th>断面</th><th>材種</th><th>部材行</th><th>総本数</th>
      <th>総長さ (m)</th><th>総重量 (kg)</th><th>使用組立数</th><th></th></tr></thead>
    <tbody>${sum.length?sum.map(r=>{
      const c = MAT_CATS.find(x=>x.key===r.cat) || MAT_CATS[4];
      return `<tr>
        <td class="mono"><b>${esc(r.profile)}</b></td>

  <div class="card-b" style="padding-top:10px"><p class="hint">

// ── 製作進捗 ──
function fabProgress(master, pur, hasPur){
  let arr = Object.values(master).filter(p=>!p.is_consumable && p.masterStatus!=='removed');
  if(FMS.filter==='main')       arr=arr.filter(p=>(p.section||'').toUpperCase()==='MAIN');
  if(FMS.filter==='incomplete') arr=arr.filter(p=>progPct(FMS.zone,p.assm_mk,p.part_mk)<100);

  arr.sort((a,b)=>String(a.assm_mk).localeCompare(String(b.assm_mk),'ja',{numeric:true})
                || String(a.part_mk).localeCompare(String(b.part_mk),'ja',{numeric:true}));

  const done = arr.filter(p=>progPct(FMS.zone,p.assm_mk,p.part_mk)===100).length;
  const chip=(k,l)=>`<button class="btn btn-s ${FMS.filter===k?'btn-p':''}" onclick="FMS.filter='${k}';go('fab')">${l}</button>`;

  return `
  <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;align-items:center">
    ${chip('all','すべて')}${chip('main','MAINのみ')}${chip('incomplete','未完了')}
    <div style="flex:1"></div>
    <span class="muted" style="font-size:12px">完了 <b class="mono">${done}</b> / ${arr.length}</span>
  </div>
  <div class="card-b" style="padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg2)">
    <span class="muted" style="font-size:11px;font-weight:700;margin-right:8px">一括チェック（表示中の部材）</span>
    ${PROC_STEPS.map(s=>`<label class="chk" style="display:inline-flex;margin-right:10px">
      <input type="checkbox" onchange="bulkStep('${s.step_code}',this.checked)">${esc(s.label_ja)}</label>`).join('')}
  </div>
  <div style="overflow-x:auto;max-height:58vh;overflow-y:auto">
  <table>
    <thead><tr><th>組立マーク</th><th>区分</th><th>部品マーク</th><th>断面</th><th>長さ</th><th>員数</th>
      ${hasPur?'<th>手配</th>':''}<th>工程</th><th>進捗</th></tr></thead>
    <tbody>${arr.length?arr.map(p=>{
      const pct = progPct(FMS.zone,p.assm_mk,p.part_mk);
      const st  = progOf(FMS.zone,p.assm_mk,p.part_mk);
      const ps  = pur.statusMap[pkey(p)];
      return `<tr>
        <td class="mono">${esc(p.assm_mk)}</td>
        <td>${secBadge(p.section)}</td>
        <td class="mono"><b>${esc(p.part_mk)}</b></td>
        <td style="font-size:12px">${esc(p.profile||'—')}</td>
        <td class="mono">${p.length_mm??'—'}</td>
        <td class="mono">${p.qty??'—'}</td>
        ${hasPur?`<td style="text-align:center">${purMark(ps)}</td>`:''}
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">
          ${PROC_STEPS.map(s=>{
            const on = !!st[s.step_code];
            return `<label class="proc ${on?'on':''}" onclick="event.preventDefault();toggleStep('${esc(p.assm_mk)}','${esc(p.part_mk)}','${s.step_code}',${!on})">
              <input type="checkbox" ${on?'checked':''} tabindex="-1"><span>${esc(s.label_ja)}</span></label>`;
          }).join('')}
        </div></td>
        <td><div class="prog2"><div class="prog2-bar"><div class="prog2-fill" style="width:${pct}%"></div></div>
          <span class="mono" style="font-size:11px">${pct}%</span></div></td>
      </tr>`;
    }).join(''):`<tr><td colspan="${hasPur?9:8}" class="empty">該当する部材がありません</td></tr>`}</tbody>
  </table></div>`;
}

function readXlsx(file, cb){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb = file.name.toLowerCase().endsWith('.csv')
        ? XLSX.read(e.target.result,{type:'string'})
        : XLSX.read(e.target.result,{type:'array'});
      cb(null, wb);
    }catch(err){ cb(err); }
  };
  if(file.name.toLowerCase().endsWith('.csv')) r.readAsText(file); else r.readAsArrayBuffer(file);
}

// ── BOM 取込 ──
function importBom(){
  const zones = fmsTargets();
  const cur = zones.find(x=>x.id===FMS.zone);
  const revs = (BOM_REVS[FMS.zone]||[]);
  const next = revs.length;
  window._BOM = null;
  openModal(`<div class="modal" style="width:620px">
    <div class="modal-h"><h3>BOM取込 — Rev ${next}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="inline-note" style="margin-bottom:14px">
        <b>${esc(cur?cur.label:'')}</b><br>
        ${next===0 ? 'Rev 0（基準）として取り込みます。'
                   : `Rev ${next} として取り込み、Rev ${next-1} との差分を自動判定します。`}
      </div>
      <div class="dz" id="bomDz">
        <div style="font-size:24px;margin-bottom:6px">📄</div>
        <div>クリックまたはドラッグで Tekla BOM を選択</div>
        <div style="font-size:10.5px;color:var(--faint);margin-top:3px">xlsx / xls / csv — ヘッダー行は自動検出</div>
      </div>
      <input type="file" id="bomFi" accept=".xlsx,.xls,.csv" style="display:none">
      <div id="bomInfo" style="display:none"></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-p" onclick="saveBom()">取込</button></div>
  </div>`);
  const dz=$('bomDz'), fi=$('bomFi');
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='var(--accent)';};
  dz.ondragleave=()=>dz.style.borderColor='';
  dz.ondrop=e=>{e.preventDefault();dz.style.borderColor='';if(e.dataTransfer.files[0])bomLoad(e.dataTransfer.files[0]);};
  fi.onchange=e=>{if(e.target.files[0])bomLoad(e.target.files[0]);};
}

function bomLoad(file){
  readXlsx(file,(err,wb)=>{
    if(err){ toast('読込エラー: '+err.message,'err'); return; }
    const r = detectAndParse(wb, BOM_COLS);
    const clean = r.data.filter(x=>(x['ASSM-MK']||x['PART-MK']));
    const parts = clean.map(mapBomRow).filter(p=>p.assm_mk && p.part_mk);
    window._BOM = { file:file.name, res:r, parts };

    // 実部材（消耗品以外）で複合キーが重複していないか確認
    const seen = {}, dupes = [];
    parts.forEach(p=>{
      if(p.is_consumable) return;
      const k = p.assm_mk+'||'+p.part_mk;
      if(seen[k]) { if(dupes.length<5) dupes.push(k); } else seen[k]=1;
    });
    window._BOM.dupes = dupes;

    const ok = r.colsFound>=3 && parts.length>0;
    const dz=$('bomDz');
    dz.style.background = ok?'var(--ok-l)':'var(--warn-l)';
    dz.style.borderColor= ok?'var(--ok)':'var(--warn)';
    dz.innerHTML = `<div style="font-size:24px;margin-bottom:6px">${ok?'✅':'⚠️'}</div>
      <div><b>${esc(file.name)}</b></div>
      <div style="font-size:11px;margin-top:3px">${parts.length} 部材 · ヘッダー行 ${r.headerRow} · 認識列 ${r.colsFound}</div>`;

    // preview diff against previous revision
    const revs=(BOM_REVS[FMS.zone]||[]).slice().sort((a,b)=>a.rev_index-b.rev_index);
    let html = `<div class="hint" style="margin-top:10px;word-break:break-all">${r.headers.filter(h=>h).join(' · ')}</div>`;
    const cons = parts.filter(p=>p.is_consumable).length;
    if(cons) html += `<div class="hint" style="margin-top:4px">うち消耗品行（ボルト等）: ${cons}</div>`;
    if(window._BOM.dupes.length) html += `<div style="margin-top:10px;padding:10px 12px;background:var(--warn-l);border-radius:6px;font-size:12px">
      <b style="color:var(--warn)">⚠ 組立マーク＋部品マークが重複している行があります</b><br>
      <span class="mono" style="font-size:11px">${window._BOM.dupes.map(esc).join('<br>')}</span><br>
      マスターBOMでは後の行が優先されます。BOMの確認をおすすめします。</div>`;
    if(revs.length){
      const sim = buildMaster(revs.concat([{ rev_index:revs.length, parts }]));
      const a=Object.values(sim);
      const ad=a.filter(p=>p.masterStatus==='added').length;
      const rm=a.filter(p=>p.masterStatus==='removed').length;
      const ch=a.filter(p=>p.masterStatus==='changed').length;
      html += `<div style="margin-top:12px;padding:11px 13px;background:var(--bg2);border-radius:6px">
        <b style="font-size:12px">差分プレビュー（Rev ${revs.length-1} との比較）</b>
        <div style="margin-top:6px;display:flex;gap:16px;font-size:13px">
          <span><b style="color:var(--ok);font-family:var(--mono)">${ad}</b> 追加</span>
          <span><b style="color:var(--danger);font-family:var(--mono)">${rm}</b> 削除</span>
          <span><b style="color:var(--warn);font-family:var(--mono)">${ch}</b> 変更</span>
        </div></div>`;
    }
    const info=$('bomInfo'); info.style.display='block'; info.innerHTML=html;
  });
}

async function saveBom(){
  const B = window._BOM;
  if(!B || !B.parts.length){ toast('BOMファイルを選択してください','err'); return; }
  const cur = fmsTarget(FMS.zone);
  if(!cur){ toast('対象が選ばれていません','err'); return; }
  let revId = null, revIndex = 0;
  try{
    sync('取込中…');

    // 改訂番号はDBから採番する（画面の状態に依存しない）
    const { data:existing, error:eq } = await sb.from('bom_revisions')
      .select('rev_index').eq('owner_id', FMS.zone)
      .order('rev_index',{ascending:false}).limit(1);
    if(eq) throw eq;
    revIndex = existing && existing.length ? existing[0].rev_index + 1 : 0;

    const { data:rev, error } = await sb.from('bom_revisions').insert({
      work_zone_id:cur.work_zone_id, block_id:cur.block_id, project_id:cur.p.id, rev_index:revIndex,
      rev_date:fmt(new Date()), source_filename:B.file,
      header_row:B.res.headerRow, cols_found:B.res.colsFound,
      part_count:B.parts.length, imported_by:ME.id
    }).select().single();
    if(error) throw error;
    revId = rev.id;

    // 部材は分割して投入（数千行になるため）
    const rows = B.parts.map(p=>({ ...p, revision_id:rev.id,
      work_zone_id:cur.work_zone_id, block_id:cur.block_id, project_id:cur.p.id }));
    for(let i=0;i<rows.length;i+=500){
      const { error:e2 } = await sb.from('bom_parts').insert(rows.slice(i,i+500));
      if(e2) throw e2;
      sync(`取込中… ${Math.min(i+500,rows.length)}/${rows.length}`);
    }
    await logAudit('bom.import','bom_revisions',rev.id,cur.p.id,null,
      { rev:revIndex, parts:B.parts.length, file:B.file });
    closeModal(); await loadFms(); go('fab');
    toast(`Rev ${revIndex} を取込みました（${B.parts.length} 部材）`,'ok');
    sync('同期済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){
    // 途中で失敗した場合、改訂行が残らないよう取り消す
    if(revId){
      try{ await sb.from('bom_revisions').delete().eq('id', revId); }catch(_){}
    }
    toast('取込エラー: '+e.message,'err');
    sync('エラー');
  }
}

async function delLastRev(){
  const revs=(BOM_REVS[FMS.zone]||[]).slice().sort((a,b)=>a.rev_index-b.rev_index);
  if(!revs.length) return;
  const last=revs[revs.length-1];
  if(!confirm(`Rev ${last.rev_index} を取消しますか？\n部材データも削除されます。`)) return;
  try{
    await sb.from('bom_revisions').delete().eq('id',last.id);
    await loadFms(); go('fab'); toast(`Rev ${last.rev_index} を取消しました`,'ok');
  }catch(e){ toast('削除エラー: '+e.message,'err'); }
}

function purLoad(file){
  readXlsx(file,(err,wb)=>{
    if(err){ toast('読込エラー: '+err.message,'err'); return; }
    const r = detectAndParse(wb, PUR_COLS);
    const items = r.data.map(mapPurRow).filter(x=>x.part_mk && x.part_mk!=='*');
    window._PUR = { file:file.name, res:r, items };

    const dz=$('purDz'), ok=items.length>0;
    dz.style.background = ok?'var(--ok-l)':'var(--warn-l)';
    dz.style.borderColor= ok?'var(--ok)':'var(--warn)';
    dz.innerHTML=`<div style="font-size:24px;margin-bottom:6px">${ok?'✅':'⚠️'}</div>
      <div><b>${esc(file.name)}</b></div>
      <div style="font-size:11px;margin-top:3px">${items.length} 行 · ヘッダー行 ${r.headerRow}</div>`;

    const info=$('purInfo'); info.style.display='block';
    if(!items.length){
      info.innerHTML=`<div style="margin-top:12px;padding:11px 13px;background:var(--warn-l);border-radius:6px;font-size:12.5px">
        部品マーク列が認識できませんでした。認識可能な列名：<br>
        <span class="mono" style="font-size:11px">PART-MK / MARK / 部品番号 / 部材番号 / マーク / 記号</span></div>`;
      return;
    }
    // dry-run match
    const revs=(BOM_REVS[FMS.zone]||[]);
    const master=buildMaster(revs);
    const dry=buildPurchaseStatus(master, items);
    const c=dry.counts;
    let html=`<div style="margin-top:12px;padding:11px 13px;background:var(--bg2);border-radius:6px">
      <b style="font-size:12px">照合プレビュー</b>
      <div style="margin-top:6px;display:flex;gap:16px;font-size:13px;flex-wrap:wrap">
        <span><b style="color:var(--ok);font-family:var(--mono)">${c.ok}</b> 照合OK</span>
        <span><b style="color:var(--warn);font-family:var(--mono)">${c.short}</b> 数量不足</span>
        <span><b style="color:var(--danger);font-family:var(--mono)">${c.warn}</b> 長さ相違</span>
        <span><b style="color:var(--muted);font-family:var(--mono)">${c.none}</b> 未手配</span>
      </div></div>`;
    const warns=dry.summary.filter(s=>s.status==='warn');
    const shorts=dry.summary.filter(s=>s.status==='short');
    if(warns.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--danger-l);border-radius:6px;font-size:12px">
      <b style="color:var(--danger)">⚠ 長さ相違</b><br>${warns.slice(0,5).map(w=>
        `${esc(w.part_mk)} — BOM:${w.bomLength} / 手配:${esc(String(w.purLength))}`).join('<br>')}
      ${warns.length>5?`<br>…他 ${warns.length-5} 件`:''}</div>`;
    if(shorts.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--warn-l);border-radius:6px;font-size:12px">
      <b style="color:var(--warn)">△ 数量不足（組立マーク昇順に充当）</b><br>${shorts.slice(0,5).map(w=>
        `${esc(w.part_mk)} — 必要 ${w.required} / 手配 ${w.purchased} → 不足 ${w.shortfall}`).join('<br>')}
      ${shorts.length>5?`<br>…他 ${shorts.length-5} 件`:''}</div>`;
    if(dry.extras.length) html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--purple-l);border-radius:6px;font-size:12px">
      <b style="color:var(--purple)">BOM外の手配品 ${dry.extras.length} 件</b><br>
      ${dry.extras.slice(0,6).map(e=>esc(e.part_mk)+`(${e.qty})`).join(' · ')}</div>`;
    if(!warns.length && !shorts.length && !dry.extras.length)
      html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--ok-l);border-radius:6px;font-size:12.5px">
        <b style="color:var(--ok)">✅ すべて正しく照合されました</b></div>`;
    info.innerHTML=html;
  });
}

async function savePur(){
  const P=window._PUR;
  if(!P || !P.items.length){ toast('手配リストを選択してください','err'); return; }
  const cur = fmsTarget(FMS.zone);
  if(!cur){ toast('対象が選ばれていません','err'); return; }
  try{
    sync('保存中…');
    // 取込は置換 — 既存バッチを削除
    const old = PUR_BATCHES[FMS.zone]||[];
    for(const b of old) await sb.from('purchase_batches').delete().eq('id',b.id);

    const { data:batch, error } = await sb.from('purchase_batches').insert({
      work_zone_id:cur.work_zone_id, block_id:cur.block_id, project_id:cur.p.id, batch_no:1,
      source_filename:P.file, import_mode:'replace',
      row_count:P.items.length, imported_by:ME.id
    }).select().single();
    if(error) throw error;

    const rows=P.items.map(i=>({ ...i, batch_id:batch.id }));
    for(let i=0;i<rows.length;i+=500){
      const { error:e2 } = await sb.from('purchase_items').insert(rows.slice(i,i+500));
      if(e2) throw e2;
    }
    await logAudit('purchase.import','purchase_batches',batch.id,cur.p.id,null,
      { rows:P.items.length, file:P.file });
    closeModal(); await loadFms(); FMS.tab='pur'; go('fab');
    toast(`手配リストを取込みました（${P.items.length} 行）`,'ok');
    sync('同期済');
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

// ── 製作進捗 ──
async function toggleStep(assmMk, partMk, stepCode, on){
  const cur = fmsTarget(FMS.zone); if(!cur) return;
  const k = assmMk+'||'+partMk;
  PROGRESS[FMS.zone] = PROGRESS[FMS.zone] || {};
  PROGRESS[FMS.zone][k] = PROGRESS[FMS.zone][k] || {};
  PROGRESS[FMS.zone][k][stepCode] = on;
  go('fab');
  try{
    await sb.from('fabrication_progress').upsert({
      work_zone_id:cur.work_zone_id, block_id:cur.block_id, project_id:cur.p.id,
      assm_mk:assmMk, part_mk:partMk, step_code:stepCode,
      is_complete:on, marked_by:ME.id, marked_at:new Date().toISOString()
    }, { onConflict:'owner_id,assm_mk,part_mk,step_code' });
    sync('保存済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); }
}

// 一括チェックは「表示中の部材」にのみ適用する
async function bulkStep(stepCode, on){
  const cur = fmsTarget(FMS.zone); if(!cur) return;
  const revs=(BOM_REVS[FMS.zone]||[]);
  const master=buildMaster(revs);
  let arr=Object.values(master).filter(p=>!p.is_consumable && p.masterStatus!=='removed');
  if(FMS.filter==='main')       arr=arr.filter(p=>(p.section||'').toUpperCase()==='MAIN');
  if(FMS.filter==='incomplete') arr=arr.filter(p=>progPct(FMS.zone,p.assm_mk,p.part_mk)<100);
  if(!arr.length) return;

  PROGRESS[FMS.zone] = PROGRESS[FMS.zone] || {};
  const rows = arr.map(p=>{
    PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk] = PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk] || {};
    PROGRESS[FMS.zone][p.assm_mk+'||'+p.part_mk][stepCode] = on;
    return { work_zone_id:cur.work_zone_id, block_id:cur.block_id, project_id:cur.p.id,
      assm_mk:p.assm_mk, part_mk:p.part_mk, step_code:stepCode,
      is_complete:on, marked_by:ME.id, marked_at:new Date().toISOString() };
  });
  go('fab');
  const lbl = (PROC_STEPS.find(s=>s.step_code===stepCode)||{}).label_ja || stepCode;
  toast(`${on?'チェック':'解除'} ${lbl} — 表示中の ${rows.length} 部材`,'ok');
  try{
    sync(`保存中… 0/${rows.length}`);
    for(let i=0;i<rows.length;i+=400){
      await sb.from('fabrication_progress').upsert(rows.slice(i,i+400),
        { onConflict:'owner_id,assm_mk,part_mk,step_code' });
      sync(`保存中… ${Math.min(i+400,rows.length)}/${rows.length}`);
    }
    sync('保存済 · '+new Date().toLocaleTimeString('ja-JP'));
  }catch(e){ toast('保存エラー: '+e.message,'err'); sync('エラー'); }
}

//  稼働カレンダー設定

async function loadCompanyHolidays(){
  COMPANY_HOL = {};
  try{
    const { data, error } = await sb.from('company_holidays').select('*').order('holiday_date');
    if(error) throw error;
    (data||[]).forEach(r=>{ COMPANY_HOL[String(r.holiday_date).slice(0,10)] = r.label || '会社休日'; });
  }catch(e){
    // migration_v6 未適用でも動くようにする（祝日だけで計算する）
    console.warn('company_holidays を読めません（migration_v6 未適用？）', e.message);
  }
}

async function setWorkPattern(deptCode, pattern){
  const ph = PHASES.find(p=>p.dept_code===deptCode); if(!ph) return;
  const prev = ph.work_pattern;
  ph.work_pattern = pattern;
  const { error } = await sb.from('schedule_phases').update({ work_pattern:pattern }).eq('id', ph.id);
  if(error){
    ph.work_pattern = prev;
    toast('保存できません（migration_v6 未適用？）: '+error.message,'err');
  } else {
    recalcAll(); toast('稼働パターンを更新しました','ok');
  }
  go('settings');
}

async function addCompanyHoliday(){
  const d = $('chDate').value, l = $('chLabel').value.trim();
  if(!d){ toast('日付を入れてください','err'); return; }
  const { error } = await sb.from('company_holidays').insert({ holiday_date:d, label:l||'会社休日' });
  if(error){ toast(error.message,'err'); return; }
  await loadCompanyHolidays(); recalcAll();
  toast('会社休日を追加しました','ok'); go('settings');
}

async function delCompanyHoliday(dateStr){
  const { error } = await sb.from('company_holidays').delete().eq('holiday_date', dateStr);
  if(error){ toast(error.message,'err'); return; }
  await loadCompanyHolidays(); recalcAll();
  toast('削除しました','ok'); go('settings');
}

// 設定画面の「稼働カレンダー」カード
function calendarCard(){
  const yr = new Date().getFullYear();
  const years = [yr, yr+1];
  const comp = Object.keys(COMPANY_HOL).sort();
  return `
  <div class="card">
    <div class="card-h"><h3>稼働カレンダー</h3>
      <span class="muted" style="font-size:11.5px">日数はすべて稼働日で計算されます</span></div>
    <div class="card-b">
      <div class="sec-lbl" style="margin-top:0">部門別 稼働パターン</div>
      <table>
        <thead><tr><th>部門</th><th style="width:260px">稼働パターン</th><th>備考</th></tr></thead>
        <tbody>${PHASES.map(ph=>`
          <tr>
            <td><span class="ph-dot" style="background:${ph.colour}"></span> <b>${esc(ph.label_ja)}</b></td>
            <td><select onchange="setWorkPattern('${ph.dept_code}',this.value)"
                  style="width:100%;border:1px solid var(--border2);border-radius:var(--radius-s);padding:6px 9px;font-size:12px">
                  ${WORK_PATTERNS.map(w=>`<option value="${w.key}" ${patternOf(ph.dept_code)===w.key?'selected':''}>${w.label}</option>`).join('')}
                </select></td>
            <td class="muted" style="font-size:11.5px">${ph.counts_toward_need?'工期判定に含む':'工期判定に含まない'}</td>
          </tr>`).join('')}</tbody>
      </table>
      <p class="hint">工期判定（必要／利用可能）は会社標準の月〜金で測ります。各工程の配置はその部門のパターンに従います。</p>

      <div class="sec-lbl">会社休日（年末年始・お盆・工場休止など）</div>
      <div class="grid g3" style="margin-bottom:10px">
        <div class="fld" style="margin:0"><label>日付</label><input type="date" id="chDate"></div>
        <div class="fld" style="margin:0"><label>名称</label><input type="text" id="chLabel" placeholder="お盆休み"></div>
        <div style="display:flex;align-items:flex-end"><button class="btn btn-p" onclick="addCompanyHoliday()">＋ 追加</button></div>
      </div>
      ${comp.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">
        ${comp.map(d=>`<span class="pill" style="background:var(--danger-l);color:var(--danger)">
          ${d} ${esc(COMPANY_HOL[d])}
          <a onclick="delCompanyHoliday('${d}')" style="cursor:pointer;margin-left:5px;font-weight:700">×</a>
        </span>`).join('')}</div>`
      : `<p class="hint">会社休日は未登録です。国民の祝日のみで計算しています。</p>`}

      <div class="sec-lbl">国民の祝日（自動計算）</div>
      ${years.map(y=>{
        const h=jpHolidays(y);
        return `<div style="margin-bottom:8px">
          <div class="muted" style="font-size:11px;font-weight:700;margin-bottom:4px">${y}年 — ${Object.keys(h).length}日</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${Object.keys(h).sort().map(d=>`<span class="pill" style="background:var(--bg2);color:var(--muted)">${d.slice(5)} ${esc(h[d])}</span>`).join('')}
          </div></div>`;
      }).join('')}
      <p class="hint">祝日は法令に基づき計算しています（振替休日・国民の休日を含む）。春分・秋分は天文近似式のため、2099年まで有効です。</p>
    </div>
  </div>
`;
}

        <tbody>${PHASE_TASKS.length ? PHASE_TASKS.map(t=>{

  <div class="card">

        <tr><td class="muted">データベース</td><td class="mono">Supabase (PostgreSQL)</td></tr>
        <tr><td class="muted">プロジェクト階層</td><td class="mono">Project → 項目 → 工区</td></tr>
        <tr><td class="muted">スケジュール単位</td><td class="mono">工区（集計は自動）</td></tr>
        <tr><td class="muted">工程モデル</td><td class="mono">作業ベース 4工程＋サブ工程・双方向スケジュール</td></tr>
      </table>

async function saveProfile(){
  try{
    const { error } = await sb.from('profiles').update({
      full_name:$('stName').value.trim(), role:$('stRole').value
    }).eq('id',ME.id);
    if(error) throw error;
    ME.full_name=$('stName').value.trim(); ME.role=$('stRole').value;
    $('sbName').textContent=ME.full_name||ME.email;
    $('sbRole').textContent=roleLabel(ME.role);
    $('sbAv').textContent=(ME.full_name||ME.email||'U').trim().charAt(0).toUpperCase();
    toast('保存しました','ok');
  }catch(e){ toast('保存エラー: '+e.message,'err'); }
}
